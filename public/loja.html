<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vitrine App</title>
  <meta name="description" content="Produtos selecionados com carinho para você.">
  <meta name="theme-color" content="#16a6e0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vitrine">
  <meta property="og:description" content="Produtos selecionados com carinho para você.">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/app-touch-180.png">
  <script src="/config.js"></script>
  <style>
    :root {
      --accent: #16a6e0;
      --accent-ink: #ffffff;
      --accent-soft: color-mix(in srgb, var(--accent) 14%, #ffffff);
      --accent-deep: color-mix(in srgb, var(--accent) 78%, #000000);
      --bg: #eef0f4;
      --card: #ffffff;
      --ink: #14161b;
      --ink-2: #3b4150;
      --muted: #8a90a0;
      --line: #e6e8ee;
      --ok: #16a34a;
      --wa: #25d366;
      --wa-deep: #128c4b;
      --warn-bg: #fff7e6;
      --warn-ink: #8a5a00;
      --radius-lg: 26px;
      --radius: 20px;
      --radius-sm: 14px;
      --shadow: 0 1px 2px rgba(20, 22, 27, .04), 0 8px 24px rgba(20, 22, 27, .06);
      --shadow-lg: 0 20px 60px rgba(20, 22, 27, .18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --media: #f6f7f9;
      --chip: #f5f6f8;
    }
    /* Tema escuro (escolhido pelo lojista) */
    html.dark {
      color-scheme: dark;
      --accent-soft: color-mix(in srgb, var(--accent) 22%, #15181f);
      --accent-deep: color-mix(in srgb, var(--accent) 70%, #ffffff);
      --bg: #0e1015;
      --card: #191c24;
      --ink: #f1f3f7;
      --ink-2: #c9cdd7;
      --muted: #8e95a6;
      --line: #2a2e39;
      --warn-bg: #2b2414;
      --warn-ink: #f5cf7a;
      --media: #222631;
      --chip: #222631;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
    html.dark .btn-share, html.dark .btn-share-wide { background: color-mix(in srgb, var(--wa) 18%, #191c24); color: #6ee7a0; }
    html.dark .skeleton { background: linear-gradient(90deg, #1d2029 0%, #262a35 50%, #1d2029 100%); background-size: 200% 100%; }
    html.dark .hero-kicker { color: #14161b; }
    html.dark .badge:not(.ml):not(.shopee):not(.proprio) { background: rgba(20, 22, 30, .88); }
    html.dark .fav { background: rgba(20, 22, 30, .85); }
    html.dark .bottom-nav { background: rgba(25, 28, 36, .92); box-shadow: 0 10px 34px rgba(0, 0, 0, .5); }
    html.dark .hero-cta { background: #fff; color: #14161b; }
    html.dark .notice.city { background: color-mix(in srgb, var(--ok) 18%, #191c24); color: #a7f3c0; }
    /* Cards tingidos com a cor da loja */
    html.tinted { --card: color-mix(in srgb, var(--accent) 9%, #ffffff); --media: color-mix(in srgb, var(--accent) 5%, #ffffff); }
    html.dark.tinted { --card: color-mix(in srgb, var(--accent) 16%, #191c24); --media: color-mix(in srgb, var(--accent) 10%, #222631); }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    img { display: block; max-width: 100%; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 12px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    svg { flex-shrink: 0; }

    /* ---------- Estrutura ---------- */
    .app {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 16px calc(110px + var(--safe-bottom));
    }
    @media (min-width: 720px) { .app { padding: 24px 28px calc(120px + var(--safe-bottom)); } }

    .topbar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .icon-btn {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
      color: var(--ink-2);
      transition: transform .15s ease;
    }
    .icon-btn:active { transform: scale(.94); }
    .topbar-title { text-align: center; min-width: 0; }
    .topbar-title strong { display: block; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-title span { display: block; font-size: 12px; color: var(--muted); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; background: var(--accent-soft);
      box-shadow: 0 0 0 3px var(--card), var(--shadow);
      display: grid; place-items: center;
      font-weight: 800; color: var(--accent-deep);
      overflow: hidden;
    }

    .search-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 10px;
      height: 50px; padding: 0 16px;
      background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
      color: var(--muted);
    }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; color: var(--ink); }
    .search input::placeholder { color: var(--muted); }
    .filter-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent);
    }

    /* ---------- Banner ---------- */
    .hero {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: 1.1fr .9fr; align-items: center;
      min-height: 172px; padding: 20px;
      border-radius: var(--radius-lg);
      background:
        radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 55%, #ffffff) 0%, transparent 55%),
        linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 35%, transparent);
      margin-bottom: 18px;
    }
    .hero::after {
      content: ""; position: absolute; right: -40px; bottom: -60px;
      width: 220px; height: 220px; border-radius: 50%;
      background: rgba(255, 255, 255, .12);
    }
    .hero-text { position: relative; z-index: 1; min-width: 0; }
    /* Foto de capa: fundo do topo, com película escura para o texto ficar legível */
    .hero.has-cover { background: #1b1e26; min-height: 210px; align-items: end; box-shadow: 0 16px 40px rgba(0, 0, 0, .22); }
    .hero.has-cover::after { display: none; }
    .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .05) 0%, rgba(0, 0, 0, .35) 45%, rgba(0, 0, 0, .72) 100%); }
    .hero.has-cover .hero-text { text-shadow: 0 2px 12px rgba(0, 0, 0, .35); }
    .hero.has-cover .hero-art img, .hero.has-cover .hero-art .hero-initial { width: 96px; height: 96px; transform: none; border: 3px solid #fff; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); }
    .hero.has-cover .hero-art { align-self: end; justify-items: end; }
    @media (min-width: 720px) { .hero.has-cover { min-height: 300px; } }
    .hero-kicker {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, .92); color: var(--ink);
      font-size: 11px; font-weight: 700; letter-spacing: .02em;
      padding: 5px 10px; border-radius: 999px; margin-bottom: 10px;
    }
    .hero h1 { margin: 0 0 4px; font-size: clamp(22px, 5.4vw, 34px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; word-break: break-word; }
    .hero p { margin: 0 0 14px; font-size: 13px; opacity: .92; }
    .hero-cta {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; color: var(--ink);
      font-size: 13px; font-weight: 700; white-space: nowrap;
      padding: 9px 14px; border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
    }
    .hero-art { position: relative; z-index: 1; display: grid; place-items: center; }
    .hero-art img {
      width: min(100%, 210px); aspect-ratio: 1; object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, .7);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .22);
      transform: rotate(-6deg);
    }
    .hero-art .hero-initial {
      width: 120px; height: 120px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, .2); border: 3px solid rgba(255, 255, 255, .5);
      font-size: 48px; font-weight: 800;
    }
    @media (max-width: 400px) {
      .hero { grid-template-columns: 1fr 104px; gap: 8px; padding: 18px; }
      .hero-cta { padding: 9px 12px; font-size: 12.5px; }
    }
    @media (min-width: 720px) {
      .hero { min-height: 230px; padding: 32px 40px; }
      .hero p { font-size: 15px; }
    }

    /* ---------- Chips ---------- */
    .chips { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px 8px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
      height: 42px; padding: 0 16px;
      background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
      font-size: 13px; font-weight: 600; color: var(--ink-2);
      transition: background .15s, color .15s;
    }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 2px 12px; }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .section-head small { color: var(--muted); font-weight: 600; font-size: 13px; margin-left: 6px; }
    .view-toggle { display: flex; background: var(--card); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
    .view-toggle button { width: 34px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); }
    .view-toggle button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-deep); }

    /* ---------- Produtos ---------- */
    .products { display: grid; gap: 14px; }
    .products.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 640px) { .products.grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; } }
    @media (min-width: 960px) { .products.grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .products.list { grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 860px) { .products.list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; } }

    .card {
      position: relative; display: flex; flex-direction: column;
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; min-width: 0;
      animation: rise .35s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .card-media {
      position: relative; display: grid; place-items: center;
      aspect-ratio: 1 / .92; width: 100%;
      background: var(--media); overflow: hidden;
    }
    .card-media .halo {
      position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--halo) 38%, var(--media)) 0%, color-mix(in srgb, var(--halo) 18%, var(--media)) 55%, transparent 72%);
    }
    .card-media img {
      position: relative; width: 82%; height: 82%; object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .14));
      transition: transform .3s ease;
    }
    .card-media img.cover { width: 100%; height: 100%; object-fit: cover; filter: none; }
    .card:hover .card-media img { transform: scale(1.04); }
    .card-media .placeholder { position: relative; color: color-mix(in srgb, var(--halo) 70%, #000); opacity: .55; }
    .badge {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      display: inline-flex; align-items: center; gap: 5px; max-width: calc(100% - 60px);
      font-size: 11px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap;
      padding: 4px 9px 4px 5px; border-radius: 999px; background: rgba(255, 255, 255, .95); color: var(--ink-2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
    }
    .ptag { position: absolute; z-index: 2; left: 10px; top: 40px; font-size: 10.5px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap;
      padding: 3px 8px; border-radius: 999px; color: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .14); pointer-events: none; }
    .ptag.hot { background: linear-gradient(135deg, #ff7a18, #ff3d3d); }
    .ptag.new { background: linear-gradient(135deg, #7c5cff, #19a7ff); }
    .products.list .ptag { top: 36px; left: 8px; }
    .badge i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
    .badge.ml { color: #2d3277; background: #fff159; }
    .badge.ml i { background: #2d3277; color: #fff159; }
    .badge.shopee { color: #fff; background: #ee4d2d; }
    .badge.shopee i { background: #fff; color: #ee4d2d; }
    .badge.proprio { color: var(--accent-ink); background: var(--accent); }
    .badge.proprio i { background: rgba(255, 255, 255, .9); color: var(--accent-deep); }
    .old-price { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .old-price s { font-weight: 600; }
    .off { font-size: 10.5px; font-weight: 800; color: #fff; background: #16a34a; padding: 2px 6px; border-radius: 6px; }
    .fav {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, .9); color: #9aa0ad;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      transition: transform .15s ease;
    }
    .fav:active { transform: scale(.88); }
    .fav[aria-pressed="true"] { color: #e11d48; }
    .fav[aria-pressed="true"] svg { fill: currentColor; }

    .card-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 12px; flex: 1; min-width: 0; }
    .card-title { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-desc { margin: 0; font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .price small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
    .price-alt { font-size: 13px; font-weight: 700; color: var(--accent-deep); }
    .notice {
      display: flex; gap: 6px; align-items: flex-start;
      font-size: 11px; line-height: 1.35; padding: 7px 9px; border-radius: 10px;
      background: var(--warn-bg); color: var(--warn-ink);
    }
    .notice.city { background: color-mix(in srgb, var(--ok) 10%, #fff); color: #14532d; }
    .notice svg { margin-top: 1px; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .btn-buy {
      flex: 1; min-width: 0; height: 42px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 12px; background: var(--accent); color: var(--accent-ink);
      font-size: 13px; font-weight: 700; white-space: nowrap;
      box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 30%, transparent);
      transition: transform .15s ease, filter .15s;
    }
    .btn-buy.wa { background: var(--wa-deep); box-shadow: 0 6px 14px rgba(18, 140, 75, .25); }
    .btn-buy:active, .btn-share:active { transform: scale(.96); }
    .btn-buy:hover { filter: brightness(1.05); }
    .btn-share {
      width: 42px; height: 42px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 12px; background: color-mix(in srgb, var(--wa) 14%, #fff); color: var(--wa-deep);
      transition: transform .15s ease;
    }
    .btn-share:hover { background: color-mix(in srgb, var(--wa) 22%, #fff); }

    /* Modo lista */
    .products.list .card { flex-direction: row; align-items: stretch; }
    .products.list .card-media { width: 38%; max-width: 170px; aspect-ratio: auto; min-height: 150px; flex-shrink: 0; }
    .products.list .card-desc { -webkit-line-clamp: 3; }
    .products.list .badge { top: 8px; left: 8px; }
    .products.list .fav { top: auto; right: auto; bottom: 8px; left: 8px; }
    .products.list .card-body { padding: 14px; }
    @media (max-width: 380px) {
      .products.grid .card-body { padding: 10px; }
      .products.grid .btn-buy { font-size: 12px; }
    }

    /* ---------- Estados ---------- */
    .skeleton { background: linear-gradient(90deg, #e9ebf0 0%, #f5f6f8 50%, #e9ebf0 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius); }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .state {
      max-width: 460px; margin: 10vh auto 0; text-align: center;
      background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow);
      padding: 34px 26px;
    }
    .state .state-icon { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 22px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep); }
    .state h1, .state h2 { margin: 0 0 8px; font-size: 21px; }
    .state p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .state form { display: flex; gap: 8px; }
    .state input { flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 1.5px solid var(--line); padding: 0 14px; font-size: 15px; outline: none; }
    .state input:focus { border-color: var(--accent); }
    .btn-primary { height: 48px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 16px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
    .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

    .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
    .footer a { font-weight: 700; color: var(--ink-2); }

    /* ---------- Navegação inferior ---------- */
    .bottom-nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(14px + var(--safe-bottom)); z-index: 40;
      width: min(92vw, 420px); height: 66px;
      display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
      background: rgba(255, 255, 255, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: 999px; box-shadow: 0 10px 34px rgba(20, 22, 27, .16);
      padding: 0 10px;
    }
    .bottom-nav button {
      position: relative; height: 50px; display: grid; place-items: center; gap: 0;
      color: #9aa0ad; border-radius: 999px; font-size: 10px; font-weight: 700;
    }
    .bottom-nav button span { line-height: 1; margin-top: -4px; }
    .bottom-nav button[aria-current="true"] { color: var(--accent); }
    .bottom-nav .count {
      position: absolute; top: 4px; left: 54%; min-width: 17px; height: 17px; padding: 0 4px;
      border-radius: 999px; background: #e11d48; color: #fff; font-size: 10px; display: grid; place-items: center;
    }

    /* ---------- Carrinho (produtos da região) ---------- */
    .btn-buy.in-cart { background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--accent-deep); box-shadow: none; }
    html.dark .btn-buy.in-cart { color: var(--ink); }
    .btn-wa-mini { width: 42px; height: 42px; flex-shrink: 0; display: grid; place-items: center; border-radius: 12px; background: var(--wa-deep); color: #fff; }
    .cart-bar {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 41;
      bottom: calc(90px + var(--safe-bottom)); width: min(92vw, 420px);
      display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px;
      border-radius: 18px; background: var(--ink); color: var(--bg); box-shadow: 0 14px 34px rgba(0, 0, 0, .28);
      font-size: 13.5px; font-weight: 700; animation: cartRise .25s ease;
    }
    html.dark .cart-bar { background: #f1f3f7; color: #14161b; }
    .cart-bar .cart-info { flex: 1; min-width: 0; }
    .cart-bar small { display: block; font-weight: 600; opacity: .7; font-size: 12px; }
    .cart-bar button { height: 42px; padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13.5px; white-space: nowrap; }
    @keyframes cartRise { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .cart-list { display: grid; gap: 10px; margin: 6px 0 14px; max-height: 42vh; overflow: auto; }
    .cart-item { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--chip); }
    .cart-item img, .cart-item .ph { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--media); flex-shrink: 0; display: grid; place-items: center; color: var(--muted); }
    .cart-item .ci { flex: 1; min-width: 0; }
    .cart-item .ci strong { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item .ci small { color: var(--muted); font-size: 12px; }
    .qty { display: flex; align-items: center; gap: 4px; }
    .qty button { width: 30px; height: 30px; border-radius: 9px; background: var(--card); font-weight: 800; font-size: 16px; color: var(--ink); }
    .qty b { min-width: 22px; text-align: center; font-size: 14px; }
    .cart-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; margin: 4px 2px 12px; }
    .cart-total b { font-size: 20px; }
    .cart-field { display: block; margin-bottom: 10px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
    .cart-field input, .cart-field textarea { display: block; width: 100%; margin-top: 5px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; resize: vertical; }
    .btn-checkout { width: 100%; height: 52px; border-radius: 16px; background: var(--wa-deep); color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .cart-empty-btn { width: 100%; margin-top: 8px; height: 40px; border-radius: 12px; color: var(--muted); font-weight: 700; font-size: 13px; }
    .bottom-nav.no-contact { grid-template-columns: repeat(3, 1fr); }
    .hero-art .feat { position: relative; display: grid; justify-items: center; cursor: pointer; }
    .hero-art .feat-tag { position: absolute; top: -4px; right: -2px; z-index: 2; background: #fff; color: #14161b; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.18); white-space: nowrap; }
    .hero.no-art { grid-template-columns: 1fr; }

    /* ---------- Painéis (detalhes / ordenação) ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(12, 14, 20, .45); backdrop-filter: blur(2px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      background: var(--card); border-radius: 28px 28px 0 0;
      padding: 10px 20px calc(22px + var(--safe-bottom));
      transform: translateY(30px); transition: transform .25s ease;
      overscroll-behavior: contain;
    }
    .overlay.open .sheet { transform: none; }
    @media (min-width: 720px) {
      .overlay { align-items: center; }
      .sheet { border-radius: 28px; padding: 14px 26px 26px; }
    }
    .grabber { width: 44px; height: 5px; border-radius: 99px; background: #d9dce3; margin: 4px auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .sheet-head h3 { margin: 0; font-size: 18px; }
    .detail-media { position: relative; border-radius: 22px; background: var(--media); aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; margin-bottom: 16px; }
    .detail-media .halo { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 34%, #fff) 0%, transparent 70%); }
    .detail-media img { position: relative; max-width: 86%; max-height: 86%; object-fit: contain; filter: drop-shadow(0 14px 20px rgba(0, 0, 0, .16)); }
    .detail-media img.cover { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: cover; filter: none; }
    .detail-title { margin: 0 0 6px; font-size: 21px; line-height: 1.2; }
    .detail-desc { white-space: pre-line; color: var(--ink-2); font-size: 14px; margin: 10px 0 14px; }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .detail-actions .btn-buy, .detail-actions .btn-share-wide { height: 52px; font-size: 14px; border-radius: 16px; }
    .btn-share-wide { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; background: color-mix(in srgb, var(--wa) 14%, #fff); color: var(--wa-deep); }
    .sort-list { display: grid; gap: 8px; }
    .sort-list button { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: var(--chip); font-weight: 600; text-align: left; }
    .sort-list button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent-deep); }

    .toast {
      position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom)); z-index: 80;
      transform: translate(-50%, 20px); opacity: 0;
      background: #14161b; color: #fff; font-size: 13px; font-weight: 600;
      padding: 11px 16px; border-radius: 999px; box-shadow: var(--shadow-lg);
      transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

  <script>
  (() => {
    'use strict';

    const API = String(window.VITRINE_API_BASE || '').replace(/\/+$/, '');
    // Selos genéricos com as cores de cada plataforma (sem usar as logos oficiais).
    const MARK = {
      cart: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>',
      bag: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
      pin: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
    };
    const PLATFORM = {
      mercadolivre: { label: 'Mercado Livre', short: 'Mercado Livre', cls: 'ml', color: '#f5c400', mark: MARK.cart },
      shopee: { label: 'Shopee', short: 'Shopee', cls: 'shopee', color: '#ee4d2d', mark: MARK.bag },
      proprio: { label: 'Da região', short: 'Da região', cls: 'proprio', color: null, mark: MARK.pin },
    };
    const HALOS = ['#16a6e0', '#f59e0b', '#a3e635', '#6366f1', '#ec4899', '#14b8a6', '#f97316', '#8b5cf6'];

    const ICON = {
      search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
      sliders: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
      heart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-8.7C1.4 8.4 3 5 6.4 5c2 0 3.3 1.1 4 2.3h3.2C14.3 6.1 15.6 5 17.6 5 21 5 22.6 8.4 21.2 11.3 19 15.6 12 20 12 20z"/></svg>',
      wa: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.2-.3-.3-.5-.4z"/></svg>',
      cart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.5L22 8H6"/></svg>',
      bag: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
      external: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
      info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
      pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
      grid: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
      list: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1.6"/><rect x="11" y="5.5" width="10" height="3" rx="1.5"/><rect x="3" y="14" width="6" height="6" rx="1.6"/><rect x="11" y="15.5" width="10" height="3" rx="1.5"/></svg>',
      box: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>',
      close: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
      check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
      store: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/></svg>',
      clock: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    };

    const SORTS = [
      { id: 'default', label: 'Destaques da loja' },
      { id: 'recent', label: 'Mais recentes' },
      { id: 'price_asc', label: 'Menor preço' },
      { id: 'price_desc', label: 'Maior preço' },
      { id: 'name', label: 'Nome (A–Z)' },
    ];

    const state = {
      slug: '',
      store: null,
      settings: null,
      products: [],
      query: '',
      filter: 'all',
      sort: 'default',
      view: 'grid',
      favs: new Set(),
      cart: {},      // { idDoProduto: quantidade }
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const app = $('#app');
    const overlay = $('#overlay');
    const sheet = $('#sheet');

    /* ---------------- Utilidades ---------------- */
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const brl = (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const safeUrl = (u, allowData) => {
      const s = String(u || '').trim();
      if (allowData && /^data:image\/(png|jpe?g|webp);base64,/i.test(s)) return s;
      return /^https?:\/\//i.test(s) ? s : '';
    };
    const normalize = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const storeUrl = () => `${location.origin}/s/${state.slug}`;
    const productUrl = (p) => `${storeUrl()}?p=${p.id}`;
    const isAffiliate = (p) => p.platform === 'mercadolivre' || p.platform === 'shopee';
    const waLink = (phone, text) => `https://api.whatsapp.com/send?${phone ? `phone=${encodeURIComponent(phone)}&` : ''}text=${encodeURIComponent(text)}`;
    const storage = {
      get(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } },
      set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* modo privado */ } },
    };

    let toastTimer;
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function applyTheme(hex) {
      const color = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#16a6e0';
      const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      document.documentElement.style.setProperty('--accent', color);
      document.documentElement.style.setProperty('--accent-ink', luminance > 0.68 ? '#14161b' : '#ffffff');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', color);
    }

    function getSlug() {
      const m = location.pathname.match(/^\/s\/([a-z0-9-]{3,40})\/?$/i);
      if (m) return m[1].toLowerCase();
      const q = new URLSearchParams(location.search).get('loja');
      return q ? q.trim().toLowerCase() : '';
    }

    /* ---------------- Preço e avisos ---------------- */
    function priceBlock(p) {
      const s = state.settings;
      if (!s.show_prices) {
        return isAffiliate(p)
          ? `<div class="price-alt">Ver preço ${p.platform === 'shopee' ? 'na' : 'no'} ${esc(PLATFORM[p.platform].label)}</div>`
          : `<div class="price-alt">Consulte o preço</div>`;
      }
      if (p.price === null || p.price === undefined || p.price === '') {
        return isAffiliate(p)
          ? `<div class="price-alt">Ver preço ${p.platform === 'shopee' ? 'na' : 'no'} ${esc(PLATFORM[p.platform].label)}</div>`
          : `<div class="price-alt">Preço sob consulta</div>`;
      }
      const orig = Number(p.original_price);
      const old = orig > Number(p.price)
        ? `<div class="old-price"><s>${brl(orig)}</s><span class="off">-${Math.round((1 - Number(p.price) / orig) * 100)}%</span></div>` : '';
      return `${old}<div class="price">${isAffiliate(p) && !old ? '<small>Preço de referência</small>' : ''}${brl(p.price)}</div>`;
    }

    function noticeBlock(p) {
      const parts = [];
      if (isAffiliate(p) && state.settings.show_stock_warning) {
        const site = p.platform === 'shopee' ? 'pela Shopee' : 'pelo Mercado Livre';
        parts.push(`<p class="notice">${ICON.info}<span><b>Vendido e entregue ${site}.</b> O preço é atualizado todo dia; o valor final é o do site.</span></p>`);
      }
      if (p.is_physical && String(p.delivery_cities || '').trim()) {
        parts.push(`<p class="notice city">${ICON.pin}<span><b>Entrega em:</b> ${esc(p.delivery_cities)}</span></p>`);
      }
      return parts.join('');
    }

    /* ---------------- Carrinho (produtos da região) ---------------- */
    // Produto da região sem link externo: vai para o carrinho e o pedido fecha no WhatsApp da loja.
    const isLocal = (p) => p.platform === 'proprio' && !safeUrl(p.affiliate_link);
    const hasPrice = (p) => state.settings.show_prices && p.price !== null && p.price !== undefined && p.price !== '';
    const cartCount = () => Object.values(state.cart).reduce((a, b) => a + b, 0);
    function saveCart() { storage.set(`vitrine:cart:${state.slug}`, state.cart); }
    function cartLines() {
      return Object.entries(state.cart)
        .map(([id, qty]) => ({ p: state.products.find((x) => x.id === Number(id)), qty }))
        .filter((x) => x.p && x.qty > 0);
    }
    function totalOf(lines) {
      const priced = lines.filter((l) => hasPrice(l.p));
      return { total: priced.reduce((a, l) => a + Number(l.p.price) * l.qty, 0), allPriced: priced.length === lines.length };
    }
    function addToCart(id, delta = 1) {
      const next = (state.cart[id] || 0) + delta;
      if (next <= 0) delete state.cart[id]; else state.cart[id] = Math.min(next, 99);
      saveCart();
    }
    function orderMessage(lines, { name = '', note = '' } = {}) {
      const { total, allPriced } = totalOf(lines);
      const msg = [`Olá! 😊 Quero fazer um pedido pela vitrine *${state.store.store_name}*:`, '', '🛒 *Meu pedido*'];
      lines.forEach(({ p, qty }) => msg.push(`• ${qty}x ${p.title}${hasPrice(p) ? ` — ${brl(Number(p.price) * qty)}` : ' — valor a combinar'}`));
      if (total > 0) msg.push('', `💰 *Total: ${brl(total)}*${allPriced ? '' : ' (+ itens a combinar)'}`);
      if (name.trim()) msg.push('', `👤 Nome: ${name.trim()}`);
      if (note.trim()) msg.push(`📝 Obs.: ${note.trim()}`);
      msg.push('', 'Aguardo a confirmação do pedido. Obrigado!');
      return msg.join('\n');
    }
    function orderNow(p) {
      window.open(waLink(state.store.whatsapp, orderMessage([{ p, qty: 1 }])), '_blank', 'noopener');
    }

    function renderCartBar() {
      let bar = $('#cartBar');
      const n = cartCount();
      if (!n || !state.store || !state.store.whatsapp) { if (bar) bar.remove(); return; }
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'cartBar';
        bar.className = 'cart-bar';
        document.body.appendChild(bar);
      }
      const { total, allPriced } = totalOf(cartLines());
      bar.innerHTML = `${ICON.cart}<div class="cart-info">${n} ${n === 1 ? 'item' : 'itens'} no carrinho
          <small>${total > 0 ? `${brl(total)}${allPriced ? '' : ' + a combinar'}` : 'Valores a combinar'}</small></div>
        <button type="button" data-cart="open">Ver pedido</button>`;
    }

    function openCart() {
      const lines = cartLines();
      if (!lines.length) { closeSheet(); return toast('Seu carrinho está vazio'); }
      const { total, allPriced } = totalOf(lines);
      const saved = storage.get('vitrine:buyer') || {};
      const name = ($('#buyerName') || {}).value ?? saved.name ?? '';
      const note = ($('#buyerNote') || {}).value ?? '';
      openSheet(`
        <div class="grabber"></div>
        <div class="sheet-head"><h3 id="sheetTitle">🛒 Seu pedido</h3>
          <button type="button" class="icon-btn" data-close aria-label="Fechar">${ICON.close}</button></div>
        <div class="cart-list">${lines.map(({ p, qty }) => {
          const img = safeUrl(p.image_url, true);
          return `<div class="cart-item">${img ? `<img src="${esc(img)}" alt="">` : `<span class="ph">${ICON.box}</span>`}
            <div class="ci"><strong>${esc(p.title)}</strong><small>${hasPrice(p) ? `${brl(p.price)} cada` : 'Valor a combinar'}</small></div>
            <div class="qty"><button type="button" data-qty="${p.id}" data-d="-1" aria-label="Menos">−</button><b>${qty}</b><button type="button" data-qty="${p.id}" data-d="1" aria-label="Mais">+</button></div></div>`;
        }).join('')}</div>
        ${total > 0 ? `<div class="cart-total"><span>Total${allPriced ? '' : ' (sem os itens a combinar)'}</span><b>${brl(total)}</b></div>` : ''}
        <label class="cart-field">Seu nome (opcional)<input id="buyerName" maxlength="60" autocomplete="name" value="${esc(name)}"></label>
        <label class="cart-field">Observação (opcional)<textarea id="buyerNote" rows="2" maxlength="300" placeholder="Ex.: bairro para entrega, tamanho, cor...">${esc(note)}</textarea></label>
        <button type="button" class="btn-checkout" data-cart="checkout">${ICON.wa}Finalizar pedido no WhatsApp</button>
        <button type="button" class="cart-empty-btn" data-cart="clear">Esvaziar carrinho</button>`);
    }

    function checkout() {
      hit('order');
      const name = ($('#buyerName') || {}).value || '';
      const note = ($('#buyerNote') || {}).value || '';
      storage.set('vitrine:buyer', { name });
      window.open(waLink(state.store.whatsapp, orderMessage(cartLines(), { name, note })), '_blank', 'noopener');
      toast('Pedido montado! É só enviar no WhatsApp ✅');
    }

    // Métrica do painel: clique em comprar/adicionar ou pedido no WhatsApp (não atrasa nada para o cliente).
    function hit(type, product) {
      try {
        const url = `${API}/api/store/${encodeURIComponent(state.slug)}/hit`;
        const body = JSON.stringify(product ? { type, product: Number(product) } : { type });
        if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
        else fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true });
      } catch { /* métrica não é crítica */ }
    }

    function buyButton(p, extraClass = '') {
      if (isLocal(p) && state.store.whatsapp) {
        const q = state.cart[p.id] || 0;
        return `<button type="button" class="btn-buy ${q ? 'in-cart' : ''} ${extraClass}" data-add="${p.id}">${q ? ICON.check : ICON.cart}<span>${q ? `No carrinho (${q})` : 'Adicionar'}</span></button>`;
      }
      const link = safeUrl(p.affiliate_link);
      if (link) {
        const label = isAffiliate(p) ? 'Ver oferta' : 'Comprar';
        return `<a class="btn-buy ${extraClass}" data-pid="${p.id}" href="${esc(link)}" target="_blank" rel="noopener noreferrer sponsored">${isAffiliate(p) ? ICON.external : ICON.bag}<span>${label}</span></a>`;
      }
      const msg = `Olá! Vi na sua vitrine e tenho interesse em: ${p.title}\n${productUrl(p)}`;
      return `<a class="btn-buy wa ${extraClass}" data-pid="${p.id}" href="${esc(waLink(state.store.whatsapp, msg))}" target="_blank" rel="noopener noreferrer">${ICON.wa}<span>Pedir</span></a>`;
    }

    function shareMessage(p) {
      const lines = [`🛍️ *${p.title}*`];
      const desc = String(p.description || '').trim();
      if (desc) lines.push(desc.length > 160 ? desc.slice(0, 157).trimEnd() + '...' : desc);
      if (state.settings.show_prices && p.price !== null && p.price !== undefined && p.price !== '') {
        lines.push(`💰 *${brl(p.price)}*${isAffiliate(p) ? ' (pode variar no site)' : ''}`);
      }
      if (p.is_physical && String(p.delivery_cities || '').trim()) lines.push(`📍 Entrega em: ${p.delivery_cities}`);
      if (isAffiliate(p)) lines.push(`🏷️ Oferta no ${PLATFORM[p.platform].label}`);
      lines.push('', `👉 Veja aqui: ${productUrl(p)}`, '', `Mais achadinhos na vitrine *${state.store.store_name}*`);
      return lines.join('\n');
    }

    function shareProduct(p) {
      window.open(waLink('', shareMessage(p)), '_blank', 'noopener');
    }

    /* ---------------- Renderização ---------------- */
    function filteredProducts() {
      const q = normalize(state.query);
      let list = state.products.filter((p) => {
        if (state.filter === 'favs' && !state.favs.has(p.id)) return false;
        if (['mercadolivre', 'shopee', 'proprio'].includes(state.filter) && p.platform !== state.filter) return false;
        if (state.filter.startsWith('cat:') && String(p.category || '') !== state.filter.slice(4)) return false;
        if (q && !normalize(`${p.title} ${p.description} ${p.delivery_cities} ${p.category || ''}`).includes(q)) return false;
        return true;
      });
      const priceOf = (p) => (p.price === null || p.price === undefined ? null : Number(p.price));
      const byPrice = (dir) => (a, b) => {
        const pa = priceOf(a), pb = priceOf(b);
        if (pa === null && pb === null) return 0;
        if (pa === null) return 1;
        if (pb === null) return -1;
        return dir * (pa - pb);
      };
      if (state.sort === 'recent') list = [...list].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
      if (state.sort === 'price_asc') list = [...list].sort(byPrice(1));
      if (state.sort === 'price_desc') list = [...list].sort(byPrice(-1));
      if (state.sort === 'name') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'pt-BR'));
      return list;
    }

    function mediaHtml(p, i, cls = 'card-media') {
      const img = safeUrl(p.image_url, true);
      const halo = PLATFORM[p.platform]?.color || HALOS[i % HALOS.length];
      if (cls === 'detail-media') {
        return `<div class="detail-media">${img ? `<span class="halo"></span><img src="${esc(img)}" alt="${esc(p.title)}" onload="if(this.naturalWidth/this.naturalHeight>1.25||this.naturalHeight/this.naturalWidth>1.25){this.classList.add('cover')}">` : `<span class="placeholder">${ICON.box}</span>`}</div>`;
      }
      return `<button type="button" class="card-media" data-open="${p.id}" style="--halo:${esc(halo)}" aria-label="Ver detalhes de ${esc(p.title)}">
          <span class="halo"></span>
          ${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async">` : `<span class="placeholder">${ICON.box}</span>`}
        </button>`;
    }

    function tagHtml(p) {
      if (p.tag === 'hot') return '<span class="ptag hot">🔥 Mais clicado</span>';
      if (p.tag === 'new') return '<span class="ptag new">✨ Novo</span>';
      return '';
    }

    function cardHtml(p, i) {
      const plat = PLATFORM[p.platform] || PLATFORM.proprio;
      const fav = state.favs.has(p.id);
      return `<article class="card" style="animation-delay:${Math.min(i, 12) * 30}ms">
        ${mediaHtml(p, i)}
        <span class="badge ${plat.cls}"><i>${plat.mark}</i>${esc(plat.short)}</span>
        ${tagHtml(p)}
        <button type="button" class="fav" data-fav="${p.id}" aria-pressed="${fav}" aria-label="${fav ? 'Remover dos' : 'Adicionar aos'} favoritos">${ICON.heart}</button>
        <div class="card-body">
          <h3 class="card-title">${esc(p.title)}</h3>
          ${p.description ? `<p class="card-desc">${esc(p.description)}</p>` : ''}
          ${priceBlock(p)}
          ${noticeBlock(p)}
          <div class="card-actions">
            ${buyButton(p)}
            ${isLocal(p) && state.store.whatsapp
              ? `<button type="button" class="btn-wa-mini" data-order="${p.id}" aria-label="Pedir só este pelo WhatsApp" title="Pedir só este pelo WhatsApp">${ICON.wa}</button>`
              : `<button type="button" class="btn-share" data-share="${p.id}" aria-label="Compartilhar ${esc(p.title)} no WhatsApp" title="Compartilhar no WhatsApp">${ICON.wa}</button>`}
          </div>
        </div>
      </article>`;
    }

    function renderProducts() {
      const box = $('#products');
      if (!box) return;
      const list = filteredProducts();
      box.className = `products ${state.view}`;
      $('#productCount').textContent = `${list.length} ${list.length === 1 ? 'item' : 'itens'}`;
      if (!list.length) {
        const msg = state.filter === 'favs'
          ? '<strong>Nenhum favorito ainda</strong>Toque no coração dos produtos para salvar aqui.'
          : state.products.length
            ? '<strong>Nada encontrado</strong>Tente outra busca ou outro filtro.'
            : '<strong>Vitrine em montagem</strong>Em breve teremos novidades por aqui.';
        box.innerHTML = `<div class="empty">${msg}</div>`;
      } else {
        box.innerHTML = list.map(cardHtml).join('');
      }
      document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)));
      document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
      document.querySelectorAll('[data-nav]').forEach((b) => {
        const active = (b.dataset.nav === 'favs' && state.filter === 'favs') || (b.dataset.nav === 'home' && state.filter !== 'favs');
        b.setAttribute('aria-current', String(active));
      });
      const count = $('#favCount');
      count.hidden = state.favs.size === 0;
      count.textContent = state.favs.size;
      renderCartBar();
    }

    function renderStore() {
      const s = state.store;
      const avatar = safeUrl(s.avatar_url, true);
      const cover = safeUrl(s.cover_url, true);
      // Cartão de apresentação mostra o produto em destaque (o 1º da ordem da loja: fixados primeiro), não a logo.
      const featured = state.products.find((p) => safeUrl(p.image_url, true));
      const heroImg = featured ? safeUrl(featured.image_url, true) : '';
      const showWa = state.settings.show_whatsapp !== 0 && !!s.whatsapp;
      const platforms = new Set(state.products.map((p) => p.platform));
      const catCount = new Map();
      state.products.forEach((p) => { const c = String(p.category || '').trim(); if (c) catCount.set(c, (catCount.get(c) || 0) + 1); });
      const cats = [...catCount.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR')).map(([c]) => c);
      const chips = [
        { id: 'all', label: 'Todos', icon: ICON.grid },
        ...cats.map((c) => ({ id: `cat:${c}`, label: c, icon: '' })),
        ...['mercadolivre', 'shopee', 'proprio'].filter((k) => platforms.has(k)).map((k) => ({
          id: k, label: PLATFORM[k].label,
          icon: `<span class="dot" style="background:${PLATFORM[k].color || 'var(--accent)'}"></span>`,
        })),
        { id: 'favs', label: 'Favoritos', icon: ICON.heart },
      ];
      // Cada loja é uma marca: o topo não mostra o nome da pessoa dona da conta.
      const mode = state.settings.store_mode;
      const kicker = mode === 'local' ? '📍 Entrega na região' : mode === 'affiliate' ? '✨ Achadinhos selecionados' : '✨ Seleção especial';
      const tagline = mode === 'local' ? 'Escolha seus produtos e faça o pedido pelo WhatsApp.' : 'Achados escolhidos a dedo para você.';

      app.innerHTML = `
        <header class="topbar">
          <button type="button" class="icon-btn" id="btnTop" aria-label="Voltar ao início">${ICON.grid}</button>
          <div class="topbar-title"><strong>${esc(s.store_name)}</strong><span>${state.products.length} produtos selecionados</span></div>
          ${avatar ? `<img class="avatar" src="${esc(avatar)}" alt="${esc(s.store_name)}">` : `<div class="avatar" aria-hidden="true">${esc(initials(s.store_name))}</div>`}
        </header>

        <div class="search-row">
          <label class="search">${ICON.search}<span class="sr-only">Buscar</span>
            <input id="search" type="search" placeholder="Buscar produtos" autocomplete="off" enterkeyhint="search">
          </label>
          <button type="button" class="filter-btn" id="btnSort" aria-label="Ordenar produtos">${ICON.sliders}</button>
        </div>

        ${state.settings.show_banner === 0 ? '' : `<section class="hero${cover ? ' has-cover' : ''}${featured ? '' : ' no-art'}" aria-label="Sobre a loja">
          ${cover ? `<div class="hero-bg" id="heroBg" style="background-image:url('${esc(cover)}')"></div><div class="hero-shade"></div>` : ''}
          <div class="hero-text">
            <span class="hero-kicker">${kicker}</span>
            <h1>${esc(s.store_name)}</h1>
            <p>${tagline}</p>
            ${showWa ? `<a class="hero-cta" href="${esc(waLink(s.whatsapp, `Olá! Vim pela sua vitrine ${s.store_name} 😊`))}" target="_blank" rel="noopener noreferrer">${ICON.wa}Chamar no WhatsApp</a>` : ''}
          </div>
          ${featured ? `<div class="hero-art"><button type="button" class="feat" data-open="${featured.id}" aria-label="Ver destaque: ${esc(featured.title)}">
            <span class="feat-tag">⭐ Destaque</span><img src="${esc(heroImg)}" alt=""></button></div>` : ''}
        </section>`}

        <nav class="chips" aria-label="Filtrar por categoria e origem">
          ${chips.map((c) => `<button type="button" class="chip" data-filter="${esc(c.id)}" aria-pressed="false">${c.icon}${esc(c.label)}</button>`).join('')}
        </nav>

        <div class="section-head">
          <h2>Produtos<small id="productCount"></small></h2>
          <div class="view-toggle" role="group" aria-label="Modo de exibição">
            <button type="button" data-view="grid" aria-label="Grade">${ICON.grid}</button>
            <button type="button" data-view="list" aria-label="Lista">${ICON.list}</button>
          </div>
        </div>

        <section id="products" class="products grid" aria-label="Lista de produtos"></section>

        <footer class="footer">Vitrine criada com <a href="/">Vitrine App</a> · Crie a sua grátis por 7 dias</footer>
      `;
      $('#bottomNav').hidden = false;
      const showContact = state.settings.show_whatsapp !== 0 && !!s.whatsapp;
      $('[data-nav="contact"]').hidden = !showContact;
      $('#bottomNav').classList.toggle('no-contact', !showContact);
      renderProducts();
    }

    function renderState({ icon, title, text, extra = '' }) {
      $('#bottomNav').hidden = true;
      app.innerHTML = `<section class="state"><div class="state-icon">${icon}</div><h1>${title}</h1><p>${text}</p>${extra}</section>`;
    }


    /* ---------------- Painéis ---------------- */
    let lastFocus = null;
    function openSheet(html) {
      lastFocus = document.activeElement;
      sheet.innerHTML = html;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      const focusable = sheet.querySelector('button, a');
      if (focusable) focusable.focus({ preventScroll: true });
    }
    function closeSheet() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      const url = new URL(location.href);
      if (url.searchParams.has('p')) { url.searchParams.delete('p'); history.replaceState(null, '', url); }
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }

    function openProduct(id) {
      const i = state.products.findIndex((p) => p.id === id);
      if (i < 0) return;
      const p = state.products[i];
      const plat = PLATFORM[p.platform] || PLATFORM.proprio;
      const url = new URL(location.href);
      url.searchParams.set('p', p.id);
      history.replaceState(null, '', url);
      openSheet(`
        <div class="grabber"></div>
        <div class="sheet-head"><span class="badge ${plat.cls}" style="position:static"><i>${plat.mark}</i>${esc(plat.label)}</span>
          <button type="button" class="icon-btn" data-close aria-label="Fechar">${ICON.close}</button></div>
        ${mediaHtml(p, i, 'detail-media')}
        <h3 class="detail-title" id="sheetTitle">${esc(p.title)}</h3>
        ${priceBlock(p)}
        ${p.description ? `<p class="detail-desc">${esc(p.description)}</p>` : ''}
        <div style="display:grid;gap:8px">${noticeBlock(p)}</div>
        <div class="detail-actions">
          ${buyButton(p)}
          ${isLocal(p) && state.store.whatsapp ? `<button type="button" class="btn-buy wa" data-order="${p.id}">${ICON.wa}<span>Pedir só este</span></button>` : ''}
          <button type="button" class="btn-share-wide" data-share="${p.id}">${ICON.wa}Compartilhar</button>
        </div>`);
    }

    function openSort() {
      openSheet(`
        <div class="grabber"></div>
        <div class="sheet-head"><h3 id="sheetTitle">Ordenar por</h3>
          <button type="button" class="icon-btn" data-close aria-label="Fechar">${ICON.close}</button></div>
        <div class="sort-list" role="radiogroup">
          ${SORTS.map((s) => `<button type="button" role="radio" data-sort="${s.id}" aria-checked="${s.id === state.sort}">${esc(s.label)}${s.id === state.sort ? ICON.check : ''}</button>`).join('')}
        </div>`);
    }

    async function shareStore() {
      const text = `Conheça a vitrine *${state.store.store_name}*! 🛍️\nAchados selecionados com carinho:\n${storeUrl()}`;
      if (navigator.share) {
        try { await navigator.share({ title: state.store.store_name, text: text.replace(/\*/g, ''), url: storeUrl() }); return; }
        catch (err) { if (err && err.name === 'AbortError') return; }
      }
      window.open(waLink('', text), '_blank', 'noopener');
    }

    /* ---------------- Eventos ---------------- */
    document.addEventListener('click', (e) => {
      const t = e.target.closest('button, a');
      if (!t) {
        if (e.target === overlay) closeSheet();
        return;
      }
      if (t.matches('[data-close]')) return closeSheet();
      if (t.matches('a.btn-buy')) hit(t.classList.contains('wa') ? 'order' : 'click', t.dataset.pid);
      if (t.dataset.open) return openProduct(Number(t.dataset.open));
      if (t.dataset.add) {
        hit('click', t.dataset.add);
        const id = Number(t.dataset.add);
        addToCart(id, 1);
        toast('Adicionado ao carrinho 🛒');
        renderProducts();
        if (overlay.classList.contains('open')) openProduct(id);
        return;
      }
      if (t.dataset.order) hit('order', t.dataset.order);
      if (t.dataset.order) return orderNow(state.products.find((p) => p.id === Number(t.dataset.order)));
      if (t.dataset.qty) { addToCart(Number(t.dataset.qty), Number(t.dataset.d)); renderProducts(); return openCart(); }
      if (t.dataset.cart === 'open') return openCart();
      if (t.dataset.cart === 'checkout') return checkout();
      if (t.dataset.cart === 'clear') { state.cart = {}; saveCart(); renderProducts(); closeSheet(); return toast('Carrinho esvaziado'); }
      if (t.dataset.share) return shareProduct(state.products.find((p) => p.id === Number(t.dataset.share)));
      if (t.dataset.fav) {
        const id = Number(t.dataset.fav);
        if (state.favs.has(id)) { state.favs.delete(id); toast('Removido dos favoritos'); }
        else { state.favs.add(id); toast('Salvo nos favoritos ❤'); }
        storage.set(`vitrine:favs:${state.slug}`, [...state.favs]);
        return renderProducts();
      }
      if (t.dataset.filter) { state.filter = t.dataset.filter; return renderProducts(); }
      if (t.dataset.view) { state.view = t.dataset.view; storage.set(`vitrine:view:${state.slug}`, state.view); return renderProducts(); }
      if (t.dataset.sort) { state.sort = t.dataset.sort; closeSheet(); return renderProducts(); }
      if (t.id === 'btnSort') return openSort();
      if (t.id === 'btnTop') return window.scrollTo({ top: 0 });
      if (t.dataset.nav) {
        const nav = t.dataset.nav;
        if (nav === 'home') { state.filter = 'all'; renderProducts(); window.scrollTo({ top: 0 }); }
        if (nav === 'favs') { state.filter = 'favs'; renderProducts(); $('#products').scrollIntoView({ block: 'start' }); }
        if (nav === 'share') shareStore();
        if (nav === 'contact') {
          if (state.store.whatsapp) window.open(waLink(state.store.whatsapp, `Olá! Vim pela sua vitrine ${state.store.store_name} 😊`), '_blank', 'noopener');
          else toast('Contato indisponível');
        }
      }
    });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeSheet(); });
    document.addEventListener('input', (e) => {
      if (e.target.id === 'search') { state.query = e.target.value; renderProducts(); }
    });

    /* ---------------- Carregamento ---------------- */
    async function load() {
      state.slug = getSlug();
      if (!state.slug) { location.replace('/'); return; }
      if (!/^[a-z0-9-]{3,40}$/.test(state.slug)) {
        return renderState({ icon: ICON.store, title: 'Vitrine não encontrada', text: 'Confira o endereço e tente novamente.' });
      }
      try {
        const res = await fetch(`${API}/api/store/${encodeURIComponent(state.slug)}`, { headers: { Accept: 'application/json' } });
        const data = await res.json().catch(() => ({}));
        if (res.status === 404) {
          return renderState({ icon: ICON.store, title: 'Vitrine não encontrada', text: 'Este endereço não existe ou foi removido.', extra: '<a class="btn-primary" href="/">Ir para o início</a>' });
        }
        if (!res.ok) throw new Error(data.error || 'Falha ao carregar');

        state.store = data.store;
        state.settings = data.settings;
        state.products = data.products || [];
        applyTheme(state.store.theme_color);
        document.title = `${state.store.store_name} | Vitrine App`;

        if (state.store.is_expired) {
          return renderState({
            icon: ICON.clock,
            title: state.store.store_name,
            text: 'Esta vitrine está temporariamente indisponível. Volte em breve!',
            extra: state.store.whatsapp ? `<a class="btn-primary" href="${esc(waLink(state.store.whatsapp, 'Olá! Tentei acessar sua vitrine.'))}" target="_blank" rel="noopener noreferrer">${ICON.wa}Falar com a loja</a>` : '',
          });
        }

        state.favs = new Set((storage.get(`vitrine:favs:${state.slug}`) || []).filter((id) => state.products.some((p) => p.id === id)));
        const savedCart = storage.get(`vitrine:cart:${state.slug}`) || {};
        state.cart = {};
        for (const [id, q] of Object.entries(savedCart)) {
          const p = state.products.find((x) => x.id === Number(id));
          if (p && isLocal(p) && Number(q) > 0) state.cart[id] = Math.min(Number(q), 99);
        }
        state.view = storage.get(`vitrine:view:${state.slug}`) || state.settings.view_mode || 'grid';
        document.documentElement.classList.toggle('dark', state.settings.theme_mode === 'dark');
        document.documentElement.classList.toggle('tinted', state.settings.card_tone === 'tinted');
        renderStore();

        const pid = Number(new URLSearchParams(location.search).get('p'));
        if (pid) openProduct(pid);
      } catch (err) {
        renderState({
          icon: ICON.store,
          title: 'Não foi possível carregar',
          text: 'Verifique sua conexão e tente novamente.',
          extra: '<button class="btn-primary" onclick="location.reload()">Tentar de novo</button>',
        });
      }
    }

    load();
  })();
  </script>
</body>
</html>
