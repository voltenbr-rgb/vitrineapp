            <li><span>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</span></li>
            <li><span>Confirme. O ícone <b>Vitrine App</b> aparece junto dos seus apps.</span></li>
          </ol>
          <button type="button" class="btn btn-primary btn-block" data-i="ok">Entendi</button>`;
      ov.classList.add('open');
      dlg.querySelector('[data-i="ok"]').onclick = () => ov.classList.remove('open');
    }

    /* ---------------- Desempenho: gráfico da loja ---------------- */
    // Barras = visitas (verde neon); linha = cliques em comprar/adicionar (azul).
    state.perfDays = Number(ls.get('vitrine:perf-days')) === 30 ? 30 : 7;
    const fmtDay = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
    const nfmt = (n) => Number(n || 0).toLocaleString('pt-BR');
    function trend(now, before) {
      if (!before && !now) return '<em class="flat">—</em>';
      if (!before) return '<em class="up">novo</em>';
      const pct = Math.round(((now - before) / before) * 100);
      if (pct === 0) return '<em class="flat">= 0%</em>';
      return `<em class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</em>`;
    }

    function perfCard() {
      return `<section class="perf" aria-label="Desempenho da loja" id="perfCard">${perfInner()}</section>`;
    }

    function perfInner() {
      const st = state.stats && state.stats.store === state.tenant.id && state.stats.days === state.perfDays ? state.stats.data : null;
      const head = `<div class="perf-head"><div><strong>📊 Desempenho</strong><small>últimos ${state.perfDays} dias</small></div>
        <div class="perf-range" role="group" aria-label="Período">
          <button type="button" data-perf="7" aria-pressed="${state.perfDays === 7}">7 dias</button>
          <button type="button" data-perf="30" aria-pressed="${state.perfDays === 30}">30 dias</button></div></div>`;
      if (!st) return `${head}<div class="perf-skel"></div>`;
      const t = st.totals, b = st.previous;
      const kpis = `<div class="kpis">
        <div class="kpi"><span><i style="background:#22c55e"></i>Visitas</span><b>${nfmt(t.views)}</b>${trend(t.views, b.views)}</div>
        <div class="kpi"><span><i style="background:#0ea5e9"></i>Cliques</span><b>${nfmt(t.clicks)}</b>${trend(t.clicks, b.clicks)}</div>
        <div class="kpi"><span><i style="background:#25d366"></i>Pedidos</span><b>${nfmt(t.orders)}</b>${trend(t.orders, b.orders)}</div>
        <div class="kpi"><span><i style="background:#a78bfa"></i>Produtos</span><b>${nfmt(st.products.visible)}</b><em class="flat">de ${nfmt(st.products.total)}</em></div>
      </div>`;
      return `${head}${kpis}<div class="chart-wrap" id="chartWrap">${chartSvg(st.series)}
        ${t.views + t.clicks === 0 ? '<div class="perf-empty">Ainda sem visitas neste período.<br>Compartilhe seu link para começar 🚀</div>' : ''}</div>
        <div class="chart-legend"><span><i style="background:#22c55e"></i>Visitas</span><span><i style="background:#0ea5e9;border-radius:50%"></i>Cliques</span></div>`;
    }

    function chartSvg(series) {
      const W = 340, H = 190, L = 26, R = 6, T = 14, B = 24;
      const n = series.length;
      const max = Math.max(4, ...series.map((r) => Math.max(r.views, r.clicks)));
      const step = max <= 10 ? 2 : Math.ceil(max / 5 / 5) * 5;
      const top = Math.ceil(max / step) * step;
      const cw = (W - L - R) / n;
      const bw = Math.max(3, Math.min(30, cw * (n > 10 ? 0.62 : 0.58)));
      const y = (v) => T + (H - T - B) * (1 - v / top);
      const peak = series.reduce((m, r, i) => (r.views > series[m].views ? i : m), 0);
      let grid = '';
      for (let v = 0; v <= top; v += step) {
        grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(15,23,42,${v === 0 ? 0.22 : 0.07})" stroke-dasharray="${v === 0 ? '' : '3 4'}"/>
          <text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9" fill="#64748b" font-weight="700">${v}</text>`;
      }
      const labelEvery = n > 10 ? 5 : 1;
      let bars = '', labels = '';
      series.forEach((r, i) => {
        const cx = L + cw * i + cw / 2;
        const h = Math.max(r.views ? 3 : 0, H - B - y(r.views));
        const isPeak = i === peak && r.views > 0;
        bars += `<rect class="bar" data-i="${i}" x="${cx - bw / 2}" y="${H - B - h}" width="${bw}" height="${h}" rx="${Math.min(5, bw / 3)}"
          fill="${isPeak ? 'url(#gPeak)' : 'url(#gBar)'}" ${isPeak ? 'filter="url(#glow)"' : ''}/>
          <rect class="bar" data-i="${i}" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - B - T}" fill="transparent"/>`;
        if (i % labelEvery === 0 || i === n - 1) {
          labels += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="9" font-weight="800" fill="${isPeak ? '#15803d' : '#64748b'}">${fmtDay(r.day)}</text>`;
        }
      });
      const pts = series.map((r, i) => [L + cw * i + cw / 2, y(r.clicks)]);
      const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const dots = n <= 10 ? pts.map(([px, py]) => `<rect x="${px - 3.5}" y="${py - 3.5}" width="7" height="7" rx="1.5" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>`).join('') : '';
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de visitas e cliques por dia">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(57,255,136,.22)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(57,255,136,.55)" stroke-width="2.2"/></pattern>
          <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d77b"/><stop offset="1" stop-color="#a7f3c4"/></linearGradient>
          <linearGradient id="gPeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e676"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
          <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#16a6e0"/></linearGradient>
          <filter id="glow" x="-60%" y="-30%" width="220%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="glowLine" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        ${grid}${bars}
        <path d="${line}" fill="none" stroke="url(#gLine)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${labels}
      </svg>`;
    }

    async function loadStats() {
      const id = state.tenant && state.tenant.id;
      const days = state.perfDays;
      if (!id) return;
      try {
        const data = await api(`/api/me/stats?days=${days}`);
        if (!state.tenant || state.tenant.id !== id) return;
        state.stats = { store: id, days, data };
        const card = $('#perfCard');
        if (card) card.innerHTML = perfInner();
      } catch { /* o resto do painel continua */ }
    }

    function showChartTip(i) {
      const st = state.stats && state.stats.data;
      const wrap = $('#chartWrap');
      if (!st || !wrap) return;
      const r = st.series[i];
      const svg = wrap.querySelector('svg');
      const rect = svg.getBoundingClientRect();
      const n = st.series.length;
      const cx = (26 + ((340 - 32) / n) * i + ((340 - 32) / n) / 2) * (rect.width / 340);
      let tip = wrap.querySelector('.chart-tip');
      if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; wrap.appendChild(tip); }
      tip.innerHTML = `${fmtDay(r.day)} · <b>${nfmt(r.views)} visitas</b> · <u>${nfmt(r.clicks)} cliques</u>${r.orders ? ` · ${nfmt(r.orders)} ${r.orders === 1 ? 'pedido' : 'pedidos'}` : ''}`;
      tip.style.left = `${Math.min(Math.max(cx, 90), rect.width - 90)}px`;
      wrap.querySelectorAll('rect.bar[fill^="url"]').forEach((b) => { b.style.opacity = Number(b.dataset.i) === i ? '1' : '.45'; });
      clearTimeout(showChartTip.t);
      showChartTip.t = setTimeout(() => { tip.remove(); wrap.querySelectorAll('rect.bar').forEach((b) => { b.style.opacity = ''; }); }, 2600);
    }

    function miniPerf(week) {
      const w = week || [];
      const max = Math.max(1, ...w.map((r) => r.views));
      return `<span class="mini-perf" aria-hidden="true">${w.map((r) => `<i class="${r.views ? '' : 'zero'}" style="height:${Math.max(3, Math.round((r.views / max) * 30))}px"></i>`).join('')}</span>`;
    }

    function header(withPerf = false) {
      const t = state.tenant;
      const avatar = safeImg(t.avatar_url);
      const statusLabel = { trial: 'Teste grátis', active: 'Ativo', expired: 'Expirado' }[t.status] || t.status;
      const showBack = plan().stores > 1 || state.stores.length > 1;
      return `
        ${showBack || installBtn() ? `<div class="top-row">${showBack ? `<button type="button" class="back-stores" data-act="stores">${I.back}Minhas lojas${state.stores.length > 1 ? ` (${state.stores.length})` : ''}</button>` : '<span></span>'}${installBtn()}</div>` : ''}
        <header class="top">
          ${avatar ? `<img class="avatar" src="${esc(avatar)}" alt="">` : `<div class="avatar">${esc(initials(t.store_name))}</div>`}
          <div class="who"><small>Olá, ${esc(String((state.account && state.account.owner_name) || t.owner_name || '').split(' ')[0] || 'lojista')} 👋</small><strong>${esc(t.store_name)}</strong></div>
          <span class="pill ${esc(t.status)}"><span class="dot"></span>${esc(statusLabel)}</span>
        </header>
        ${withPerf ? perfCard() : ''}
        <section class="share" aria-label="Compartilhar meu link">
          <div class="share-head"><strong>📣 Compartilhar meu link</strong>
            <a href="${esc(state.storeUrl)}" target="_blank" rel="noopener">${I.eye}Ver vitrine</a></div>
          <span class="share-url">${esc(state.storeUrl.replace(/^https?:\/\//, ''))}</span>
          <div class="share-btns">
            <button type="button" data-act="copy-link">🔗<span class="lbl">Copiar link<small>para a bio</small></span></button>
            <button type="button" data-act="share-msg">💬<span class="lbl">Mensagem<small>pronta p/ direct</small></span></button>
            <button type="button" class="art-btn" data-act="art-store">🖼️<span class="lbl">Arte da vitrine<small>para Status, Stories e feed</small></span></button>
          </div>
        </section>
        ${tempPassNotice()}
        ${planBanner()}
        ${withPerf ? homeDock() : ''}`;
    }

    /* ---------------- Indique e ganhe ---------------- */
    const refHideKey = () => `vitrine:ref-hide:${(state.account && state.account.id) || ''}`;
    function referralMessage() {
      const r = state.referral || {};
      return `Oi! 😊 Tô usando o *Vitrine App* pra montar minha vitrine de achadinhos num link só (Shopee, Mercado Livre e produtos da região).\n\nÉ bem fácil e dá pra testar *7 dias grátis*, sem cartão:\n${r.link}`;
    }
    function referralCard(inDock = false) {
      const r = state.referral;
      if (!r || !r.link) return '';
      const stats = r.signups ? `<div class="ref-stats"><span><b>${nfmt(r.signups)}</b> ${r.signups === 1 ? 'cadastro' : 'cadastros'}</span><span><b>${nfmt(r.paid)}</b> ${r.paid === 1 ? 'assinou' : 'assinaram'}</span><span><b>${nfmt(r.paid)}</b> ${r.paid === 1 ? 'mês ganho' : 'meses ganhos'}</span></div>` : '';
      if (!inDock && ls.get(refHideKey())) {
        return `<button type="button" class="ref-mini" data-act="ref-show"><span>🎁 <b>Indique e ganhe</b> 1 mês grátis</span><span class="go">Abrir ›</span></button>`;
      }
      return `<section class="ref-card" aria-label="Indique e ganhe">
        ${inDock ? '' : '<button type="button" class="plan-x" data-act="ref-hide" aria-label="Recolher indique e ganhe">✕</button>'}
        <div class="ref-head"><span class="ref-emoji">🎁</span><div><strong>Indique e ganhe 1 mês grátis</strong>
          <small>Mande seu link para um amigo. Quando ele assinar um plano, você ganha <b>+1 mês</b> automaticamente.</small></div></div>
        <div class="ref-link">${esc(r.link.replace(/^https?:\/\//, ''))}</div>
        <div class="ref-btns"><button type="button" class="btn btn-sm btn-primary" data-act="ref-copy">🔗 Copiar link</button>
          <button type="button" class="btn btn-sm ref-wa" data-act="ref-wa">💬 Enviar no WhatsApp</button></div>
        ${stats}
      </section>`;
    }
    async function referralCelebrate() {
      const r = state.referral;
      if (!r || !r.new_rewards) return;
      const n = r.new_rewards;
      r.new_rewards = 0;
      api('/api/me/referral/seen', { method: 'POST', body: {} }).catch(() => {});
      await confirmDialog({ title: '🎉 Você ganhou!', text: `${n === 1 ? 'Um amigo assinou' : `${n} amigos assinaram`} pelo seu link de indicação. Somamos ${n === 1 ? '+1 mês grátis' : `+${n} meses grátis`} no seu plano. Obrigado por indicar! 💙`, ok: 'Oba!', cancel: '' }).catch(() => {});
    }

    /* ---------------- Atalhos do início (um painel aberto por vez) ---------------- */
    const dockKey = () => `vitrine:dock:${state.storeId || ''}`;
    function dockItems() {
      const steps = checklistSteps();
      const done = steps.filter((x) => x.done).length;
      const showSteps = !!state.tenant && !isExpired() && !ls.get(stepKey('hide')) && !(done === steps.length && ls.get(stepKey('celebrated')));
      const hasLearn = !!(state.config.tutorial || (state.config.tips || []).length);
      return [
        showSteps && { id: 'steps', icon: I.rocket, label: 'Primeiros passos', badge: `${done}/${steps.length}`, html: startChecklist },
        { id: 'offer', icon: I.bolt, label: 'Gerar oferta', html: offerCard },
        state.referral && state.referral.link && { id: 'ref', icon: I.gift, label: 'Indique e ganhe', html: () => referralCard(true) },
        hasLearn && !wantsPicker() && { id: 'learn', icon: I.play, label: 'Aprender', html: learnBlock },
      ].filter(Boolean);
    }
    function homeDock() {
      const items = dockItems();
      let open = ls.get(dockKey());
      if (open === 'none') open = '';
      else if (!items.some((x) => x.id === open)) open = items[0] ? items[0].id : '';
      const cur = items.find((x) => x.id === open);
      return `<section class="dock" aria-label="Atalhos">
        <div class="dock-tiles" role="tablist">${items.map((x) => `<button type="button" class="dock-tile ${x.id === open ? 'on' : ''}" role="tab" aria-selected="${x.id === open}" data-act="dock" data-id="${x.id}">
          <span class="di">${x.icon}</span><span class="dl">${esc(x.label)}</span>${x.badge ? `<span class="db">${esc(x.badge)}</span>` : ''}</button>`).join('')}</div>
        ${cur ? `<div class="dock-panel" role="tabpanel">${cur.html()}</div>` : ''}
      </section>`;
    }

    /* ---------------- Primeiros passos (checklist) ---------------- */
    function markShared() {
      if (ls.get(stepKey('shared'))) return;
      ls.set(stepKey('shared'), '1');
      if (state.tab === 'products') setTimeout(() => { const y = window.scrollY; render(); window.scrollTo(0, y); }, 400);
    }
    const stepKey = (k) => `vitrine:step:${k}:${state.storeId || ''}`;
    function checklistSteps() {
      const t = state.tenant || {};
      const prods = (state.products || []).length;
      return [
        { id: 'logo', icon: '🖼️', title: 'Coloque sua foto ou logo', hint: 'Deixa sua vitrine com a sua cara.', done: !!safeImg(t.avatar_url), act: 'goto-profile', btn: 'Colocar' },
        { id: 'cover', icon: '🌄', title: 'Escolha uma foto de capa', hint: 'O topo da vitrine fica muito mais bonito.', done: !!safeImg(t.cover_url), act: 'goto-profile', btn: 'Escolher' },
        { id: 'products', icon: '🛍️', title: 'Cadastre 3 produtos', hint: prods ? `Você já tem ${prods} de 3.` : 'Cole o link do Mercado Livre ou da Shopee que o resto vem sozinho.', done: prods >= 3, tab: 'new', btn: 'Cadastrar' },
        { id: 'share', icon: '📣', title: 'Compartilhe seu link', hint: 'Coloque na bio do Instagram ou mande no WhatsApp.', done: !!ls.get(stepKey('shared')), act: 'copy-link', btn: 'Copiar link' },
      ];
    }
    function startChecklist() {
      if (!state.tenant || isExpired()) return '';
      if (ls.get(stepKey('hide'))) return '';
      const steps = checklistSteps();
      const done = steps.filter((x) => x.done).length;
      const all = done === steps.length;
      if (all && ls.get(stepKey('celebrated'))) return '';
      const pct = Math.round((done / steps.length) * 100);
      if (all) {
        return `<section class="checklist done-all" aria-label="Primeiros passos">
          <div class="ck-head"><span class="ck-emoji">🎉</span><div><strong>Sua vitrine está prontinha!</strong><small>Agora é divulgar: quanto mais gente vê, mais cliques você ganha.</small></div></div>
          <div class="ck-row"><button type="button" class="btn btn-sm btn-primary" data-act="art-store">🖼️ Criar arte para o Status</button>
          <button type="button" class="btn btn-sm btn-ghost" data-act="checklist-ok">Fechar</button></div></section>`;
      }
      const next = steps.find((x) => !x.done);
      return `<section class="checklist" aria-label="Primeiros passos">
        <button type="button" class="plan-x" data-act="checklist-hide" aria-label="Esconder primeiros passos">✕</button>
        <div class="ck-head"><span class="ck-emoji">🚀</span><div><strong>Primeiros passos</strong><small>${done} de ${steps.length} concluídos · deixe sua vitrine pronta para vender</small></div></div>
        <div class="ck-bar" aria-hidden="true"><i style="width:${Math.max(6, pct)}%"></i></div>
        <ol class="ck-list">${steps.map((x) => `<li class="${x.done ? 'ok' : ''} ${x === next ? 'next' : ''}">
          <span class="ck-dot">${x.done ? '✓' : x.icon}</span>
          <span class="ck-txt"><b>${esc(x.title)}</b>${x.done ? '' : `<small>${esc(x.hint)}</small>`}</span>
          ${x.done ? '' : `<button type="button" class="ck-go" ${x.tab ? `data-tab="${x.tab}"` : `data-act="${x.act}"`}>${esc(x.btn)}</button>`}
        </li>`).join('')}</ol></section>`;
    }

    function productItem(p) {
      const plat = PLATFORM[p.platform] || PLATFORM.proprio;
      const img = safeImg(p.image_url);
      const hidden = Number(p.is_visible) === 0;
      const feat = p.sort_order < 0;
      const off = Number(p.original_price) > Number(p.price) && Number(p.price) > 0 ? Math.round((1 - Number(p.price) / Number(p.original_price)) * 100) : 0;
      return `<div class="pitem fade-in ${hidden ? 'hidden-item' : ''} ${feat ? 'is-feat' : ''}">
        <div class="pmain">
        <div class="thumb">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : I.box}${feat ? `<span class="tstar" title="Em destaque">${I.starFill}</span>` : ''}${off ? `<span class="toff">-${off}%</span>` : ''}</div>
        <div class="meta"><strong>${esc(p.title)}</strong>
          <div class="line"><span class="badge ${plat.cls}">${esc(plat.label)}</span>
            ${p.price !== null && p.price !== undefined ? `<span class="price" ${Number(p.show_price) === 0 ? 'style="text-decoration:line-through;opacity:.6" title="Preço oculto na vitrine"' : ''}>${brl(p.price)}</span>` : '<span>sem preço</span>'}
            ${Number(p.show_price) === 0 ? '<span class="tag-hidden">preço oculto</span>' : ''}
            ${p.category ? `<span>· ${esc(p.category)}</span>` : ''}
            ${p.is_physical ? '<span>· 📍 entrega local</span>' : ''}
            ${Number(p.clicks) > 0 ? `<span>· 👆 ${nfmt(p.clicks)} ${Number(p.clicks) === 1 ? 'clique' : 'cliques'}</span>` : ''}
            ${hidden ? '<span class="tag-hidden">Oculto</span>' : ''}</div></div>
        </div>
        <div class="pacts">
          <button type="button" class="pa ${feat ? 'on' : ''}" data-act="feature" data-id="${p.id}" aria-pressed="${feat}" title="Destaque no topo da vitrine (até 5)">${feat ? I.starFill : I.star}<span>${feat ? 'Destaque' : 'Destacar'}</span></button>
          <button type="button" class="pa" data-act="offer" data-id="${p.id}" title="Mensagem de oferta">${I.mega}<span>Oferta</span></button>
          <button type="button" class="pa" data-act="toggle-visible" data-id="${p.id}" title="${hidden ? 'Mostrar na vitrine' : 'Ocultar da vitrine'}">${hidden ? I.eyeOff : I.eye}<span>${hidden ? 'Mostrar' : 'Ocultar'}</span></button>
          <button type="button" class="pa" data-act="edit" data-id="${p.id}" aria-label="Editar ${esc(p.title)}">${I.edit}<span>Editar</span></button>
          <button type="button" class="pa danger" data-act="delete" data-id="${p.id}" aria-label="Excluir ${esc(p.title)}">${I.trash}</button>
        </div></div>`;
    }

    function renderProductsTab() {
      const q = state.query.trim().toLowerCase();
      const list = state.products.filter((p) => !q || `${p.title} ${p.description}`.toLowerCase().includes(q));
      return `${header(true)}
        <div class="section-title"><h2>Seus produtos</h2>
          <div style="display:flex;gap:8px"><button type="button" class="btn btn-sm btn-ghost" data-act="bulk-open" ${isExpired() ? 'disabled' : ''}>⚡ Vários${bulkAllowed() ? '' : ' 🔒'}</button>
          <button type="button" class="btn btn-sm btn-primary" data-tab="new" ${isExpired() ? 'disabled' : ''}>+ Novo</button></div></div>
        ${state.products.length > 4 ? `<label class="search">${I.search}<input id="pSearch" type="search" placeholder="Buscar nos seus produtos" value="${esc(state.query)}" autocomplete="off"></label>` : ''}
        <div class="plist" id="plist">
          ${list.length ? list.map(productItem).join('') : state.products.length
            ? '<div class="card empty"><strong>Nada encontrado</strong>Tente outra busca.</div>'
            : `<div class="card empty"><div class="icon">${I.box}</div><strong>Sua vitrine está vazia</strong>Cadastre o primeiro produto em menos de 1 minuto.<br><br>
               <button type="button" class="btn btn-primary" data-tab="new" ${isExpired() ? 'disabled' : ''}>Cadastrar produto</button></div>`}
        </div>`;
    }

    /* ---------------- Vários de uma vez (plano Completo) ---------------- */
    const bulkAllowed = () => !!(state.bulk && state.bulk.allowed);
    // Estilo Landing: plano Completo ou teste grátis (que libera os recursos do Completo).
    const landingAllowed = () => !!(state.account && (state.account.status === 'trial' || state.account.plan === 'complete'));
    const bulkMax = () => (state.bulk && state.bulk.max) || 10;
    let bulkText = '';
    let bulkCat = '';
    let bulkRun = null; // { items: [{ url, status, msg, title, price }], running, done }

    function bulkLinks(text) {
      const found = String(text || '').match(/https?:\/\/[^\s<>"'`]+/gi) || [];
      return [...new Set(found.map((u) => u.replace(/[),.;!]+$/, '')))];
    }

    function openBulk() {
      if (isExpired()) return;
      if (!bulkAllowed()) {
        return confirmDialog({
          title: '⚡ Vários de uma vez',
          text: `Cole até ${bulkMax()} links da Shopee ou do Mercado Livre e o sistema busca nome, preço e foto e publica tudo direto na sua vitrine. Recurso exclusivo de quem assina o plano Completo.`,
          ok: 'Ver o plano Completo',
        }).then((ok) => { if (ok) openPay('complete'); });
      }
      bulkRun = bulkRun && bulkRun.running ? bulkRun : null;
      go('bulk');
    }

    function renderBulk() {
      const q = state.quota;
      const run = bulkRun;
      const cats = categories();
      return `
        <div class="top"><button type="button" class="icon-btn" data-tab="products" aria-label="Voltar">${I.back}</button>
          <div class="who"><small>Plano Completo</small><strong>⚡ Vários de uma vez</strong></div></div>
        <div class="card">
          <h2>Cole os links</h2><p class="sub">Até ${bulkMax()} links da Shopee ou do Mercado Livre — um por linha (pode colar tudo junto, eu separo). Nome, preço e foto vêm sozinhos e os produtos já entram na vitrine.</p>
          <textarea class="input bulk-text" id="bulkText" rows="7" placeholder="https://meli.la/...&#10;https://s.shopee.com.br/...&#10;https://meli.la/..." ${run && run.running ? 'disabled' : ''}>${esc(bulkText)}</textarea>
          <div class="bulk-meta"><span id="bulkCount">Nenhum link ainda</span><span id="bulkQuota">${q ? `✨ ${q.remaining} de ${q.limit} buscas nesta hora` : ''}</span></div>
        </div>
        <div class="card">
          <h2>Organizar</h2><p class="sub">Coloque todos numa categoria ou deixe avulsos.</p>
          <div class="seg bulk-seg">
            <label><input type="radio" name="bulkMode" value="loose" ${bulkCat ? '' : 'checked'}><span class="opt">📦 Avulsos</span></label>
            <label><input type="radio" name="bulkMode" value="cat" ${bulkCat ? 'checked' : ''}><span class="opt">🏷️ Numa categoria</span></label>
          </div>
          <label class="field" id="bulkCatField" style="margin:12px 0 0" ${bulkCat ? '' : 'hidden'}><span>Categoria</span>
            <input class="input" id="bulkCat" list="bulkCatList" maxlength="40" placeholder="Ex.: Cozinha, Moda, Eletrônicos" value="${esc(bulkCat)}" autocomplete="off">
            <datalist id="bulkCatList">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></label>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="bulkGo" data-act="bulk-go" ${run && run.running ? 'disabled' : ''}>⚡ Buscar e publicar</button>
        <div id="bulkResult">${bulkResultHtml()}</div>`;
    }

    function updateBulkCount() {
      const el = $('#bulkCount');
      if (!el) return;
      const n = bulkLinks(bulkText).length;
      const max = bulkMax();
      el.textContent = !n ? 'Nenhum link ainda' : n > max ? `${n} links · só os ${max} primeiros serão usados` : `${n} ${n === 1 ? 'link encontrado' : 'links encontrados'}`;
      el.classList.toggle('warn', n > max);
      const go = $('#bulkGo');
      if (go && !(bulkRun && bulkRun.running)) go.textContent = n ? `⚡ Buscar e publicar ${Math.min(n, max)} ${Math.min(n, max) === 1 ? 'produto' : 'produtos'}` : '⚡ Buscar e publicar';
    }

    function bulkResultHtml() {
      const run = bulkRun;
      if (!run) return '';
      const icon = { wait: '⏳', loading: '<span class="spin"></span>', ok: '✅', dup: '↩️', error: '⚠️', stop: '⏸️' };
      const ok = run.items.filter((x) => x.status === 'ok').length;
      const dup = run.items.filter((x) => x.status === 'dup').length;
      const bad = run.items.filter((x) => x.status === 'error' || x.status === 'stop').length;
      const doneNow = run.items.filter((x) => !['wait', 'loading'].includes(x.status)).length;
      const pct = Math.round((doneNow / run.items.length) * 100);
      return `<div class="card bulk-res" aria-live="polite">
        <div class="bulk-head"><strong>${run.running ? `Publicando ${Math.min(doneNow + 1, run.items.length)} de ${run.items.length}...` : '🎉 Pronto!'}</strong>
          <span>${ok} ${ok === 1 ? 'publicado' : 'publicados'}${dup ? ` · ${dup} já ${dup === 1 ? 'estava' : 'estavam'}` : ''}${bad ? ` · ${bad} ${bad === 1 ? 'pendente' : 'pendentes'}` : ''}</span></div>
        <div class="ck-bar"><i style="width:${Math.max(4, pct)}%"></i></div>
        <ul class="bulk-list">${run.items.map((x) => `<li class="${x.status}"><span class="bl-ic">${icon[x.status] || ''}</span>
          <span class="bl-tx"><b>${esc(x.title || x.url.replace(/^https?:\/\//, '').slice(0, 48))}</b>${x.price ? `<small class="bl-price">${esc(brl(x.price))}</small>` : ''}${x.msg ? `<small>${esc(x.msg)}</small>` : ''}</span></li>`).join('')}</ul>
        ${run.running ? '' : `<div class="ck-row">${ok ? '<button type="button" class="btn btn-sm btn-primary" data-tab="products">Ver meus produtos</button>' : ''}
          <a class="btn btn-sm btn-ghost" href="${esc(state.storeUrl || '#')}" target="_blank" rel="noopener">Abrir vitrine ↗</a>
          ${bad ? '<button type="button" class="btn btn-sm btn-ghost" data-act="bulk-go">Tentar os pendentes</button>' : ''}</div>`}
      </div>`;
    }

    function paintBulk() {
      const el = $('#bulkResult');
      if (el) el.innerHTML = bulkResultHtml();
      const q = state.quota;
      const qe = $('#bulkQuota');
      if (qe && q) qe.textContent = q.remaining > 0 ? `✨ ${q.remaining} de ${q.limit} buscas nesta hora` : `Buscas desta hora esgotadas · libera em ${q.reset_minutes || 60} min`;
    }

    async function runBulk() {
      if (bulkRun && bulkRun.running) return;
      if (!bulkAllowed()) return openBulk();
      const mode = ($('input[name="bulkMode"]:checked') || {}).value;
      const cat = mode === 'cat' ? String(($('#bulkCat') || {}).value || '').trim() : '';
      if (mode === 'cat' && !cat) { toast('Escreva o nome da categoria ou escolha "Avulsos".', true); $('#bulkCat').focus(); return; }
      bulkCat = cat;
      const links = bulkLinks(bulkText).slice(0, bulkMax());
      if (!links.length) { toast('Cole pelo menos um link da Shopee ou do Mercado Livre.', true); $('#bulkText').focus(); return; }
      bulkRun = { running: true, items: links.map((url) => ({ url, status: 'wait' })) };
      const ta = $('#bulkText'); if (ta) ta.disabled = true;
      const go = $('#bulkGo'); if (go) { go.disabled = true; go.textContent = 'Publicando...'; }
      paintBulk();
      $('#bulkResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
      let stopMsg = '';
      for (const item of bulkRun.items) {
        if (stopMsg) { item.status = 'stop'; item.msg = stopMsg; continue; }
        item.status = 'loading'; paintBulk();
        try {
          const data = await api('/api/me/products/from-link', { method: 'POST', body: { url: item.url, category: cat } });
          item.status = 'ok';
          item.title = data.product.title;
          item.price = data.product.price;
          if (!data.product.price) item.msg = 'Sem preço no link — coloque o valor depois, se quiser.';
          state.products.unshift(data.product);
          if (data.quota) state.quota = data.quota;
        } catch (err) {
          if (err.code === 'duplicate') { item.status = 'dup'; item.msg = 'Já estava na sua vitrine.'; }
          else if (err.code === 'quota' || err.code === 'plan_required' || err.code === 'trial_expired' || err.status === 402) {
            item.status = 'stop'; item.msg = err.message; stopMsg = err.code === 'quota' ? 'Aguardando as buscas desta hora liberarem.' : err.message;
            if (err.code === 'quota' && state.quota) state.quota.remaining = 0;
          } else { item.status = 'error'; item.msg = err.message || 'Não deu para adicionar este link.'; }
        }
        paintBulk();
      }
      bulkRun.running = false;
      // Deixa na caixa só os links que não entraram, para tentar de novo.
      bulkText = bulkRun.items.filter((x) => x.status === 'error' || x.status === 'stop').map((x) => x.url).join('\n');
      const okN = bulkRun.items.filter((x) => x.status === 'ok').length;
      if (ta) { ta.disabled = false; ta.value = bulkText; }
      updateBulkCount();
      if (go) go.disabled = false;
      paintBulk();
      if (okN) toast(`🎉 ${okN} ${okN === 1 ? 'produto publicado' : 'produtos publicados'} na vitrine!`);
    }

              <div id="imgPreview">${img ? `<img src="${esc(img)}" alt="Prévia">` : `<div class="ph">${I.image}<b>Toque para escolher uma foto</b>ou arraste a imagem aqui</div>`}</div>

    function render() {
      document.querySelector('.tabbar').hidden = state.view === 'stores';
      if (state.view === 'stores') { main.innerHTML = renderStores(); return; }
      if (!state.tenant) return;
      document.querySelectorAll('.tabbar [data-tab]').forEach((b) => {
        const current = b.dataset.tab === state.tab || (b.dataset.tab === 'new' && state.tab === 'form');
        b.setAttribute('aria-current', current ? 'page' : 'false');
      });
      if (state.tab === 'products') {
        main.innerHTML = renderProductsTab();
        const fresh = state.stats && state.stats.store === state.tenant.id && state.stats.days === state.perfDays && Date.now() - (state.stats.at || 0) < 60_000;
        if (!fresh) loadStats().then(() => { if (state.stats) state.stats.at = Date.now(); });
      }
      else if (state.tab === 'form') { main.innerHTML = renderForm(); updatePlatformHints(); }
      else if (state.tab === 'bulk') { main.innerHTML = renderBulk(); updateBulkCount(); }
      else if (state.tab === 'settings') main.innerHTML = renderSettings();
      else if (state.tab === 'account') main.innerHTML = renderAccount();
    }

    function go(tab) {
      if (tab === 'new') { state.editing = null; tab = 'form'; }
      state.tab = tab;
      render();
      window.scrollTo({ top: 0 });
    }

    /* ---------------- Ações ---------------- */
    async function deleteProduct(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      const ok = await confirmDialog({ title: 'Excluir produto?', text: `"${p.title}" sai da sua vitrine. Esta ação não pode ser desfeita.`, ok: 'Excluir', danger: true });
      if (!ok) return;
      try {
        await api(`/api/me/products/${id}`, { method: 'DELETE' });
        state.products = state.products.filter((x) => x.id !== id);
        toast('Produto excluído');
        go('products');
      } catch (err) { handleError(err); }
    }

    async function saveProduct(form) {
      const fd = new FormData(form);
      const body = {
        title: fd.get('title'),
        description: fd.get('description'),
        price: String(fd.get('price') || '').trim(),
        image_url: fd.get('image_url'),
        affiliate_link: String(fd.get('affiliate_link') || '').trim(),
        platform: fd.get('platform'),
        is_physical: fd.get('is_physical') ? 1 : 0,
        delivery_cities: fd.get('delivery_cities') || '',
        sort_order: fd.get('pinned') ? -1 : 0,
        show_price: fd.get('show_price') ? 1 : 0,
        original_price: String(fd.get('original_price') || '').trim(),
        category: String(fd.get('category') || '').trim(),
      };
      if (!String(body.title || '').trim()) { toast('Dê um título ao produto.', true); form.title.focus(); return; }
      if (body.platform !== 'proprio' && !body.affiliate_link) { toast('Cole o link de afiliado.', true); form.affiliate_link.focus(); return; }
      if (body.affiliate_link && !/^https?:\/\//i.test(body.affiliate_link)) body.affiliate_link = 'https://' + body.affiliate_link;
      if (body.is_physical && body.platform === 'proprio' && !String(body.delivery_cities).trim()) {
        toast('Informe as cidades onde você entrega.', true); form.delivery_cities.focus(); return;
      }
      if (body.is_physical && String(body.delivery_cities).trim()) {
        ls.set(CITIES_KEY(), splitCities(body.delivery_cities).join(', '));
      }
      const btn = $('#saveProduct');
      setBusy(btn, true);
      try {
        if (state.editing) {
          const { product } = await api(`/api/me/products/${state.editing.id}`, { method: 'PUT', body });
          state.products = state.products.map((x) => (x.id === product.id ? product : x));
          toast('Produto atualizado ✓');
        } else {
          const { product } = await api('/api/me/products', { method: 'POST', body });
          state.products = [product, ...state.products];
          toast('Produto publicado na vitrine ✓');
        }
        state.products.sort((a, b) => a.sort_order - b.sort_order || b.id - a.id);
        state.editing = null;
        go('products');
      } catch (err) {
        handleError(err);
        setBusy(btn, false);
      }
    }

    async function saveSettings() {
      const get = (k) => $(`[data-setting="${k}"]`);
      const body = {
        show_banner: get('show_banner').checked ? 1 : 0,
        show_prices: get('show_prices').checked ? 1 : 0,
        show_stock_warning: get('show_stock_warning').checked ? 1 : 0,
        view_mode: ($('[data-setting="view_mode"]:checked') || {}).value || 'grid',
        theme_mode: ($('[data-setting="theme_mode"]:checked') || {}).value || 'light',
        store_mode: ($('[data-setting="store_mode"]:checked') || {}).value || 'mixed',
        show_whatsapp: get('show_whatsapp').checked ? 1 : 0,
        show_group: get('show_group') && get('show_group').checked ? 1 : 0,
        group_url: get('group_url') ? get('group_url').value.trim() : undefined,
        group_title: get('group_title') ? get('group_title').value.trim() : undefined,
        card_tone: ($('[data-setting="card_tone"]:checked') || {}).value || 'white',
        show_tags: get('show_tags').checked ? 1 : 0,
        store_style: ($('[data-setting="store_style"]:checked') || {}).value || 'classic',
        landing_intro: get('landing_intro') ? (get('landing_intro').checked ? 1 : 0) : 1,
      };
      try {
        const before = state.settings && state.settings.store_mode;
        const { settings } = await api('/api/me/settings', { method: 'PUT', body });
        state.settings = settings;
        toast('Vitrine atualizada ✓');
        if (before !== settings.store_mode) { const y = window.scrollY; render(); window.scrollTo(0, y); }
      } catch (err) { handleError(err); }
    }

    async function saveProfile(form) {
      const fd = new FormData(form);
      const body = Object.fromEntries(['store_name', 'owner_name', 'whatsapp', 'avatar_url', 'cover_url', 'theme_color', 'bio', 'instagram'].map((k) => [k, fd.get(k) || '']));
      const btn = $('#saveProfile');
      setBusy(btn, true);
      try {
        const { tenant } = await api('/api/me/profile', { method: 'PUT', body });
        state.tenant = { ...state.tenant, ...tenant };
        if (state.account) state.account.owner_name = tenant.owner_name;
        toast('Perfil salvo ✓');
        render();
      } catch (err) { handleError(err); setBusy(btn, false); }
    }

    async function savePassword(form) {
      const fd = new FormData(form);
      const body = { current_password: fd.get('current_password'), new_password: fd.get('new_password') };
      if (String(body.new_password || '').length < 4) return toast('A nova senha precisa de 4 dígitos ou mais.', true);
      const btn = $('#savePass');
      setBusy(btn, true);
      try {
        const data = await api('/api/me/password', { method: 'PUT', body });
        state.token = data.token;
        ls.set(TOKEN_KEY, data.token);
        form.reset();
        if (state.account && state.account.temp_password) { state.account.temp_password = false; render(); }
        toast('Senha atualizada ✓');
      } catch (err) { handleError(err); }
      setBusy(btn, false);
    }

    async function handleProductImage(file) {
      const drop = $('#drop');
      const busy = document.createElement('div');
      busy.className = 'busy';
      busy.innerHTML = '<span class="spinner"></span>&nbsp;Enviando foto...';
      drop.appendChild(busy);
      try {
        const url = await processImage(file);
        setProductImage(url);
      } catch (err) { toast(err.message, true); }

    function renderQuota(show) {
      const el = $('#quotaHint');
      if (!el) return;
      const q = state.quota;
      el.hidden = !show || !q;
      if (!q) return;
      el.textContent = q.remaining > 0
        ? `✨ ${q.remaining} de ${q.limit} buscas automáticas disponíveis nesta hora`
        : `Buscas automáticas esgotadas nesta hora · libera em ${q.reset_minutes} min`;
    }

    // Preço visível por padrão (afiliados têm o preço conferido sozinho 1x por dia), até o lojista mexer na chave.
    let priceTouched = false;
    function syncPriceDefault() {
      const form = $('#productForm');
      if (!form || priceTouched || state.editing) return;
      $('#showPrice').checked = true;
    }

    // Agora o preço dos afiliados se atualiza sozinho: não precisa mais confirmar.
    function onShowPriceChange() {
      priceTouched = true;
    }

    // Busca nome, preço e foto pelo link (API de afiliados configurada no Master).
    let lastFilled = '';
    async function autoFill(manual) {
      const form = $('#productForm');
      if (!form) return;
      const platform = form.platform.value;
      if (!(state.config.lookup && state.config.lookup[platform])) return;
      let link = String(form.affiliate_link.value || '').trim();
      if (!link) { if (manual) { toast('Cole primeiro o link do produto.', true); form.affiliate_link.focus(); } return; }
      if (!/^https?:\/\//i.test(link)) { link = 'https://' + link; form.affiliate_link.value = link; }
      if (!manual && link === lastFilled) return;
      lastFilled = link;
      const btn = $('#autofillBtn');
      setBusy(btn, true, 'Buscando dados do produto...');
      try {
        const { product, quota } = await api('/api/me/lookup', { method: 'POST', body: { url: link } });
        if (quota) { state.quota = quota; renderQuota(true); }
        if (product.title && (manual || !form.title.value.trim())) {
          form.title.value = product.title;
          $('#titleCount').textContent = `${product.title.length}/120`;
        }
        if (product.price && (manual || !form.price.value.trim())) form.price.value = priceInput(product.price);
        if (product.original_price && (manual || !form.original_price.value.trim())) form.original_price.value = priceInput(product.original_price);
        if (product.image_url && (manual || !$('#imageValue').value)) setProductImage(product.image_url);
        if (!form.description.value.trim() && (product.shop_name || Number(product.rating) > 0)) {
          const n = Number(product.rating_count) || 0;
          const stars = Number(product.rating) > 0 ? `⭐ ${Number(product.rating).toFixed(1)}${n ? ` (${n.toLocaleString('pt-BR')} ${n === 1 ? 'avaliação' : 'avaliações'})` : ''}` : '';
          const extras = [product.shop_name ? `Loja: ${product.shop_name}` : '', stars].filter(Boolean).join(' · ');
          form.description.value = extras;
          $('#descCount').textContent = `${extras.length}/1500`;
        }
        if (product.source === 'title_match') toast('✨ Encontrei pelo nome. Confira se a foto e o preço batem com o seu anúncio.');
        else if (product.source === 'preview') toast('✨ Nome e foto preenchidos. Confira e, se quiser, coloque o preço.');
        else toast('✨ Dados do produto preenchidos! Confira e publique.');
      } catch (err) {
        if (err.code === 'quota') { lastFilled = ''; if (state.quota) { state.quota.remaining = 0; renderQuota(true); } }
        if (manual || err.status !== 501) toast(err.message, true);
      } finally {
        setBusy(btn, false);
      }
    }

    function setProductImage(url) {
      $('#imageValue').value = url || '';
      $('#imgPreview').innerHTML = url
        ? `<img src="${esc(url)}" alt="Prévia">`
        : `<div class="ph">${I.image}<b>Toque para escolher uma foto</b>ou arraste a imagem aqui</div>`;
      $('#clearImg').hidden = !url;
      const isExternal = /^https?:/i.test(url || '') && !url.includes('/api/images/');
      $('#imgUrl').value = isExternal ? url : '';
    }

        <div class="crop-zoom"><span>➖</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom"><span>➕</span></div>
        <div class="grid-2">
          <button type="button" class="btn btn-ghost" data-c="cancel">Cancelar</button>
          <button type="button" class="btn btn-primary" data-c="ok">Usar esta capa</button>
        </div>`;
      ov.classList.add('open');
      const frame = $('#cropFrame');
      const el = $('#cropImg');
      const previewUrl = URL.createObjectURL(file);
      el.src = previewUrl;
      const W = () => frame.clientWidth, H = () => frame.clientHeight;
      // base = escala mínima para cobrir o quadro; zoom multiplica
      let zoom = 1, x = 0, y = 0;
      const base = () => Math.max(W() / img.naturalWidth, H() / img.naturalHeight);
      const clamp = () => {
        const sc = base() * zoom;
        const iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
        x = Math.min(0, Math.max(W() - iw, x));
        y = Math.min(0, Math.max(H() - ih, y));
      };
      const draw = () => { clamp(); el.style.transform = `translate(${x}px, ${y}px) scale(${base() * zoom})`; };
      // começa centralizada
      requestAnimationFrame(() => {
        const sc = base();
        x = (W() - img.naturalWidth * sc) / 2;
        y = (H() - img.naturalHeight * sc) / 2;
        draw();
      });
      const pointers = new Map();
      let last = null, pinch = null;
      frame.onpointerdown = (e) => { frame.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = { x: e.clientX, y: e.clientY }; };
      frame.onpointermove = (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2) {
          // pinça com dois dedos = zoom
          const [a, b] = [...pointers.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (pinch) setZoom(zoom * (d / pinch));
          pinch = d;
          return;
        }
        x += e.clientX - last.x; y += e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
        draw();
      };
      const up = (e) => { pointers.delete(e.pointerId); pinch = null; const rest = [...pointers.values()][0]; last = rest || null; };
      frame.onpointerup = up; frame.onpointercancel = up;
      frame.onwheel = (e) => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 0.93)); };
      function setZoom(z) {
        const nz = Math.min(3, Math.max(1, z));
        // mantém o centro do quadro no mesmo ponto da foto
        const cx = W() / 2, cy = H() / 2;
        const k = nz / zoom;
        x = cx - (cx - x) * k; y = cy - (cy - y) * k;
        zoom = nz; $('#cropZoom').value = String(nz);
        draw();
      }
      $('#cropZoom').oninput = (e) => setZoom(Number(e.target.value));
      const close = () => { ov.classList.remove('open'); ov.onclick = null; URL.revokeObjectURL(previewUrl); };
      ov.onclick = async (e) => {
        if (e.target === ov) return close();
        const b = e.target.closest('[data-c]');
        if (!b) return;
        if (b.dataset.c === 'cancel') return close();
        setBusy(b, true, 'Preparando...');
        try {
          // recorta exatamente o que está no quadro, em 1400x788
          const sc = base() * zoom;
          const sx = -x / sc, sy = -y / sc, sw = W() / sc, sh = H() / sc;
          const canvas = document.createElement('canvas');
          canvas.width = COVER_W; canvas.height = COVER_H;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, COVER_W, COVER_H);
          const webp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
          const type = webp ? 'image/webp' : 'image/jpeg';
          let url = '';
          if (state.config.uploads) {
            const blob = await new Promise((r) => canvas.toBlob(r, type, 0.8));
            try { url = (await api('/api/me/upload', { method: 'POST', raw: blob, contentType: type })).url; } catch { url = ''; }
          }
          if (!url) {
            for (const [w, q] of [[1400, 0.74], [1200, 0.68], [1000, 0.62], [800, 0.56]]) {
              let c = canvas;
              if (w < COVER_W) { c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * 9 / 16); c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); }
              const d = c.toDataURL(type, q);
              if (d.length < 440000) { url = d; break; }
            }
          }
          if (!url) throw new Error('Não consegui reduzir esta imagem. Tente outra.');
          close();
          setCover(url);
          toast('Capa pronta. Toque em "Salvar perfil".');
        } catch (err) { toast(err.message, true); setBusy(b, false); }
      };
    }

    function setCover(url) {
      $('#coverValue').value = url || '';
      const box = $('#coverPrev');
      box.querySelectorAll(':scope > img, :scope > .cover-empty').forEach((n) => n.remove());
      box.insertAdjacentHTML('afterbegin', url ? `<img src="${esc(url)}" alt="">` : '<span class="cover-empty">Sem capa: o topo usa a cor da loja.</span>');
      $('#clearCover').hidden = !url;
    }

    function setAvatar(url) {
      $('#avatarValue').value = url || '';
      $('#avatarPrev').innerHTML = url ? `<img src="${esc(url)}" alt="">` : esc(initials(state.tenant.store_name));
      $('#clearAvatar').hidden = !url;
    }

    function setColor(c) {
      $('#themeValue').value = c;
      $('#customColor').value = c;
      document.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === c)));
      const prev = $('#colorPreview');
      if (prev) prev.style.background = `linear-gradient(135deg, ${c}, color-mix(in srgb, ${c} 70%, #000))`;
    }

    /* ---------------- Eventos ---------------- */
    document.addEventListener('click', async (e) => {
      const perf = e.target.closest('[data-perf]');
      if (perf) {
        state.perfDays = Number(perf.dataset.perf) === 30 ? 30 : 7;
        ls.set('vitrine:perf-days', String(state.perfDays));
        $('#perfCard').innerHTML = perfInner();
        return loadStats();
      }
      const bar = e.target.closest('#chartWrap rect.bar');
      if (bar) return showChartTip(Number(bar.dataset.i));
      const cityBtn = e.target.closest('[data-city]');
      if (cityBtn) return toggleCity(cityBtn.dataset.city);
      const cat = e.target.closest('[data-cat]');
      if (cat) {
        const input = $('[name="category"]');
        const same = input.value === cat.dataset.cat;
        input.value = same ? '' : cat.dataset.cat;
        document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', String(!same && b === cat)));
        return;
      }
      const t = e.target.closest('[data-tab], [data-act], [data-color], [data-model]');
      if (!t || t.disabled) return;
      if (t.dataset.tab) return go(t.dataset.tab);
      if (t.dataset.color) return setColor(t.dataset.color);
      const act = t.dataset.act || (t.dataset.model ? 'model' : '');
      if (act === 'copy-link') { markShared(); return copy(state.storeUrl, 'Link copiado! Cole na sua bio 😉'); }
      if (act === 'ref-copy') return copy(state.referral.link, 'Link de indicação copiado! 🎁');
      if (act === 'ref-wa') return window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(referralMessage())}`, '_blank', 'noopener');
      if (act === 'ref-hide') { ls.set(refHideKey(), '1'); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
      if (act === 'ref-show') { ls.del(refHideKey()); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
      if (act === 'checklist-hide') { ls.set(stepKey('hide'), '1'); render(); return toast('Primeiros passos escondidos'); }
      if (act === 'checklist-ok') { ls.set(stepKey('celebrated'), '1'); return render(); }
      if (act === 'goto-profile') { go('settings'); setTimeout(() => { const f = $('#profileForm'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); return; }
      if (act === 'copy-tip') return copy(t.dataset.url || '', 'Link copiado! 😉');
      if (act === 'share-msg') { markShared(); return openShareMessage(); }
      if (act === 'toggle-visible') return toggleVisible(Number(t.dataset.id));
      if (act === 'logout') {
        if (await confirmDialog({ title: 'Sair do painel?', text: 'Você precisará da senha para entrar de novo.', ok: 'Sair' })) logout();
        return;
      }
      if (act === 'edit') {
        state.editing = state.products.find((p) => p.id === Number(t.dataset.id)) || null;
        state.tab = 'form';
        render();
        return window.scrollTo({ top: 0 });
      }
      if (act === 'delete') return deleteProduct(Number(t.dataset.id));
      if (act === 'clear-img') return setProductImage('');
      if (act === 'dock') {
        const cur = ls.get(dockKey());
        const items = dockItems();
        const isOpen = cur === t.dataset.id || (!cur && items[0] && items[0].id === t.dataset.id);
        ls.set(dockKey(), isOpen ? 'none' : t.dataset.id);
        const y = window.scrollY; render(); window.scrollTo(0, y); return;
      }
      if (act === 'feature') return toggleFeatured(Number(t.dataset.id));
      if (act === 'group-locked') {
        return confirmDialog({ title: '💬 Card do grupo', text: 'Um card verde na vitrine convida seus clientes para o seu grupo ou canal de ofertas no WhatsApp. É um recurso do plano Completo.', ok: 'Ver o plano Completo' })
          .then((ok) => { if (ok) openPay('complete'); });
      }
      if (act === 'landing-locked') {
        return confirmDialog({ title: '✨ Estilo Landing', text: 'A vitrine abre como um site, com apresentação em tela cheia, efeitos de luz e a loja logo abaixo. É exclusivo do plano Completo.', ok: 'Ver o plano Completo' })
          .then((ok) => { if (ok) openPay('complete'); });
      }
      if (act === 'bulk-open') return openBulk();
      if (act === 'bulk-go') return runBulk();
      if (act === 'autofill') return autoFill(true);
      if (act === 'offer-generate') return generateOffer();
      if (act === 'offer-copy') return copy($('#offerText').value, 'Oferta copiada! É só colar 🔥');
      if (act === 'offer-wa') return window.open(waLink('', $('#offerText').value), '_blank', 'noopener');
      if (act === 'offer-save') return saveOfferAsProduct();
      if (act === 'offer-clear') { state.offer = null; return render(); }
      if (act === 'offer') return openProductOffer(Number(t.dataset.id));
      if (act === 'model') return setOfferModel(Number(t.dataset.model));
      if (act === 'clear-avatar') return setAvatar('');
      if (act === 'clear-cover') { setCover(''); return toast('Capa removida. Toque em "Salvar perfil".'); }
      if (act === 'stores') return showStores();
      if (act === 'open-store') return openStore(t.dataset.id);
      if (act === 'new-store') return openNewStore();
      if (act === 'upgrade') return openPay('complete');
      if (act === 'pay') return openPay(t.dataset.plan);
      if (act === 'plans') return openPay();
      if (act === 'install') return installApp();
      if (act === 'art-store') return openArt('store');
      if (act === 'offer-art') {
        const o = state.offerProduct || state.offer;
        if (!o) return toast('Gere uma oferta primeiro.');
        // o diálogo da oferta do produto é substituído pela arte
        return openArt('offer', { ...o });
      }
      if (act === 'go-pass') {
        if (state.view === 'stores') { const first = state.stores[0]; if (first) await openStore(first.id); }
        go('account');
        setTimeout(() => { const f = $('#passForm'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); f.current_password.focus(); } }, 250);
        return;
      }
      if (act === 'trial-hide') { ls.set(`vitrine:trial-hide:${(state.account || {}).id || ''}`, String(Date.now())); return render(); }
      if (act === 'tpl-edit') return openTemplateEditor();
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'productForm') { e.preventDefault(); saveProduct(e.target); }
      if (e.target.id === 'profileForm') { e.preventDefault(); saveProfile(e.target); }
      if (e.target.id === 'passForm') { e.preventDefault(); savePassword(e.target); }
    });

    document.addEventListener('change', async (e) => {
      const el = e.target;
      if (el.name === 'platform') { updatePlatformHints(); syncPriceDefault(); }
      if (el.name === 'bulkMode') { const f = $('#bulkCatField'); if (f) { f.hidden = el.value !== 'cat'; if (el.value === 'cat') $('#bulkCat').focus(); } }
      if (el.id === 'showPrice') onShowPriceChange(el);
      if (el.name === 'affiliate_link' && !state.editing) autoFill(false);
      if (el.id === 'isPhysical') {
        $('#citiesField').hidden = !el.checked;
        if ($('#cityChipsWrap')) $('#cityChipsWrap').hidden = !el.checked;
        const box = document.querySelector('[name="delivery_cities"]');
        // Ligou "entrega local" num produto sem cidades: preenche com as últimas usadas.
        if (el.checked && box && !box.value.trim() && lastCities()) {
          box.value = lastCities();
          if ($('#cityChips')) $('#cityChips').outerHTML = citiesChips(box.value);
          toast('Cidades preenchidas com as últimas que você usou 📍');
        }
      }
      if (el.dataset && el.dataset.setting === 'store_style') {
        document.querySelectorAll('.glass-off').forEach((x) => { x.hidden = el.value !== 'classic'; });
        document.querySelectorAll('.landing-only').forEach((x) => { x.hidden = el.value !== 'landing'; });
        document.querySelectorAll('.theme-row').forEach((x) => { x.hidden = el.value === 'glass'; });
      }
      if (el.dataset && el.dataset.setting) saveSettings();
      if (el.id === 'imgFile' && el.files[0]) { await handleProductImage(el.files[0]); el.value = ''; }
      if (el.id === 'imgUrl') {
        const v = el.value.trim();
        if (!v) return;
        if (!/^https?:\/\//i.test(v)) return toast('O link da imagem deve começar com https://', true);
        setProductImage(v);
      }
      if (el.id === 'coverFile' && el.files[0]) {
        try { await openCoverCrop(el.files[0]); } catch (err) { toast(err.message || 'Não consegui abrir esta imagem.', true); }
        el.value = '';
      }
      if (el.id === 'avatarFile' && el.files[0]) {
        try { setAvatar(await processImage(el.files[0], { maxSide: 512 })); toast('Foto pronta. Toque em "Salvar perfil".'); }
        catch (err) { toast(err.message, true); }
        el.value = '';
      }
      if (el.id === 'customColor') setColor(el.value.toLowerCase());
    });

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.id === 'bulkText') { bulkText = el.value; updateBulkCount(); return; }
      if (el.id === 'bulkCat') { bulkCat = el.value; return; }
      if (el.id === 'pSearch') {
        state.query = el.value;
        const pos = el.selectionStart;
        render();
        const s = $('#pSearch');
        if (s) { s.focus(); s.setSelectionRange(pos, pos); }
      }
      if (el.dataset && el.dataset.offer) { state.offer[el.dataset.offer] = el.value; updateOfferPreview(); return; }
      if (el.name === 'category') document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === el.value)));
      if (el.name === 'title' && $('#titleCount')) $('#titleCount').textContent = `${el.value.length}/120`;
      if (el.name === 'description' && $('#descCount')) $('#descCount').textContent = `${el.value.length}/1500`;
    });

    ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (drop) { e.preventDefault(); drop.classList.add('drag'); }
    }));
    ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (!drop) return;
      drop.classList.remove('drag');
      if (ev === 'drop') {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files[0];
        if (file && !isExpired()) handleProductImage(file);
      }
    }));

    /* ---------------- Início ---------------- */
    async function init() {
      try {
        const cfg = await fetch(API + '/api/config').then((r) => (r.ok ? r.json() : null));
        if (cfg) state.config = { ...state.config, ...cfg };
      } catch { /* usa padrões */ }

      const last = ls.get('vitrine:last-login');
      if (last) $('#loginStore').value = last;
      const urlStore = new URLSearchParams(location.search).get('loja');
      if (urlStore) $('#loginStore').value = urlStore;

      state.token = ls.get(TOKEN_KEY);
      if (!state.token) return showLogin();
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          await restoreSession();
          return;
        } catch (err) {
          if (err.status === 401) return;
          const temporary = err.status === 0 || err.status >= 500;
          if (temporary && attempt < 3) {
            showConnecting(attempt);
            await new Promise((r) => setTimeout(r, attempt * 1500));
            continue;
          }
          return temporary ? showOffline() : showLogin(err.message);
        }
      }
    }

    // Enquanto tenta reconectar: tela leve, sem pedir senha de novo (a sessão continua guardada).
    function showConnecting(attempt) {
      $('#appView').hidden = true;
      $('#loginView').hidden = false;
      const box = $('#loginError');
      box.hidden = false;
      box.classList.add('soft');
      box.textContent = `Conectando à sua vitrine... (tentativa ${attempt + 1} de 3)`;
    }
    function showOffline() {
      $('#appView').hidden = true;
      $('#loginView').hidden = false;
      const box = $('#loginError');
      box.hidden = false;
      box.classList.add('soft');
      box.innerHTML = 'A conexão está instável agora. Sua sessão continua salva. <button type="button" class="retry-link" onclick="location.reload()">Tentar de novo</button>';
    }

    async function restoreSession() {
      {
        const welcome = new URLSearchParams(location.search).get('bemvindo');
        const paidId = new URLSearchParams(location.search).get('pago');
        if (paidId) {
          history.replaceState(null, '', location.pathname);
          setTimeout(() => { toast('Confirmando seu pagamento...'); watchPayment(Number(paidId)); }, 600);
        }
        state.storeId = ls.get(STORE_KEY);
        if (welcome) {
          await loadMe();
          state.view = 'app';
          $('#appView').hidden = false;
          render();
          startPing();
          history.replaceState(null, '', location.pathname);
          toast(`🎉 Vitrine criada! Teste grátis do plano Completo por ${state.account ? state.account.trial_days_left : 7} dias. Cadastre seu 1º produto.`);
        } else {
          await loadStores();
          if (state.storeId && !state.stores.some((x) => x.id === state.storeId)) state.storeId = null;
          // Recarregar a página volta para a loja que estava aberta.
          if (state.storeId || !wantsPicker()) {
            await loadMe();
            state.view = 'app';
            $('#appView').hidden = false;
            render();
            startPing();
          } else {
            await afterLogin();
          }
        }
      }
      const box = $('#loginError');
      if (box) box.classList.remove('soft');
    }

    init();
  })();
  </script>
</body>
