<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#16a6e0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vitrine App">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Painel da Loja | Vitrine App</title>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/app-touch-180.png">
  <script src="/config.js"></script>
  <style>
    :root {
      --accent: #16a6e0;
      --accent-ink: #ffffff;
      --accent-2: #6d5dfc;
      --accent-soft: #e3f5fd;
      --accent-deep: #0b7fb3;
      --bg: #eef0f4;
      --card: #ffffff;
      --ink: #14161b;
      --ink-2: #3b4150;
      --muted: #8a90a0;
      --line: #e6e8ee;
      --field: #f5f6f8;
      --ok: #16a34a;
      --danger: #e11d48;
      --warn: #f59e0b;
      --wa: #25d366;
      --wa-deep: #128c4b;
      --radius-lg: 26px;
      --radius: 20px;
      --shadow: 0 1px 2px rgba(20, 22, 27, .04), 0 8px 24px rgba(20, 22, 27, .06);
      --shadow-lg: 0 20px 60px rgba(20, 22, 27, .18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.4; -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 12px; }
    [hidden] { display: none !important; }
    svg { flex-shrink: 0; }

    .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px calc(112px + var(--safe-bottom)); }
    @media (min-width: 720px) { .wrap { padding: 28px 24px calc(120px + var(--safe-bottom)); } }

    /* ---------- Componentes ---------- */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card + .card { margin-top: 14px; }
    .mode-pick { display: grid; gap: 8px; margin: 2px 0 14px; }
    .mode-pick label { display: block; cursor: pointer; }
    .mode-pick input { position: absolute; opacity: 0; pointer-events: none; }
    .mode-pick span { display: block; padding: 11px 14px; border-radius: 14px; border: 2px solid #e6e8ee; background: var(--card); }
    .mode-pick b { display: block; font-size: 14.5px; }
    .mode-pick small { color: #7d8494; font-size: 12.5px; }
    .mode-pick input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
    .mode-pick input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
    /* Desempenho (gráfico) — tom claro, combinando com a página */
    .perf { position: relative; overflow: hidden; border-radius: 22px; padding: 16px 16px 12px; margin: 0 0 14px; color: #0f172a;
      background: linear-gradient(160deg, #eef8fe 0%, #e4f4fd 55%, #ecfdf3 100%); border: 1px solid #cfeafb;
      box-shadow: 0 6px 20px rgba(22, 166, 224, .10); }
    .perf-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .perf-head strong { font-size: 15px; color: #0f172a; }
    .perf-head small { display: block; font-size: 11.5px; color: #5b6b82; font-weight: 600; }
    .perf-range { display: flex; background: #fff; border: 1px solid #d6ebf7; border-radius: 999px; padding: 3px; }
    .perf-range button { border: 0; background: none; color: #5b6b82; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
    .perf-range button[aria-pressed="true"] { background: #16a34a; color: #fff; box-shadow: 0 4px 12px rgba(22, 163, 74, .35); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .kpi { background: #fff; border: 1px solid #e2eef6; border-radius: 14px; padding: 9px 7px 8px; min-width: 0; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
    .kpi span { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #5b6b82; white-space: nowrap; }
    .kpi span i { width: 6px; height: 6px; border-radius: 2px; flex-shrink: 0; }
    .kpi b { display: block; font-size: 20px; font-weight: 900; margin-top: 3px; line-height: 1.1; color: #0f172a; font-variant-numeric: tabular-nums; }
    .kpi em { font-style: normal; font-size: 10.5px; font-weight: 800; }
    .kpi em.up { color: #16a34a; } .kpi em.down { color: #e11d48; } .kpi em.flat { color: #94a3b8; }
    .chart-wrap { position: relative; background: #fff; border: 1px solid #e2eef6; border-radius: 16px; padding: 10px 8px 4px; }
    .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-wrap .bar { transition: opacity .2s; cursor: pointer; }
    .chart-legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; font-weight: 700; color: #5b6b82; margin-top: 8px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart-legend i { width: 10px; height: 10px; border-radius: 3px; }
    .chart-tip { position: absolute; top: 4px; transform: translate(-50%, -100%); background: #0f172a; color: #fff; font-size: 11.5px; font-weight: 700; padding: 6px 9px; border-radius: 10px; white-space: nowrap; pointer-events: none; box-shadow: 0 8px 20px rgba(15,23,42,.25); }
    .chart-tip b { color: #4ade80; } .chart-tip u { text-decoration: none; color: #7dd3fc; }
    .perf-empty { position: absolute; inset: 24% 8% auto; text-align: center; font-size: 12.5px; font-weight: 700; color: #334155; background: rgba(255,255,255,.92); border: 1px solid #e2eef6; border-radius: 12px; padding: 8px 10px; }
    .perf-skel { height: 230px; border-radius: 14px; background: linear-gradient(90deg, #fff, #eef6fb, #fff); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (max-width: 380px) { .kpi b { font-size: 17px; } .kpis { gap: 6px; } .kpi span { font-size: 10.5px; } .kpi span i { display: none; } }
    /* Tutorial e dicas (configurados no Master) */
    .learn { margin: 14px 0; }
    .yt-cta { display: flex; align-items: center; gap: 12px; width: 100%; text-decoration: none; color: #fff; border-radius: 18px; padding: 12px 14px;
      background: linear-gradient(135deg, #ff0033, #ff4d4d); box-shadow: 0 10px 24px rgba(255, 0, 51, .28); font-weight: 800; font-size: 15px; }
    .yt-cta .yt-ic { width: 44px; height: 32px; border-radius: 9px; background: #fff; display: grid; place-items: center; flex-shrink: 0; }
    .yt-cta small { display: block; font-size: 12px; font-weight: 600; opacity: .9; }
    .yt-cta .go { margin-left: auto; font-size: 20px; }
    .tips-row { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 12px 2px 4px; margin: 0 -2px; scrollbar-width: none; }
    .tips-row::-webkit-scrollbar { display: none; }
    .tip { flex: 0 0 min(78%, 260px); scroll-snap-align: start; background: #fff; border: 1px solid #e6edf3; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 2px 8px rgba(15, 23, 42, .04); }
    .tip .te { font-size: 24px; line-height: 1; }
    .tip strong { font-size: 14.5px; }
    .tip p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; flex: 1; }
    .tip a { align-self: flex-start; margin-top: 4px; text-decoration: none; font-weight: 800; font-size: 12.5px; color: var(--accent-deep); background: var(--accent-soft); border-radius: 999px; padding: 6px 12px; }
    .tip.only { flex-basis: 100%; }
    /* Vários de uma vez */
    .bulk-cta { width: 100%; display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 12px 14px; border-radius: 18px; border: 1px solid #d6e6ff; background: linear-gradient(135deg, #eef6ff, #f4f0ff); cursor: pointer; font: inherit; color: inherit; text-align: left; }
    .bulk-cta .bi { width: 40px; height: 40px; border-radius: 13px; background: #fff; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(30, 90, 200, .12); }
    .bulk-cta b { display: block; font-size: 14.5px; }
    .bulk-cta small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    .bulk-cta .bt { margin-left: auto; flex-shrink: 0; font-weight: 800; font-size: 12px; color: var(--accent-deep, #0f7fd0); }
    .bulk-text { min-height: 150px; resize: vertical; font-size: 13.5px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bulk-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
    .bulk-meta .warn { color: #b45309; font-weight: 700; }
    .bulk-seg { grid-template-columns: 1fr 1fr; }
    .bulk-res { margin-top: 14px; }
    .bulk-head { display: flex; flex-direction: column; gap: 2px; }
    .bulk-head strong { font-size: 15.5px; }
    .bulk-head span { font-size: 12.5px; color: var(--muted); }
    .bulk-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .bulk-list li { min-width: 0; display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 12px; background: #f6f8fb; }
    .bulk-list li.ok { background: #effbf3; }
    .bulk-list li.error, .bulk-list li.stop { background: #fff7ed; }
    .bl-ic { width: 22px; flex-shrink: 0; text-align: center; font-size: 15px; line-height: 20px; }
    .bl-tx { min-width: 0; flex: 1; font-size: 13px; line-height: 1.35; }
    .bl-tx b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bl-tx small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
    .bl-tx .bl-price { color: #15803d; font-weight: 800; font-size: 12.5px; }
    .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #c7d7ee; border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Escolha do estilo da vitrine */
    .style-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .style-pick input { position: absolute; opacity: 0; pointer-events: none; }
    .sp-card { display: block; border: 2px solid var(--line, #e6e8ee); border-radius: 18px; padding: 8px 8px 10px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .style-pick input:checked + .sp-card { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .style-pick input:focus-visible + .sp-card { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); }
    .sp-prev { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; height: 84px; border-radius: 12px; padding: 7px; overflow: hidden; }
    .sp-prev i { grid-column: 1 / -1; height: 30px; border-radius: 8px; }
    .sp-prev b { border-radius: 7px; }
    .sp-prev.classic { background: #eef0f4; }
    .sp-prev.classic i { background: linear-gradient(135deg, #16a6e0, #0f7fb0); }
    .sp-prev.classic b { background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .06); }
    .sp-prev.glass { background: radial-gradient(80% 90% at 85% 0%, color-mix(in srgb, var(--c) 70%, transparent), transparent 70%), radial-gradient(70% 70% at 0% 100%, rgba(255, 140, 60, .45), transparent 70%), #121216; }
    .sp-prev.glass i, .sp-prev.glass b { background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .16); }
    .sp-name { display: block; font-weight: 800; font-size: 14px; margin-top: 8px; }
    #loginError.soft { background: #eef6ff; color: #1e4f8a; }
    .retry-link { display: inline; border: 0; background: none; padding: 0; margin-left: 4px; font: inherit; font-weight: 800; color: inherit; text-decoration: underline; cursor: pointer; }
    .trial-note { margin: 0 0 12px; padding: 10px 12px; border-radius: 14px; background: #fff7e6; color: #7a4b00; font-size: 13px; line-height: 1.45; }
    .pp-lose { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: #fff1f2; color: #9f1239; font-size: 12.5px; }
    .pp-lose ul { margin: 4px 0 0; padding-left: 0; }
    .pp-lose li { list-style: none; margin: 2px 0; }
    .lose-box { margin: 8px 0 2px; font-size: 13px; }
    .lose-box summary { cursor: pointer; font-weight: 800; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .lose-box ul { margin: 6px 0 0; padding: 0; }
    .lose-box li { list-style: none; margin: 3px 0; }
    .lose-box li::before { content: "✕ "; font-weight: 900; color: #e11d48; }
    .style-pick .sp-wide { grid-column: 1 / -1; }
    .style-pick .sp-wide.locked .sp-card { cursor: default; }
    .style-pick .sp-wide.locked .sp-prev { filter: saturate(.6); }
    .sp-lock { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #7c5cff, #19a7ff); border-radius: 99px; padding: 6px 11px; cursor: pointer; }
    .sp-prev.landing { position: relative; display: block; height: 96px; background: radial-gradient(80% 90% at 70% 0%, color-mix(in srgb, var(--c) 75%, transparent), transparent 70%), #07070c; }
    .sp-prev.landing .lz { position: absolute; left: -20%; width: 140%; height: 2px; top: 34%; transform: rotate(-12deg); background: linear-gradient(90deg, transparent, var(--c), #fff, var(--c), transparent); box-shadow: 0 0 8px var(--c); }
    .sp-prev.landing .lz.l2 { top: 58%; transform: rotate(9deg); background: linear-gradient(90deg, transparent, #ff3df2, #fff, #ff3df2, transparent); box-shadow: 0 0 8px #ff3df2; }
    .sp-prev.landing .lt { position: absolute; left: 12px; top: 14px; color: #fff; font-weight: 900; font-size: 20px; letter-spacing: -.03em; }
    .sp-prev.landing .lf { position: absolute; left: -30%; right: -30%; bottom: -10px; height: 40px; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, transparent) 0 1px, transparent 1px 16px), repeating-linear-gradient(0deg, color-mix(in srgb, var(--c) 60%, transparent) 0 1px, transparent 1px 12px); transform: perspective(120px) rotateX(55deg); opacity: .5; }
    .sp-name em { font-style: normal; font-size: 10px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #7c5cff, #19a7ff); border-radius: 99px; padding: 2px 6px; vertical-align: 2px; }
    .sp-card small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
    /* Indique e ganhe */
    .ref-card { position: relative; margin: 0 0 16px; padding: 16px; border-radius: 22px; background: linear-gradient(150deg, #fff4fb, #f3f0ff); border: 1px solid #f0dcf3; }
    .ref-head { display: flex; gap: 12px; align-items: center; padding-right: 26px; }
    .ref-emoji { width: 42px; height: 42px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(162, 28, 175, .12); }
    .ref-head strong { display: block; font-size: 15.5px; }
    .ref-head small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .ref-link { margin: 12px 0 10px; background: #fff; border: 1px dashed #e3b7ec; border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 13px; color: #86198f; overflow-wrap: anywhere; }
    .ref-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ref-btns .btn { justify-content: center; }
    .ref-wa { background: #16a34a; color: #fff; border: 0; }
    .ref-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
    .ref-stats b { color: #86198f; font-size: 14px; }
    .ref-mini { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; padding: 11px 14px; border-radius: 16px; border: 1px solid #f0dcf3; background: #fff7fd; cursor: pointer; font: inherit; font-size: 13.5px; color: inherit; text-align: left; }
    .ref-mini .go { font-weight: 800; color: #a21caf; font-size: 12.5px; flex-shrink: 0; }
    /* Primeiros passos */
    .checklist { position: relative; margin: 0 0 16px; padding: 16px; border-radius: 22px; background: linear-gradient(160deg, #eef7ff, #f6f2ff); border: 1px solid #dfeaf7; }
    .checklist .ck-head { display: flex; gap: 12px; align-items: center; padding-right: 26px; }
    .checklist .ck-emoji { width: 42px; height: 42px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(30, 90, 200, .12); }
    .checklist strong { display: block; font-size: 15.5px; }
    .checklist .ck-head small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .ck-bar { height: 8px; border-radius: 99px; background: #fff; margin: 12px 0 10px; overflow: hidden; }
    .ck-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #19a7ff, #7c5cff); transition: width .5s ease; }
    .ck-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .ck-list li { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 9px 10px; border: 1px solid transparent; }
    .ck-list li.next { border-color: #b9d8ff; box-shadow: 0 4px 14px rgba(25, 120, 255, .10); }
    .ck-list li.ok { background: rgba(255, 255, 255, .55); }
    .ck-list li.ok b { color: var(--muted); text-decoration: line-through; font-weight: 600; }
    .ck-dot { width: 30px; height: 30px; border-radius: 50%; background: #f0f5fb; display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
    .ck-list li.ok .ck-dot { background: #22c55e; color: #fff; font-weight: 900; font-size: 14px; }
    .ck-txt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.3; }
    .ck-txt small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .ck-go { border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 12px; color: #fff; background: var(--accent-deep, #0f7fd0); border-radius: 999px; padding: 7px 12px; flex-shrink: 0; }
    .ck-list li:not(.next) .ck-go { background: #eaf3fc; color: var(--accent-deep, #0f7fd0); }
    .checklist.done-all { text-align: left; }
    .checklist .ck-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .trial-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 4px; }
    .trial-stats div { background: rgba(255, 255, 255, .75); border-radius: 12px; padding: 8px 6px; text-align: center; }
    .trial-stats b { display: block; font-size: 18px; line-height: 1.1; }
    .trial-stats span { font-size: 11px; color: var(--muted); font-weight: 700; }
    .tip-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tip-acts a { margin-top: 0; }
    .tip-acts button { border: 1px solid #dbe6ef; background: #fff; cursor: pointer; font: inherit; font-weight: 800; font-size: 12.5px; color: var(--ink, #0f172a); border-radius: 999px; padding: 5px 12px; }
    .tip-acts button:active { transform: scale(.97); }
    /* Instalar app */
    .install-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, #16a6e0, #6d5dfc); border-radius: 999px; padding: 7px 13px 7px 10px; box-shadow: 0 6px 16px rgba(22, 166, 224, .35); }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
    .top-row .back-stores { margin: 0; }
    .ios-steps { display: grid; gap: 10px; margin: 6px 0 14px; padding: 0; list-style: none; counter-reset: s; }
    .ios-steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
    .ios-steps li::before { content: counter(s); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-deep); font-weight: 800; display: grid; place-items: center; font-size: 13px; }
    /* Mini resumo em Minhas lojas */
    .mini-perf { display: flex; align-items: flex-end; gap: 3px; height: 30px; padding: 0 2px; }
    .mini-perf i { width: 6px; border-radius: 2px 2px 1px 1px; background: linear-gradient(180deg, #39ff88, #00c853); box-shadow: 0 0 6px rgba(57,255,136,.45); min-height: 3px; }
    .mini-perf i.zero { background: #e5e7eb; box-shadow: none; }

    /* Editor da capa */

    .models button.locked { opacity: .6; }
    .tpl-edit { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

    .card h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }

    .btn {

    }

    .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 30%, transparent); }

    .input, .textarea {

    .row { display: grid; gap: 12px; grid-template-columns: 1fr; }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }

    .switch-row small { color: var(--muted); font-size: 12px; }

    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }

    .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); transition: transform .2s; }

    .pacts .pa span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 11px; }

    .tabbar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--safe-bottom)); z-index: 40;

    function applyTheme(hex) {
      const color = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#16a6e0';
      const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
      document.documentElement.style.setProperty('--accent', color);
      document.documentElement.style.setProperty('--accent-ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.68 ? '#14161b' : '#ffffff');
      $('meta[name="theme-color"]').setAttribute('content', color);

    function setBusy(btn, busy, label) {
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.innerHTML;
        btn.innerHTML = `<span class="spinner"></span>${label || 'Salvando...'}`;
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.label || btn.innerHTML;
        btn.disabled = false;
      }
    }

    async function api(path, { method = 'GET', body, raw, contentType } = {}) {
      const headers = { Accept: 'application/json' };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (state.storeId) headers['X-Store'] = state.storeId;
      const opts = { method, headers };
      if (raw) { opts.body = raw; headers['Content-Type'] = contentType; }
      else if (body !== undefined) { opts.body = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
      let res;
      const tries = method === 'GET' ? 2 : 1;
      for (let i = 0; i < tries; i++) {
        try {
          res = await fetch(API + path, opts);
          if (res.status >= 500 && i < tries - 1) { await new Promise((r) => setTimeout(r, 700)); continue; }
          break;
        } catch {
          if (i < tries - 1) { await new Promise((r) => setTimeout(r, 700)); continue; }
          throw Object.assign(new Error('Sem conexão. Verifique sua internet.'), { status: 0 });
        }
      }
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 && path !== '/api/auth/login') {
        logout();
        throw Object.assign(new Error(data.error || 'Sessão expirada.'), { status: 401 });
      }
      if (!res.ok) throw Object.assign(new Error(data.error || 'Algo deu errado.'), { status: res.status, code: data.code });
      return data;
    }

    function handleError(err) {
      if (err.status === 402) {
        if (state.tenant) state.tenant.status = 'expired';
        if (state.account) state.account.status = 'expired';
        render();
      }
      toast(err.message || 'Algo deu errado.', true);

    function confirmDialog({ title, text, ok = 'Confirmar', danger = false, cancel = 'Cancelar' }) {
      return new Promise((resolve) => {
        const ov = $('#dialogOverlay');
        const dlg = $('#dialog');
        dlg.innerHTML = `<h3 id="dlgTitle">${esc(title)}</h3><p>${esc(text)}</p>
          <div class="acts">${cancel ? `<button type="button" class="btn btn-ghost" data-r="0">${esc(cancel)}</button>` : ''}
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${esc(ok)}</button></div>`;
        ov.classList.add('open');
        const done = (v) => { ov.classList.remove('open'); ov.onclick = null; document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = (e) => { if (e.key === 'Escape') done(false); };
        document.addEventListener('keydown', onKey);
        ov.onclick = (e) => {
          const b = e.target.closest('[data-r]');
          if (b) done(b.dataset.r === '1');
          else if (e.target === ov) done(false);
        };
        dlg.querySelector('[data-r="1"]').focus();
      });
    }

    async function copy(text, msg = 'Link copiado!') {
      try { await navigator.clipboard.writeText(text); toast(msg); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast(msg); } catch { toast('Não foi possível copiar', true); }
        ta.remove();
      }
    }

    // Categorias já usadas pelo lojista (mais usadas primeiro).
    function categories() {
      const count = new Map();
      for (const p of state.products) {
        const c = String(p.category || '').trim();
        if (c) count.set(c, (count.get(c) || 0) + 1);
      }
      return [...count.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR')).map(([c]) => c);
    }

    // Esconde a barra de baixo enquanto o teclado está aberto, para não cobrir os campos.
    document.addEventListener('focusin', (e) => {
      if (e.target.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea')) document.body.classList.add('typing');
    });
    document.addEventListener('focusout', () => {
      setTimeout(() => {
        const a = document.activeElement;
        if (!a || !a.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea')) document.body.classList.remove('typing');

    /* ---------------- Mensagens de oferta (3 modelos) ---------------- */
    const OFFER_MODELS = [
      { id: 1, name: '🔥 Destaque do dia' },
      { id: 2, name: '✨ Achadinho' },
      { id: 3, name: '⚡ Relâmpago' },
    ];

    const parseMoney = (v) => {
      if (v === null || v === undefined || v === '') return null;
      if (typeof v === 'number') return v > 0 ? v : null;
      const n = Number(String(v).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(?:\D|$))/g, '').replace(',', '.'));
      return Number.isFinite(n) && n > 0 ? n : null;
    };

    // Modelos editáveis (plano Completo): {titulo} {de} {por} {desconto} {link}
    const TEMPLATE_DEFAULTS = {
      1: '🔥 DESTAQUE DO DIA 🔥\n\n🎯{titulo}\n\n❌ De ~{de}~\n✅ Por {por}\n🏷️ {desconto}% OFF\n\n🛒 COMPRE AQUI:\n{link}\n\n⏳ Oferta sujeita à disponibilidade de estoque.',
      2: '✨ ACHADINHO DO DIA ✨\n\n🛍️ *{titulo}*\n\n💸 De ~{de}~ por apenas *{por}*\n🏷️ Economize {desconto}%\n\n👉 Garanta o seu aqui:\n{link}\n\n⚠️ Preço e estoque podem mudar a qualquer momento.',
      3: '⚡ OFERTA RELÂMPAGO ⚡\n\n📦 {titulo}\n\n🔻 {desconto}% OFF\n💰 Só {por}\n\n🔗 Aproveite:\n{link}\n\n⏰ Corre que pode acabar a qualquer momento!',
    };
    function customTemplates() {
      try { return JSON.parse((state.settings && state.settings.offer_templates) || '{}') || {}; } catch { return {}; }
    }
    function fillTemplate(tpl, data) {
      const price = parseMoney(data.price);
      let original = parseMoney(data.original);
      if (!(price && original && original > price)) original = null;
      const vals = {
        titulo: String(data.title || '').trim() || 'Produto em oferta',
        de: original ? brl(original) : '',
        por: price ? brl(price) : '',
        desconto: original ? String(Math.round((1 - price / original) * 100)) : '',
        link: String(data.link || '').trim(),
      };
      const out = [];
      for (const line of String(tpl).split('\n')) {
        const keys = [...line.matchAll(/\{(titulo|de|por|desconto|link)\}/g)].map((m) => m[1]);
        // Linha com valor que falta: some (ex.: sem preço antigo, some o "De").
        if (keys.some((k) => !vals[k])) {
          if (keys.includes('por') && !vals.por && !keys.includes('de')) out.push('Confira o preço no link');
          else if (keys.includes('por') && !vals.por) out.push('Confira o preço no link');
          continue;
        }
        out.push(line.replace(/\{(titulo|de|por|desconto|link)\}/g, (_, k) => vals[k]));
      }
      return out.filter((l, i, a) => !(l === '' && (i === 0 || a[i - 1] === ''))).join('\n').replace(/\n{3,}/g, '\n\n').replace(/\n+$/, '');
    }

    function offerText(model, data) {
      const custom = plan().custom_templates ? customTemplates()[model] : null;

      const title = String(data.title || '').trim() || 'Produto em oferta';

      let original = parseMoney(data.original);
      if (!(price && original && original > price)) original = null;
      const off = original ? Math.round((1 - price / original) * 100) : null;
      const link = String(data.link || '').trim();
      let lines;
      if (model === 2) {
        lines = ['✨ ACHADINHO DO DIA ✨', '', `🛍️ *${title}*`, '',
          price ? (original ? `💸 De ~${brl(original)}~ por apenas *${brl(price)}*` : `💸 Por apenas *${brl(price)}*`) : '💸 Preço especial no link',

        if (mail) ls.set('vitrine:email', mail);
        setBusy(b, true, b.dataset.p === 'pix' ? 'Gerando Pix...' : 'Abrindo...');
        try {
          const data = await api('/api/me/pay', { method: 'POST', body: { plan, period, method: b.dataset.p, email: mail } });
          if (b.dataset.p === 'card') { location.href = data.checkout_url; return; }

    /* ---------------- Estúdio de artes: Status/Story e Post (todos os planos) ---------------- */
    // Desenha no próprio celular (canvas): não gasta servidor. Fotos da Shopee/ML passam pela ponte /api/img.
    const ART_SIZES = { story: [1080, 1920], post: [1080, 1080] };
    let artFormat = ls.get('vitrine:art-format') === 'post' ? 'post' : 'story';

    function artImage(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        let src = String(url);
        if (/^https?:/i.test(src) && !src.startsWith(location.origin)) src = `${API}/api/img?u=${encodeURIComponent(src)}`;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }
    function rr(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function coverImg(ctx, img, x, y, w, h, r = 0) {
      ctx.save();
      if (r) { rr(ctx, x, y, w, h, r); ctx.clip(); }
      const k = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
      ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
      ctx.restore();
    }
    function containImg(ctx, img, x, y, w, h) {
      const k = Math.min(w / img.naturalWidth, h / img.naturalHeight);
      const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
      ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
    }
    function wrapLines(ctx, text, maxW, maxLines) {
      const words = String(text || '').split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = '';
      for (const w of words) {
        const t = cur ? `${cur} ${w}` : w;
        if (ctx.measureText(t).width <= maxW) { cur = t; continue; }
        if (cur) lines.push(cur);
        cur = w;
        if (lines.length === maxLines) break;
      }
      if (lines.length < maxLines && cur) lines.push(cur);
      if (lines.length === maxLines && words.join(' ').length > lines.join(' ').length) {
        let last = lines[maxLines - 1];
        while (ctx.measureText(`${last}…`).width > maxW && last.length) last = last.slice(0, -1);
        lines[maxLines - 1] = `${last.trim()}…`;
      }
      return lines;
    }
    const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    const mixHex = (hex, other, t) => {
      const a = hex.replace('#', ''), b = other.replace('#', '');
      const c = (i) => Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, '0');
      return `#${c(0)}${c(2)}${c(4)}`;
    };
    function brandColor() {
      const c = state.tenant && state.tenant.theme_color;
      return /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#16a6e0';
    }
    function drawLogo(ctx, logo, cx, cy, r, name, color) {
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, Math.PI * 2); ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 30; ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
      if (logo) coverImg(ctx, logo, cx - r, cy - r, r * 2, r * 2);
      else {
        ctx.fillStyle = color; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(r * 0.8)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(initials(name), cx, cy + 2);
      }
      ctx.restore();
    }
    function pill(ctx, text, cx, y, h, bg, fg, font) {
      ctx.font = font;
      const w = ctx.measureText(text).width + h * 1.2;
      ctx.fillStyle = bg; rr(ctx, cx - w / 2, y, w, h, h / 2); ctx.fill();
      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, y + h / 2 + 2);
    }

    // Arte da vitrine (modelo "vitrine"): ondas na cor da loja, foto redonda, nome, 4 produtos,
    // botão "Conheça minha vitrine", link e selos. Todas as cores saem da cor escolhida pelo lojista.
    function sparkle(ctx, x, y, r, color) {
      ctx.save(); ctx.fillStyle = color; ctx.beginPath();
      ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x + r * 0.12, y - r * 0.12, x + r, y);
      ctx.quadraticCurveTo(x + r * 0.12, y + r * 0.12, x, y + r); ctx.quadraticCurveTo(x - r * 0.12, y + r * 0.12, x - r, y);
      ctx.quadraticCurveTo(x - r * 0.12, y - r * 0.12, x, y - r); ctx.fill(); ctx.restore();
    }
    function heartPath(ctx, cx, cy, w) {
      const h = w * 0.9;
      ctx.beginPath();
      ctx.moveTo(cx, cy + h * 0.38);
      ctx.bezierCurveTo(cx - w * 0.62, cy - h * 0.05, cx - w * 0.38, cy - h * 0.62, cx, cy - h * 0.22);
      ctx.bezierCurveTo(cx + w * 0.38, cy - h * 0.62, cx + w * 0.62, cy - h * 0.05, cx, cy + h * 0.38);
      ctx.closePath();
    }
    function bagIcon(ctx, cx, cy, w, { stroke = null, fill = null, heart = null, lw = 6 } = {}) {
      const h = w * 0.9, x = cx - w / 2, y = cy - h / 2 + w * 0.12;
      ctx.save(); ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      rr(ctx, x, y, w, h * 0.86, w * 0.14);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(cx, y, w * 0.24, Math.PI, 0); ctx.strokeStyle = stroke || fill; ctx.stroke();
      if (heart) { heartPath(ctx, cx, y + h * 0.43, w * 0.42); if (fill) { ctx.fillStyle = heart; ctx.fill(); } else { ctx.strokeStyle = heart; ctx.stroke(); } }
      ctx.restore();
    }
    function shieldIcon(ctx, cx, cy, s, color) {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = s * 0.09; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.5); ctx.lineTo(cx + s * 0.42, cy - s * 0.34); ctx.lineTo(cx + s * 0.42, cy);
      ctx.quadraticCurveTo(cx + s * 0.4, cy + s * 0.36, cx, cy + s * 0.52); ctx.quadraticCurveTo(cx - s * 0.4, cy + s * 0.36, cx - s * 0.42, cy);
      ctx.lineTo(cx - s * 0.42, cy - s * 0.34); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - s * 0.17, cy + s * 0.01); ctx.lineTo(cx - s * 0.03, cy + s * 0.15); ctx.lineTo(cx + s * 0.2, cy - s * 0.12); ctx.stroke();
      ctx.restore();
    }
    function truckIcon(ctx, cx, cy, s, color) {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = s * 0.08; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      const x = cx - s * 0.42, y = cy - s * 0.28;
      rr(ctx, x + s * 0.1, y, s * 0.46, s * 0.4, s * 0.05); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + s * 0.56, y + s * 0.12); ctx.lineTo(x + s * 0.72, y + s * 0.12); ctx.lineTo(x + s * 0.84, y + s * 0.26);
      ctx.lineTo(x + s * 0.84, y + s * 0.4); ctx.lineTo(x + s * 0.56, y + s * 0.4); ctx.stroke();
      [x + s * 0.28, x + s * 0.7].forEach((wx) => { ctx.beginPath(); ctx.arc(wx, y + s * 0.44, s * 0.08, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); });
      [0.08, 0.18, 0.28].forEach((dy, k) => { ctx.beginPath(); ctx.moveTo(x - s * 0.14 + k * s * 0.03, y + s * dy); ctx.lineTo(x + s * 0.04, y + s * dy); ctx.stroke(); });
      ctx.restore();
    }
    function chatIcon(ctx, cx, cy, s, color) {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = s * 0.08; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy - s * 0.04, s * 0.4, Math.PI * 0.75, Math.PI * 2.55); ctx.lineTo(cx - s * 0.4, cy + s * 0.38); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    function heartIcon(ctx, cx, cy, s, color) {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = s * 0.09; ctx.lineJoin = 'round';
      heartPath(ctx, cx, cy + s * 0.04, s * 0.95); ctx.stroke(); ctx.restore();
    }
    function fitFont(ctx, text, weight, start, min, maxW) {
      let size = start;
      while (size > min) { ctx.font = `${weight} ${size}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; size -= 2; }
      ctx.font = `${weight} ${size}px ${FONT}`;
      return size;
    }

    async function drawStoreArt(format) {
      const [W, H] = ART_SIZES[format];
      const story = format === 'story';
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const t = state.tenant, color = brandColor();
      const deep = mixHex(color, '#000000', 0.32), soft = mixHex(color, '#ffffff', 0.86), softer = mixHex(color, '#ffffff', 0.94);

      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath();

      // selos

    // Arte da oferta: foto, nome, de/por, % OFF, cor e nome da loja.
    async function drawOfferArt(format, o) {
      const [W, H] = ART_SIZES[format];
      const story = format === 'story';
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const t = state.tenant, color = brandColor();
      const [photo, logo] = await Promise.all([artImage(o.image), artImage(t.avatar_url)]);
      const price = parseMoney(o.price), orig = parseMoney(o.original);
      const hasOff = price && orig && orig > price;
      const off = hasOff ? Math.round((1 - price / orig) * 100) : 0;
      // Produto de afiliado: o preço é do site parceiro e pode mudar — a arte avisa. Produto próprio não precisa.
      const plat = o.platform === 'shopee' || o.platform === 'mercadolivre' ? o.platform
        : /shopee\./i.test(o.link || '') ? 'shopee' : /(meli\.la|mercadoli[bv]re)/i.test(o.link || '') ? 'mercadolivre' : '';
      const priceNote = price && plat ? `Preço sujeito a alteração · confira ${plat === 'shopee' ? 'na Shopee' : 'no Mercado Livre'}` : '';
      const noteH = priceNote ? (story ? 76 : 54) : 0;
      const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, color); g.addColorStop(1, mixHex(color, '#000000', 0.45));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // brilhos
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(W * 0.9, H * 0.08, story ? 320 : 220, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(W * 0.05, H * 0.95, story ? 280 : 200, 0, Math.PI * 2); ctx.fill();
      // topo: logo + loja
      const lr = story ? 46 : 38, top = story ? 80 : 54;
      drawLogo(ctx, logo, 60 + lr, top + lr, lr, t.store_name, mixHex(color, '#000000', 0.2));
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = `800 ${story ? 40 : 34}px ${FONT}`;
      ctx.fillText(wrapLines(ctx, t.store_name, W - 420, 1)[0] || '', 60 + lr * 2 + 26, top + lr);
      pill(ctx, '🔥 OFERTA', W - 60 - (story ? 140 : 120), top + lr - (story ? 34 : 28), story ? 68 : 56, '#fff', '#0f172a', `900 ${story ? 34 : 28}px ${FONT}`);
      // foto do produto + título + preço, centralizados entre o topo e o rodapé
      ctx.font = `800 ${story ? 60 : 42}px ${FONT}`;
      const titleLines = wrapLines(ctx, o.title || 'Produto em oferta', W - 140, story ? 3 : 2);
      const lineH = story ? 72 : 52;
      const box = story ? 880 : 480;
      const blockH = box + (story ? 110 : 70) + titleLines.length * lineH + (hasOff ? (story ? 120 : 78) : 0) + (story ? 100 : 74) + noteH;
      const areaTop = story ? 210 : 140, areaBottom = H - (story ? 200 : 150);
      const bx = (W - box) / 2, by = areaTop + Math.max(0, (areaBottom - areaTop - blockH) / 2);
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 40; ctx.fillStyle = '#fff'; rr(ctx, bx, by, box, box, 48); ctx.fill(); ctx.restore();
      if (photo) { ctx.save(); rr(ctx, bx + 30, by + 30, box - 60, box - 60, 30); ctx.clip(); containImg(ctx, photo, bx + 30, by + 30, box - 60, box - 60); ctx.restore(); }
      if (hasOff) {
        const r = story ? 110 : 80, cx = bx + box - r * 0.55, cy = by + r * 0.55;
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#ef233c'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `900 ${story ? 64 : 46}px ${FONT}`; ctx.fillText(`-${off}%`, cx, cy - (story ? 8 : 6));
        ctx.font = `800 ${story ? 26 : 20}px ${FONT}`; ctx.fillText('OFF', cx, cy + (story ? 42 : 30));
      }
      // título
      let y = by + box + (story ? 110 : 70);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = `800 ${story ? 60 : 42}px ${FONT}`;
      titleLines.forEach((l) => { ctx.fillText(l, W / 2, y); y += lineH; });
      // preços
      y += story ? 20 : 6;
      if (hasOff) {
        ctx.font = `700 ${story ? 44 : 34}px ${FONT}`; ctx.globalAlpha = 0.85;
        const deTxt = `De ${brl(orig)}`; ctx.fillText(deTxt, W / 2, y);
        const dw = ctx.measureText(deTxt).width; ctx.fillRect(W / 2 - dw / 2, y - (story ? 15 : 12), dw, story ? 4 : 3);
        ctx.globalAlpha = 1; y += story ? 100 : 72;
      } else {
        y += story ? 70 : 50; // sem "De": afasta o preço grande do nome
      }
      if (price) {
        ctx.font = `900 ${story ? 104 : 74}px ${FONT}`; ctx.fillStyle = '#fff';
        ctx.fillText(`${hasOff ? 'Por ' : ''}${brl(price)}`, W / 2, y);
        if (priceNote) {
          ctx.font = `700 ${story ? 32 : 24}px ${FONT}`;
          const nw = ctx.measureText(priceNote).width + (story ? 56 : 40), nh = story ? 56 : 42, ny = y + (story ? 34 : 24);
          ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(ctx, W / 2 - nw / 2, ny, nw, nh, nh / 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(priceNote, W / 2, ny + nh / 2); ctx.textBaseline = 'alphabetic';
        }
      } else {
        ctx.font = `800 ${story ? 54 : 40}px ${FONT}`; ctx.fillText('Confira o preço no link', W / 2, y);
      }
      // rodapé
      const fy = H - (story ? 170 : 140);
      pill(ctx, '🛒 Link na bio · Garanta o seu!', W / 2, fy, story ? 96 : 76, '#fff', '#0f172a', `900 ${story ? 40 : 32}px ${FONT}`);
      ctx.fillStyle = '#fff'; ctx.font = `700 ${story ? 30 : 24}px ${FONT}`; ctx.globalAlpha = 0.85; ctx.textAlign = 'center';
      ctx.fillText(state.storeUrl.replace(/^https?:\/\//, ''), W / 2, fy + (story ? 140 : 102)); ctx.globalAlpha = 1;
      return cv;
    }

    function openArt(kind, offerData = null) {
      const ov = $('#dialogOverlay');
      const dlg = $('#dialog');
      let blob = null;
      const name = () => `${kind === 'offer' ? 'oferta' : 'vitrine'}-${(state.tenant.id || 'loja')}-${artFormat}.png`;
      dlg.innerHTML = `<h3 id="dlgTitle">🖼️ ${kind === 'offer' ? 'Arte da oferta' : 'Arte da vitrine'}</h3>
        <p>${kind === 'offer' ? 'Com a foto, o preço e as cores da sua loja.' : 'Com sua capa, logo, cores e produtos.'} Poste no Status, Stories ou no feed.</p>
        <div class="art-formats" role="group" aria-label="Formato">
          <button type="button" data-fmt="story" aria-pressed="${artFormat === 'story'}">📱 Status / Story</button>
          <button type="button" data-fmt="post" aria-pressed="${artFormat === 'post'}">⬛ Post quadrado</button>
        </div>
        <div class="art-preview" id="artPreview"><span class="spinner"></span></div>
        <div class="grid-2">
          <button type="button" class="btn btn-primary" data-art="share">📲 Compartilhar</button>
          <button type="button" class="btn btn-soft" data-art="download">⬇️ Baixar</button>
        </div>
        <button type="button" class="btn btn-ghost btn-block" data-art="close" style="margin-top:8px">Fechar</button>`;
      ov.classList.add('open');
      const draw = async () => {
        $('#artPreview').innerHTML = '<span class="spinner"></span>';
        blob = null;
        try {
          const cv = kind === 'offer' ? await drawOfferArt(artFormat, offerData) : await drawStoreArt(artFormat);
          blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
          const url = URL.createObjectURL(blob);
          $('#artPreview').innerHTML = `<img src="${url}" alt="Prévia da arte">`;
        } catch (err) {
          $('#artPreview').innerHTML = '<p style="color:var(--muted);font-size:13px">Não consegui montar a arte agora. Tente de novo.</p>';
        }
      };
      const close = () => { ov.classList.remove('open'); ov.onclick = null; };
      ov.onclick = async (e) => {
        if (e.target === ov) return close();
        const f = e.target.closest('[data-fmt]');
        if (f) {
          artFormat = f.dataset.fmt; ls.set('vitrine:art-format', artFormat);
          dlg.querySelectorAll('[data-fmt]').forEach((b) => b.setAttribute('aria-pressed', String(b === f)));
          return draw();
        }
        const b = e.target.closest('[data-art]');
        if (!b) return;
        if (b.dataset.art === 'close') return close();
        if (!blob) return toast('Aguarde a arte ficar pronta.');
        const file = new File([blob], name(), { type: 'image/png' });
        if (b.dataset.art === 'share' && navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: state.tenant.store_name }); } catch { /* cancelou */ }
          return;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name();
        document.body.appendChild(a); a.click(); a.remove();
        toast(b.dataset.art === 'share' ? 'Arte baixada. Agora é só postar 📲' : 'Arte baixada ✓');
      };
      draw();
    }

    /* ---------------- Compartilhar ---------------- */
    const DEFAULT_SHARE = 'Oi! 😊 Separei meus melhores achadinhos pra você na vitrine *{loja}*. É só clicar e escolher:\n{link}';

    function shareText() {
      const tpl = (state.settings && state.settings.share_message) || DEFAULT_SHARE;
      const msg = tpl.split('{loja}').join(state.tenant.store_name);
      return msg.includes('{link}') ? msg.split('{link}').join(state.storeUrl) : `${msg}\n${state.storeUrl}`;
    }

    function openShareMessage() {
      const ov = $('#dialogOverlay');
      const dlg = $('#dialog');
      dlg.innerHTML = `<h3 id="dlgTitle">💬 Mensagem pronta</h3>
        <p>Para quem te chamou no direct ou no WhatsApp. Edite como quiser antes de enviar.</p>
        <textarea class="msg-area" id="shareMsg" maxlength="600">${esc(shareText())}</textarea>
        <div class="grid-2">
          <button type="button" class="btn btn-soft" data-s="copy">${I.copy}Copiar</button>
          <a class="btn btn-wa" data-s="wa" target="_blank" rel="noopener noreferrer" href="#">${I.wa}WhatsApp</a>
        </div>
        <div class="grid-2">
          <button type="button" class="btn btn-ghost" data-s="close">Fechar</button>
          <button type="button" class="btn btn-ghost" data-s="save">⭐ Salvar padrão</button>
        </div>`;
      ov.classList.add('open');
      const area = $('#shareMsg');
      const wa = dlg.querySelector('[data-s="wa"]');
      const syncWa = () => { wa.href = waLink('', area.value); };
      syncWa();
      area.addEventListener('input', syncWa);
      const close = () => { ov.classList.remove('open'); ov.onclick = null; };
      ov.onclick = async (e) => {
        if (e.target === ov) return close();
        const b = e.target.closest('[data-s]');
        if (!b) return;
        const s = b.dataset.s;
        if (s === 'close') close();
        if (s === 'copy') copy(area.value, 'Mensagem copiada! É só colar no direct 💬');
        if (s === 'save') {
          const tpl = area.value.split(state.storeUrl).join('{link}').split(state.tenant.store_name).join('{loja}');
          try {
            const { settings } = await api('/api/me/settings', { method: 'PUT', body: { share_message: tpl } });
            state.settings = settings;
            toast('Mensagem salva como padrão ⭐');
          } catch (err) { handleError(err); }
        }
      };
      setTimeout(() => area.focus(), 80);
    }

    async function toggleFeatured(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      const on = !(p.sort_order < 0);
      try {
        await api(`/api/me/products/${id}/featured`, { method: 'PATCH', body: { featured: on ? 1 : 0 } });
        p.sort_order = on ? -1 : 0;
        state.products.sort((a, b) => a.sort_order - b.sort_order || b.id - a.id);
        toast(on ? '⭐ Em destaque no topo da vitrine' : 'Destaque removido');
        const y = window.scrollY; render(); window.scrollTo(0, y);
      } catch (err) { handleError(err); }
    }

    async function toggleVisible(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      const next = Number(p.is_visible) === 0 ? 1 : 0;

    /* ---------------- Imagens ---------------- */
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não consegui ler esta imagem.')); };
        img.src = url;
      });
    }

    async function compress(file, maxSide, quality) {
      const img = await loadImage(file);
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const webp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
      if (!webp) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); } // JPEG não tem transparência
      ctx.drawImage(img, 0, 0, w, h);
      const type = webp ? 'image/webp' : 'image/jpeg';
      const blob = await new Promise((r) => canvas.toBlob(r, type, quality));
      if (!blob) throw new Error('Falha ao processar a imagem.');
      return { blob, dataUrl: canvas.toDataURL(type, quality), type };
    }

    // Retorna a URL final da imagem: R2 quando disponível, senão data URL compacta (guardada no D1).
    async function processImage(file, { maxSide = 1200, cover = false } = {}) {
      if (!/^image\//.test(file.type)) throw new Error('Escolha um arquivo de imagem.');
      if (file.size > 15 * 1024 * 1024) throw new Error('Imagem muito grande (máx. 15 MB).');
      if (state.config.uploads) {
        const { blob, type } = await compress(file, maxSide, 0.82);
        try {
          const data = await api('/api/me/upload', { method: 'POST', raw: blob, contentType: type });
          return data.url;
        } catch (err) {
          if (err.code !== 'no_r2') throw err;
          state.config.uploads = false;
        }
      }
      // Capa precisa de mais largura (fica de fundo); as outras fotos ficam pequenas e leves.
      const tries = cover ? [[1400, 0.72], [1200, 0.66], [1000, 0.6], [800, 0.55]] : [[720, 0.78], [600, 0.7], [480, 0.62], [380, 0.55]];
      for (const [side, q] of tries) {
        const { dataUrl } = await compress(file, Math.min(side, maxSide), q);
        if (dataUrl.length < 440000) return dataUrl;
      }
      throw new Error('Não consegui reduzir esta imagem. Tente outra.');
    }
