<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#16a6e0">
  <title>Painel da Loja | Vitrine App</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316a6e0'/%3E%3Cpath d='M18 24h28l-3 22H21z' fill='white'/%3E%3Cpath d='M25 24a7 7 0 0 1 14 0' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <script src="/config.js"></script>
  <style>
    :root {
      --accent: #16a6e0;
      --accent-ink: #ffffff;
      --accent-2: #6d5dfc;
      --accent-soft: #e3f5fd;
      --accent-deep: #0b7fb3;
      --bg: #eef0f4;
      --card: #ffffff;
      --ink: #14161b;
      --ink-2: #3b4150;
      --muted: #8a90a0;
      --line: #e6e8ee;
      --field: #f5f6f8;
      --ok: #16a34a;
      --danger: #e11d48;
      --warn: #f59e0b;
      --wa: #25d366;
      --wa-deep: #128c4b;
      --radius-lg: 26px;
      --radius: 20px;
      --shadow: 0 1px 2px rgba(20, 22, 27, .04), 0 8px 24px rgba(20, 22, 27, .06);
      --shadow-lg: 0 20px 60px rgba(20, 22, 27, .18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.4; -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 12px; }
    [hidden] { display: none !important; }
    svg { flex-shrink: 0; }

    .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px calc(112px + var(--safe-bottom)); }
    @media (min-width: 720px) { .wrap { padding: 28px 24px calc(120px + var(--safe-bottom)); } }

    /* ---------- Componentes ---------- */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card + .card { margin-top: 14px; }
    .mode-pick { display: grid; gap: 8px; margin: 2px 0 14px; }
    .mode-pick label { display: block; cursor: pointer; }
    .mode-pick input { position: absolute; opacity: 0; pointer-events: none; }
    .mode-pick span { display: block; padding: 11px 14px; border-radius: 14px; border: 2px solid #e6e8ee; background: var(--card); }
    .mode-pick b { display: block; font-size: 14.5px; }
    .mode-pick small { color: #7d8494; font-size: 12.5px; }
    .mode-pick input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
    .mode-pick input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
    /* Desempenho (gráfico) */
    .perf { --neon: #39ff88; --neon-2: #00e676; --sky: #38bdf8; position: relative; overflow: hidden; border-radius: 22px; padding: 16px 16px 12px; margin: 0 0 14px; color: #e8eefc;
      background: radial-gradient(120% 90% at 100% 0%, rgba(56, 189, 248, .18), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(57, 255, 136, .14), transparent 60%), #0b1020;
      box-shadow: 0 14px 34px rgba(11, 16, 32, .28); }
    .perf-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .perf-head strong { font-size: 15px; letter-spacing: .01em; }
    .perf-head small { display: block; font-size: 11.5px; color: #8a96b3; font-weight: 600; }
    .perf-range { display: flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 3px; }
    .perf-range button { border: 0; background: none; color: #9aa6c3; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
    .perf-range button[aria-pressed="true"] { background: var(--neon); color: #05140b; box-shadow: 0 0 14px rgba(57,255,136,.55); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .kpi { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 9px 7px 8px; min-width: 0; }
    .kpi span { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #9aa6c3; white-space: nowrap; }
    .kpi span i { width: 6px; height: 6px; border-radius: 2px; flex-shrink: 0; }
    .kpi b { display: block; font-size: 20px; font-weight: 900; margin-top: 3px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi em { font-style: normal; font-size: 10.5px; font-weight: 800; }
    .kpi em.up { color: var(--neon); } .kpi em.down { color: #fb7185; } .kpi em.flat { color: #8a96b3; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-wrap .bar { transition: opacity .2s; cursor: pointer; }
    .chart-legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; font-weight: 700; color: #9aa6c3; margin-top: 4px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart-legend i { width: 10px; height: 10px; border-radius: 3px; }
    .chart-tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: #fff; color: #0b1020; font-size: 11.5px; font-weight: 700; padding: 6px 9px; border-radius: 10px; white-space: nowrap; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
    .chart-tip b { color: #059669; } .chart-tip u { text-decoration: none; color: #0284c7; }
    .perf-empty { position: absolute; inset: 22% 8% auto; text-align: center; font-size: 12.5px; font-weight: 700; color: #c7d2ee; background: rgba(11,16,32,.75); border-radius: 12px; padding: 8px 10px; }
    .perf-skel { height: 230px; border-radius: 14px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.09), rgba(255,255,255,.04)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (max-width: 380px) { .kpi b { font-size: 17px; } .kpis { gap: 6px; } .kpi span { font-size: 10.5px; } .kpi span i { display: none; } }
    /* Mini resumo em Minhas lojas */
    .mini-perf { display: flex; align-items: flex-end; gap: 3px; height: 30px; padding: 0 2px; }
    .mini-perf i { width: 6px; border-radius: 2px 2px 1px 1px; background: linear-gradient(180deg, #39ff88, #00c853); box-shadow: 0 0 6px rgba(57,255,136,.45); min-height: 3px; }
    .mini-perf i.zero { background: #e5e7eb; box-shadow: none; }
    .store-pick .wk { display: block; font-size: 11.5px; font-weight: 700; color: #059669; margin-top: 1px; }
    .store-pick .wk u { text-decoration: none; color: #0284c7; }
    /* Editor da capa */
    .crop-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #111; touch-action: none; cursor: grab; user-select: none; }
    .crop-frame:active { cursor: grabbing; }
    .crop-frame img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; pointer-events: none; }
    .crop-frame::after { content: ""; position: absolute; inset: 0; border: 2px solid rgba(255,255,255,.85); border-radius: 16px; pointer-events: none; box-shadow: inset 0 -60px 60px -30px rgba(0,0,0,.45); }
    .crop-hint { font-size: 12.5px; color: var(--muted); text-align: center; margin: 8px 0 4px; }
    .crop-zoom { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; font-size: 18px; }
    .crop-zoom input { flex: 1; accent-color: var(--accent); }
    /* Aviso do teste recolhido */
    .trial-mini { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 16px; background: #fff7e6; border: 1px solid #f6d58f; color: #6b4e00; font-size: 13.5px; font-weight: 700; margin-top: 14px; }
    .trial-mini span { flex: 1; }
    .trial-mini .btn { margin: 0; }
    .plan { position: relative; }
    .plan .plan-x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.06); color: inherit; font-size: 16px; font-weight: 800; cursor: pointer; display: grid; place-items: center; }
    /* Pagamento */
    .pay-plans { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 4px 0 12px; max-height: 46vh; overflow: auto; }
    .pay-plans .pp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .pay-plans .pp-price { font-size: 17px; font-weight: 900; color: var(--ink); white-space: nowrap; }
    .pay-plans .pp-price small { font-size: 11px; font-weight: 700; }
    .pay-plans ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2, #3b4150); }
    .pay-plans li::before { content: "✓ "; color: #16a34a; font-weight: 800; }
    .pay-plans li.soon::before { content: "✦ "; color: var(--accent); }
    .pay-plans .tag { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #fff1c7; color: #8a5a00; margin-left: 6px; vertical-align: middle; }
    .pay-plans label { cursor: pointer; }
    .pay-plans input { position: absolute; opacity: 0; pointer-events: none; }
    .pay-plans label > span { display: block; padding: 12px; border-radius: 14px; border: 2px solid var(--line, #e6e8ee); text-align: left; }
    .pay-plans b { display: block; font-size: 15px; }
    .pay-plans small { color: var(--muted); font-size: 12px; }
    .pay-plans input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
    .pix-box { text-align: center; }
    .pix-box img { width: 220px; height: 220px; border-radius: 14px; border: 1px solid var(--line, #e6e8ee); margin: 6px auto 10px; display: block; background: #fff; }
    .pix-code { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; background: #f5f6f8; border-radius: 12px; padding: 10px; max-height: 76px; overflow: auto; text-align: left; margin-bottom: 10px; }
    .pay-wait { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .pay-ok { text-align: center; padding: 10px 0; }
    .pay-ok .big { font-size: 46px; }
    /* Minhas lojas */
    .stores-head { display: flex; align-items: center; gap: 12px; margin: 6px 2px 14px; }
    .stores-head h1 { margin: 0; font-size: 22px; }
    .stores-head p { margin: 2px 0 0; color: var(--muted, #6b7280); font-size: 13.5px; }
    .stores-head .btn { margin-left: auto; }
    .store-pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid transparent; background: var(--card, #fff); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit; }
    .store-pick + .store-pick { margin-top: 10px; }
    .store-pick:hover { border-color: var(--accent); }
    .store-pick .sav { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex-shrink: 0; overflow: hidden; }
    .store-pick .sav img { width: 100%; height: 100%; object-fit: cover; }
    .store-pick .sinfo { flex: 1; min-width: 0; }
    .store-pick .sinfo strong { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .store-pick .sinfo small { color: var(--muted, #6b7280); font-size: 12.5px; }
    .store-pick .go { font-weight: 800; color: var(--accent-deep); font-size: 13px; white-space: nowrap; }
    .store-new { margin-top: 12px; width: 100%; border: 2px dashed color-mix(in srgb, var(--accent) 45%, #d1d5db); background: transparent; border-radius: 18px; padding: 16px; font: inherit; font-weight: 800; color: var(--accent-deep); cursor: pointer; }
    .upsell { margin-top: 14px; border-radius: 18px; padding: 16px; background: linear-gradient(135deg, #fff7e6, #fff); border: 1px solid #f6d58f; }
    .upsell strong { display: block; margin-bottom: 4px; }
    .upsell p { margin: 0 0 10px; font-size: 13.5px; color: #6b5a2e; }
    .back-stores { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--accent-soft); color: var(--accent-deep); font: inherit; font-weight: 800; font-size: 12.5px; border-radius: 999px; padding: 6px 12px 6px 8px; margin: 0 0 10px; cursor: pointer; }
    .plan-tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); vertical-align: middle; }
    .plan-tag.gold { background: #fff1c7; color: #8a5a00; }
    .models button.locked { opacity: .6; }
    .tpl-edit { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tpl-help { font-size: 12px; color: var(--muted, #6b7280); margin: 6px 0 0; line-height: 1.5; }
    .tpl-help code { background: #f1f5f9; padding: 1px 5px; border-radius: 6px; }
    .tone-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tone-prev { display: block; height: 46px; border-radius: 12px; margin-bottom: 6px; border: 1px solid #e5e7eb; }
    .card h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
    .card .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .btn {
      height: 48px; padding: 0 18px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-weight: 700; font-size: 14px; white-space: nowrap;
      transition: transform .12s ease, filter .15s;
    }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
    .btn-soft { background: var(--accent-soft); color: var(--accent-deep); }
    .btn-ghost { background: var(--field); color: var(--ink-2); }
    .btn-danger { background: color-mix(in srgb, var(--danger) 10%, #fff); color: var(--danger); }
    .btn-wa { background: var(--wa-deep); color: #fff; }
    .btn-block { width: 100%; }
    .btn-sm { height: 38px; padding: 0 12px; border-radius: 11px; font-size: 13px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--field); color: var(--ink-2); }
    .icon-btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, #fff); }

    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field > span, .field-label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
    .field small, .hint { font-size: 12px; color: var(--muted); font-weight: 500; }
    .input, .textarea {
      width: 100%; border: 1.5px solid transparent; background: var(--field);
      border-radius: 14px; padding: 0 14px; height: 50px; font-size: 15px; outline: none;
      transition: border-color .15s, background .15s;
    }
    .textarea { height: auto; min-height: 96px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
    .input:focus, .textarea:focus { border-color: var(--accent); background: #fff; }
    .input-group { display: flex; align-items: center; background: var(--field); border-radius: 14px; border: 1.5px solid transparent; }
    .input-group:focus-within { border-color: var(--accent); background: #fff; }
    .input-group .prefix { padding-left: 14px; color: var(--muted); font-size: 14px; white-space: nowrap; }
    .input-group .input { background: transparent; border: 0; padding-left: 4px; }
    .row { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 560px) { .row.two { grid-template-columns: 1fr 1fr; } }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .seg.two { grid-template-columns: repeat(2, 1fr); }
    .seg label { position: relative; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg .opt {
      display: grid; justify-items: center; gap: 6px; text-align: center;
      padding: 12px 6px; border-radius: 14px; background: var(--field);
      font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer;
      border: 1.5px solid transparent; transition: all .15s;
    }
    .seg .opt .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; box-shadow: 0 3px 8px rgba(0, 0, 0, .12); }
    .seg input:checked + .opt { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
    .seg input:focus-visible + .opt { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
    .switch-row:first-of-type { border-top: 0; padding-top: 4px; }
    .switch-row strong { display: block; font-size: 14px; }
    .switch-row small { color: var(--muted); font-size: 12px; }
    .switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switch .track { position: absolute; inset: 0; border-radius: 99px; background: #d5d9e1; transition: background .2s; }
    .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); transition: transform .2s; }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(20px); }
    .switch input:focus-visible + .track { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; padding: 3px 7px; border-radius: 7px; }
    .badge.ml { color: #2d3277; background: #fff159; }
    .badge.shopee { color: #fff; background: #ee4d2d; }
    .badge.proprio { color: var(--accent-ink); background: var(--accent); }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; }
    .pill.trial { background: #fff4db; color: #92600a; }
    .pill.active { background: #dcfce7; color: #166534; }
    .pill.expired { background: #ffe4e6; color: #9f1239; }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    /* ---------- Login ---------- */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login-card { width: 100%; max-width: 420px; background: var(--card); border-radius: 30px; box-shadow: var(--shadow-lg); padding: 30px 24px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand-logo { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .brand p { margin: 0; color: var(--muted); font-size: 13px; }
    .help-box { display: grid; gap: 6px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; border-radius: 14px; padding: 12px; font-size: 13px; margin-bottom: 14px; }
    .help-box .btn { margin-top: 4px; }
    .error-box { background: #fff1f2; color: #9f1239; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    .login-foot { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
    .login-foot a { color: var(--accent-deep); font-weight: 700; }

    /* ---------- Cabeçalho do painel ---------- */
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .top .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); color: var(--accent-deep); display: grid; place-items: center; font-weight: 800; font-size: 18px; box-shadow: 0 0 0 3px #fff, var(--shadow); flex-shrink: 0; overflow: hidden; }
    .top .who { flex: 1; min-width: 0; }
    .top .who small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .top .who strong { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }

    .share { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 32%, transparent); }
    .share-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .share-head strong { font-size: 16px; letter-spacing: -.01em; }
    .share-head a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .2); padding: 7px 10px; border-radius: 10px; }

      clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

      out: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>',
    };

    const state = {
      token: null,
      config: { plan_price: '19,90', trial_days: 7, support_whatsapp: '', uploads: false },
      tenant: null,
      account: null,
      stores: [],
      storeId: null,

      settings: null,
      products: [],
      storeUrl: '',
      tab: 'products',
      editing: null,   // produto em edição (null = novo)
      query: '',

    const $ = (s, r = document) => r.querySelector(s);

    /* ---------------- Utilidades ---------------- */
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const brl = (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
    const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const safeImg = (u) => { const s = String(u || ''); return /^https?:\/\//i.test(s) || /^data:image\/(png|jpe?g|webp);base64,/i.test(s) ? s : ''; };
    const waLink = (phone, text) => `https://api.whatsapp.com/send?${phone ? `phone=${encodeURIComponent(phone)}&` : ''}text=${encodeURIComponent(text)}`;
    const fmtPhone = (d) => {
      const s = String(d || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
      if (s.length === 11) return `(${s.slice(0, 2)}) ${s.slice(2, 7)}-${s.slice(7)}`;
      if (s.length === 10) return `(${s.slice(0, 2)}) ${s.slice(2, 6)}-${s.slice(6)}`;
      return s;
    };
    const priceInput = (v) => (v === null || v === undefined || v === '' ? '' : Number(v).toFixed(2).replace('.', ','));
    const isExpired = () => (state.view !== 'stores' && state.tenant && state.tenant.paused) || (state.account ? state.account.status === 'expired' : !!(state.tenant && state.tenant.status === 'expired'));
    const plan = () => (state.account && state.account.plan_info) || { id: 'basic', name: 'Básico', stores: 1, templates: [1], custom_templates: false, lookups: 15, trial: false };
    const STORE_KEY = 'vitrine:store';
    const priceOf = (id) => (id === 'complete' ? state.config.plan_price_complete || '29,90' : state.config.plan_price || '19,90');
    const ls = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem storage */ } },
      del(k) { try { localStorage.removeItem(k); } catch { /* sem storage */ } },
    };

    let toastTimer;
    function toast(msg, isError = false) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.toggle('err', isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), isError ? 4200 : 2600);
    }

    function applyTheme(hex) {
      const color = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#16a6e0';
      const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
      document.documentElement.style.setProperty('--accent', color);
      document.documentElement.style.setProperty('--accent-ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.68 ? '#14161b' : '#ffffff');
      $('meta[name="theme-color"]').setAttribute('content', color);
    }

    function setBusy(btn, busy, label) {
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.innerHTML;
        btn.innerHTML = `<span class="spinner"></span>${label || 'Salvando...'}`;
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.label || btn.innerHTML;
        btn.disabled = false;
      }
    }

    async function api(path, { method = 'GET', body, raw, contentType } = {}) {
      const headers = { Accept: 'application/json' };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (state.storeId) headers['X-Store'] = state.storeId;
      const opts = { method, headers };
      if (raw) { opts.body = raw; headers['Content-Type'] = contentType; }
      else if (body !== undefined) { opts.body = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
      let res;
      try { res = await fetch(API + path, opts); }
      catch { throw Object.assign(new Error('Sem conexão. Verifique sua internet.'), { status: 0 }); }
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 && path !== '/api/auth/login') {
        logout();
        throw Object.assign(new Error(data.error || 'Sessão expirada.'), { status: 401 });
      }
      if (!res.ok) throw Object.assign(new Error(data.error || 'Algo deu errado.'), { status: res.status, code: data.code });
      return data;
    }

    function handleError(err) {
      if (err.status === 402) {
        if (state.tenant) state.tenant.status = 'expired';
        if (state.account) state.account.status = 'expired';
        render();
      }
      toast(err.message || 'Algo deu errado.', true);
    }

    function confirmDialog({ title, text, ok = 'Confirmar', danger = false }) {
      return new Promise((resolve) => {
        const ov = $('#dialogOverlay');
        const dlg = $('#dialog');
        dlg.innerHTML = `<h3 id="dlgTitle">${esc(title)}</h3><p>${esc(text)}</p>
          <div class="acts"><button type="button" class="btn btn-ghost" data-r="0">Cancelar</button>
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${esc(ok)}</button></div>`;
        ov.classList.add('open');
        const done = (v) => { ov.classList.remove('open'); ov.onclick = null; document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = (e) => { if (e.key === 'Escape') done(false); };
        document.addEventListener('keydown', onKey);
        ov.onclick = (e) => {
          const b = e.target.closest('[data-r]');
          if (b) done(b.dataset.r === '1');
          else if (e.target === ov) done(false);
        };
        dlg.querySelector('[data-r="1"]').focus();
      });
    }

    async function copy(text, msg = 'Link copiado!') {
      try { await navigator.clipboard.writeText(text); toast(msg); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast(msg); } catch { toast('Não foi possível copiar', true); }
        ta.remove();
      }
    }

    // Categorias já usadas pelo lojista (mais usadas primeiro).
    function categories() {
      const count = new Map();
      for (const p of state.products) {
        const c = String(p.category || '').trim();
        if (c) count.set(c, (count.get(c) || 0) + 1);
      }
      return [...count.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR')).map(([c]) => c);
    }

    // Esconde a barra de baixo enquanto o teclado está aberto, para não cobrir os campos.
    document.addEventListener('focusin', (e) => {
      if (e.target.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea')) document.body.classList.add('typing');
    });
    document.addEventListener('focusout', () => {
      setTimeout(() => {
        const a = document.activeElement;
        if (!a || !a.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea')) document.body.classList.remove('typing');
      }, 120);
    });

    /* ---------------- Mensagens de oferta (3 modelos) ---------------- */
    const OFFER_MODELS = [
      { id: 1, name: '🔥 Destaque do dia' },
      { id: 2, name: '✨ Achadinho' },
      { id: 3, name: '⚡ Relâmpago' },
    ];

    const parseMoney = (v) => {
      if (v === null || v === undefined || v === '') return null;
      if (typeof v === 'number') return v > 0 ? v : null;
      const n = Number(String(v).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(?:\D|$))/g, '').replace(',', '.'));
      return Number.isFinite(n) && n > 0 ? n : null;
    };

    // Modelos editáveis (plano Completo): {titulo} {de} {por} {desconto} {link}
    const TEMPLATE_DEFAULTS = {
      1: '🔥 DESTAQUE DO DIA 🔥\n\n🎯{titulo}\n\n❌ De ~{de}~\n✅ Por {por}\n🏷️ {desconto}% OFF\n\n🛒 COMPRE AQUI:\n{link}\n\n⏳ Oferta sujeita à disponibilidade de estoque.',
      2: '✨ ACHADINHO DO DIA ✨\n\n🛍️ *{titulo}*\n\n💸 De ~{de}~ por apenas *{por}*\n🏷️ Economize {desconto}%\n\n👉 Garanta o seu aqui:\n{link}\n\n⚠️ Preço e estoque podem mudar a qualquer momento.',
      3: '⚡ OFERTA RELÂMPAGO ⚡\n\n📦 {titulo}\n\n🔻 {desconto}% OFF\n💰 Só {por}\n\n🔗 Aproveite:\n{link}\n\n⏰ Corre que pode acabar a qualquer momento!',
    };
    function customTemplates() {
      try { return JSON.parse((state.settings && state.settings.offer_templates) || '{}') || {}; } catch { return {}; }
    }
    function fillTemplate(tpl, data) {
      const price = parseMoney(data.price);
      let original = parseMoney(data.original);
      if (!(price && original && original > price)) original = null;
      const vals = {
        titulo: String(data.title || '').trim() || 'Produto em oferta',
        de: original ? brl(original) : '',
        por: price ? brl(price) : '',
        desconto: original ? String(Math.round((1 - price / original) * 100)) : '',
        link: String(data.link || '').trim(),
      };
      const out = [];
      for (const line of String(tpl).split('\n')) {
        const keys = [...line.matchAll(/\{(titulo|de|por|desconto|link)\}/g)].map((m) => m[1]);
        // Linha com valor que falta: some (ex.: sem preço antigo, some o "De").
        if (keys.some((k) => !vals[k])) {
          if (keys.includes('por') && !vals.por && !keys.includes('de')) out.push('Confira o preço no link');
          else if (keys.includes('por') && !vals.por) out.push('Confira o preço no link');
          continue;
        }
        out.push(line.replace(/\{(titulo|de|por|desconto|link)\}/g, (_, k) => vals[k]));
      }
      return out.filter((l, i, a) => !(l === '' && (i === 0 || a[i - 1] === ''))).join('\n').replace(/\n{3,}/g, '\n\n').replace(/\n+$/, '');
    }

    function offerText(model, data) {
      const custom = plan().custom_templates ? customTemplates()[model] : null;
      if (custom) return fillTemplate(custom, data);
      const title = String(data.title || '').trim() || 'Produto em oferta';
      const price = parseMoney(data.price);
      let original = parseMoney(data.original);
      if (!(price && original && original > price)) original = null;
      const off = original ? Math.round((1 - price / original) * 100) : null;
      const link = String(data.link || '').trim();
      let lines;
      if (model === 2) {
        lines = ['✨ ACHADINHO DO DIA ✨', '', `🛍️ *${title}*`, '',
          price ? (original ? `💸 De ~${brl(original)}~ por apenas *${brl(price)}*` : `💸 Por apenas *${brl(price)}*`) : '💸 Preço especial no link',
          off ? `🏷️ Economize ${off}%` : '', '', '👉 Garanta o seu aqui:', link, '', '⚠️ Preço e estoque podem mudar a qualquer momento.'];
      } else if (model === 3) {
        lines = ['⚡ OFERTA RELÂMPAGO ⚡', '', `📦 ${title}`, '',
          off ? `🔻 ${off}% OFF` : '',
          price ? `💰 Só ${brl(price)}${original ? ` (era ${brl(original)})` : ''}` : '💰 Confira o preço no link',
          '', '🔗 Aproveite:', link, '', '⏰ Corre que pode acabar a qualquer momento!'];
      } else {
        lines = ['🔥 DESTAQUE DO DIA 🔥', '', `🎯${title}`, '',
          original ? `❌ De ~${brl(original)}~` : '',
          price ? `✅ Por ${brl(price)}` : '✅ Confira o preço no link',
          off ? `🏷️ ${off}% OFF` : '', '', '🛒 COMPRE AQUI:', link, '', '⏳ Oferta sujeita à disponibilidade de estoque.'];
      }
      return lines.filter((l, i, a) => !(l === '' && (i === 0 || a[i - 1] === '')))
        .join('\n').replace(/\n{3,}/g, '\n\n').replace(/\n+$/, '');

      return `<button type="button" data-model="${m.id}" class="${locked ? 'locked' : ''}" aria-pressed="${m.id === currentModel()}">${locked ? '🔒 ' : ''}${esc(m.name)}</button>`;

    /* ---------------- Assinatura: Pix ou cartão (Mercado Pago) ---------------- */

    function openPay(planId) {
      stopPayPoll();
      const ov = $('#dialogOverlay');
      const dlg = $('#dialog');
      const chosen = planId || ((state.account && state.account.plan) || 'complete');
      const email = ls.get('vitrine:email') || '';
      dlg.innerHTML = `<h3 id="dlgTitle">💳 Planos do Vitrine App</h3>
        <p>30 dias de acesso. Ativa na hora que o pagamento é aprovado.</p>
        <div class="pay-plans">
          ${['basic', 'complete'].map((id) => `<label><input type="radio" name="payPlan" value="${id}" ${id === chosen ? 'checked' : ''}><span>
            <div class="pp-head"><b>${id === 'complete' ? '⭐ Completo' : 'Básico'}${id === 'complete' ? '<span class="tag">Mais escolhido</span>' : ''}</b><span class="pp-price">R$ ${esc(priceOf(id))}<small>/mês</small></span></div>
            <ul>${PLAN_FEATURES[id].map(([txt, soon]) => `<li class="${soon ? 'soon' : ''}">${esc(txt)}${soon ? ' <small>(em breve)</small>' : ''}</li>`).join('')}</ul>
          </span></label>`).join('')}
        </div>
        <label class="field"><span>Seu e-mail <small>o comprovante chega nele</small></span><input class="input" id="payEmail" type="email" inputmode="email" autocomplete="email" value="${esc(email)}" placeholder="voce@email.com"></label>
        <div class="grid-2">
          <button type="button" class="btn btn-primary" data-p="pix">⚡ Pagar com Pix</button>
          <button type="button" class="btn btn-soft" data-p="card">💳 Cartão</button>
        </div>
        <button type="button" class="btn btn-ghost btn-block" data-p="close" style="margin-top:8px">Agora não</button>`;
      ov.classList.add('open');
      const close = () => { stopPayPoll(); ov.classList.remove('open'); ov.onclick = null; };
      ov.onclick = async (e) => {
        if (e.target === ov) return close();
        const b = e.target.closest('[data-p]');
        if (!b) return;
        if (b.dataset.p === 'close') return close();
        if (b.dataset.p === 'copy') return copy(b.dataset.code, 'Código Pix copiado! Cole no app do seu banco 💸');
        const plan = (dlg.querySelector('[name="payPlan"]:checked') || {}).value || 'basic';
        const mail = ($('#payEmail') || {}).value ? $('#payEmail').value.trim() : '';
        if (b.dataset.p === 'pix' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) { toast('Informe seu e-mail para gerar o Pix.', true); return $('#payEmail').focus(); }
        if (mail) ls.set('vitrine:email', mail);
        setBusy(b, true, b.dataset.p === 'pix' ? 'Gerando Pix...' : 'Abrindo...');
        try {
          const data = await api('/api/me/pay', { method: 'POST', body: { plan, method: b.dataset.p, email: mail } });
          if (b.dataset.p === 'card') { location.href = data.checkout_url; return; }
          showPix(data);
        } catch (err) { toast(err.message, true); setBusy(b, false); }
      };
    }

    function showPix(data) {
      const dlg = $('#dialog');
      const { pix, payment } = data;
      dlg.innerHTML = `<h3 id="dlgTitle">⚡ Pague com Pix</h3>
        <p>Plano ${payment.plan === 'complete' ? 'Completo' : 'Básico'} · <b>${brl(payment.amount)}</b>. Abra o app do seu banco e escaneie o QR Code ou use o copia e cola.</p>
        <div class="pix-box">
          ${pix.qr_code_base64 ? `<img src="data:image/png;base64,${esc(pix.qr_code_base64)}" alt="QR Code do Pix">` : ''}

          <div class="pay-wait"><span class="spinner" style="border-color:currentColor;border-right-color:transparent"></span>Aguardando o pagamento... (vale por ${pix.expires_in_min} min)</div>
        </div>
        <button type="button" class="btn btn-ghost btn-block" data-p="close">Fechar (o pagamento continua valendo)</button>`;
      watchPayment(payment.id);
    }

    function watchPayment(id) {
      stopPayPoll();
      let tries = 0;
      const check = async () => {
        tries++;
        if (tries > 400) return stopPayPoll();
        try {
          const data = await api(`/api/me/pay/${id}`);
          if (data.payment.approved) { stopPayPoll(); paymentApproved(data); }
        } catch { /* tenta de novo */ }
      };
      payPoll = setInterval(check, 4000);
      check();
    }

    function paymentApproved(data) {
      state.account = data.account;
      const p = data.account.plan_info;
      const ov = $('#dialogOverlay');
      const dlg = $('#dialog');
      dlg.innerHTML = `<div class="pay-ok"><div class="big">🎉</div><h3 id="dlgTitle">Pacote ativado!</h3>
        <p>Plano <b>${esc(p.name)}</b> ativo até <b>${fmtDate(data.account.paid_until)}</b>. Obrigado por assinar o Vitrine App!</p></div>
        <button type="button" class="btn btn-primary btn-block" data-p="close">Continuar</button>`;
      ov.classList.add('open');
      ov.onclick = (e) => {
        if (e.target === ov || e.target.closest('[data-p="close"]')) {
          ov.classList.remove('open'); ov.onclick = null;
          (state.view === 'stores' ? showStores() : loadMe().then(render)).catch(() => {});

    function upgradeDialog(feature) {

        </div>`;

      if (payBtn) payBtn.onclick = () => openPay('complete');

    function openTemplateEditor() {
      const id = currentModel();
      const current = customTemplates()[id] || TEMPLATE_DEFAULTS[id];
      const name = (OFFER_MODELS.find((m) => m.id === id) || {}).name || '';
      const dlg = $('#dialog');
      dlg.innerHTML = `<h3 id="dlgTitle">✏️ Editar modelo ${esc(name)}</h3>
        <textarea class="msg-area" id="tplText" style="min-height:240px">${esc(current)}</textarea>
        <p class="tpl-help">Use: <code>{titulo}</code> <code>{de}</code> <code>{por}</code> <code>{desconto}</code> <code>{link}</code>. Linha com valor que não existe (ex.: sem preço antigo) some sozinha.</p>

    /* ---------------- Imagens ---------------- */
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não consegui ler esta imagem.')); };
        img.src = url;
      });
    }

    async function compress(file, maxSide, quality) {
      const img = await loadImage(file);
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const webp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
      if (!webp) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); } // JPEG não tem transparência
      ctx.drawImage(img, 0, 0, w, h);
      const type = webp ? 'image/webp' : 'image/jpeg';
      const blob = await new Promise((r) => canvas.toBlob(r, type, quality));
      if (!blob) throw new Error('Falha ao processar a imagem.');
      return { blob, dataUrl: canvas.toDataURL(type, quality), type };
    }

    // Retorna a URL final da imagem: R2 quando disponível, senão data URL compacta (guardada no D1).
    async function processImage(file, { maxSide = 1200, cover = false } = {}) {
      if (!/^image\//.test(file.type)) throw new Error('Escolha um arquivo de imagem.');
      if (file.size > 15 * 1024 * 1024) throw new Error('Imagem muito grande (máx. 15 MB).');
      if (state.config.uploads) {
        const { blob, type } = await compress(file, maxSide, 0.82);
        try {
          const data = await api('/api/me/upload', { method: 'POST', raw: blob, contentType: type });
          return data.url;
        } catch (err) {
          if (err.code !== 'no_r2') throw err;
          state.config.uploads = false;
        }
      }
      // Capa precisa de mais largura (fica de fundo); as outras fotos ficam pequenas e leves.
      const tries = cover ? [[1400, 0.72], [1200, 0.66], [1000, 0.6], [800, 0.55]] : [[720, 0.78], [600, 0.7], [480, 0.62], [380, 0.55]];
      for (const [side, q] of tries) {
        const { dataUrl } = await compress(file, Math.min(side, maxSide), q);
        if (dataUrl.length < 440000) return dataUrl;
      }
      throw new Error('Não consegui reduzir esta imagem. Tente outra.');
    }

    /* ---------------- Renderização ---------------- */
    function planBanner() {
      const a = state.account || state.tenant;
      if (state.view !== 'stores' && state.tenant && state.tenant.paused && a.status !== 'expired') {
        return `<div class="plan expired"><div class="plan-icon">${I.lock}</div><div class="plan-body">
          <strong>⏸ Esta loja está pausada</strong>
          Seu plano ${esc(plan().name)} permite ${plan().stores} ${plan().stores === 1 ? 'loja' : 'lojas'}. Os produtos continuam salvos; mude para o Completo para reativá-la.
          <br><button type="button" class="btn btn-sm btn-primary" style="margin-top:10px" data-act="upgrade">⭐ Quero o Completo</button></div></div>`;
      }
      const p = plan();
      const contracted = (state.account && state.account.plan) || 'basic';
      const price = esc(priceOf(contracted));
      const payBtns = `<div class="pay-row">
            <button type="button" class="btn btn-sm btn-primary" data-act="pay" data-plan="complete">⭐ Completo R$ ${esc(priceOf('complete'))}</button>
            <button type="button" class="btn btn-sm btn-ghost" data-act="pay" data-plan="basic">Básico R$ ${esc(priceOf('basic'))}</button></div>`;
      if (a.status === 'trial') {
        const total = Number(state.config.trial_days) || 7;
        const left = a.trial_days_left;
        const lastDay = left <= 1;
        const leftTxt = left <= 0 ? 'último dia' : left === 1 ? 'último dia' : `${left} dias restantes`;
        const plansBtn = `<button type="button" class="btn btn-sm btn-primary" data-act="plans">Ver planos</button>`;
        // Fechado pela pessoa: fica recolhido por 24 h (no último dia não dá para fechar).
        const closedAt = Number(ls.get(`vitrine:trial-hide:${a.id || ''}`) || 0);
        if (!lastDay && closedAt && Date.now() - closedAt < 24 * 3_600_000) {
          return `<div class="trial-mini"><span>🎁 Teste grátis · ${leftTxt}</span>${plansBtn}</div>`;
        }
        const pct = Math.max(4, Math.min(100, Math.round((left / total) * 100)));
        return `<div class="plan trial">${lastDay ? '' : '<button type="button" class="plan-x" data-act="trial-hide" aria-label="Fechar aviso">✕</button>'}
          <div class="plan-icon">${I.clock}</div><div class="plan-body">
          <strong>🎁 Você está no teste grátis · ${leftTxt}</strong>
          ${lastDay
            ? `Hoje é o último dia com tudo do plano <b>Completo</b> liberado. Escolha seu plano para sua vitrine continuar no ar sem parar.`
            : `Está tudo liberado do plano <b>Completo</b> (até 3 lojas, 3 modelos editáveis, 30 buscas/h) até ${fmtDate(a.trial_ends_at)}. Depois, escolha seu plano.`}
          <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
          <div class="pay-row">${lastDay ? plansBtn.replace('Ver planos', 'Conhecer os planos') : plansBtn}</div></div></div>`;
      }
      if (a.status === 'active') {
        return `<div class="plan active"><div class="plan-icon">${I.check}</div><div class="plan-body">
          <strong>Plano ${esc(p.name)} ativo · R$ ${price}/mês</strong>
          ${a.paid_until ? `Válido até ${fmtDate(a.paid_until)} (${a.paid_days_left} ${a.paid_days_left === 1 ? 'dia' : 'dias'}).` : 'Sua vitrine está no ar.'}
          ${a.paid_days_left !== null && a.paid_days_left <= 7 ? `<div class="pay-row"><button type="button" class="btn btn-sm btn-primary" data-act="pay" data-plan="${esc(contracted)}">🔄 Renovar agora</button></div>` : ''}</div></div>`;
      }
      return `<div class="plan expired"><div class="plan-icon">${I.lock}</div><div class="plan-body">
        <strong>Seu acesso terminou</strong>
        Suas vitrines estão fora do ar e a edição foi pausada. Assine para reativar tudo na hora — seus produtos continuam salvos.
        ${payBtns || '<br>Fale com o administrador da Vitrine para assinar.'}</div></div>`;
    }


    /* ---------------- Desempenho: gráfico da loja ---------------- */
    // Barras = visitas (verde neon); linha = cliques em comprar/adicionar (azul).
    state.perfDays = Number(ls.get('vitrine:perf-days')) === 30 ? 30 : 7;
    const fmtDay = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
    const nfmt = (n) => Number(n || 0).toLocaleString('pt-BR');
    function trend(now, before) {
      if (!before && !now) return '<em class="flat">—</em>';
      if (!before) return '<em class="up">novo</em>';
      const pct = Math.round(((now - before) / before) * 100);
      if (pct === 0) return '<em class="flat">= 0%</em>';
      return `<em class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</em>`;
    }

    function perfCard() {
      return `<section class="perf" aria-label="Desempenho da loja" id="perfCard">${perfInner()}</section>`;
    }

    function perfInner() {
      const st = state.stats && state.stats.store === state.tenant.id && state.stats.days === state.perfDays ? state.stats.data : null;
      const head = `<div class="perf-head"><div><strong>📊 Desempenho</strong><small>últimos ${state.perfDays} dias</small></div>
        <div class="perf-range" role="group" aria-label="Período">
          <button type="button" data-perf="7" aria-pressed="${state.perfDays === 7}">7 dias</button>
          <button type="button" data-perf="30" aria-pressed="${state.perfDays === 30}">30 dias</button></div></div>`;
      if (!st) return `${head}<div class="perf-skel"></div>`;
      const t = st.totals, b = st.previous;
      const kpis = `<div class="kpis">
        <div class="kpi"><span><i style="background:#39ff88"></i>Visitas</span><b>${nfmt(t.views)}</b>${trend(t.views, b.views)}</div>
        <div class="kpi"><span><i style="background:#38bdf8"></i>Cliques</span><b>${nfmt(t.clicks)}</b>${trend(t.clicks, b.clicks)}</div>
        <div class="kpi"><span><i style="background:#25d366"></i>Pedidos</span><b>${nfmt(t.orders)}</b>${trend(t.orders, b.orders)}</div>
        <div class="kpi"><span><i style="background:#a78bfa"></i>Produtos</span><b>${nfmt(st.products.visible)}</b><em class="flat">de ${nfmt(st.products.total)}</em></div>
      </div>`;
      return `${head}${kpis}<div class="chart-wrap" id="chartWrap">${chartSvg(st.series)}
        ${t.views + t.clicks === 0 ? '<div class="perf-empty">Ainda sem visitas neste período.<br>Compartilhe seu link para começar 🚀</div>' : ''}</div>
        <div class="chart-legend"><span><i style="background:#39ff88"></i>Visitas</span><span><i style="background:#38bdf8;border-radius:50%"></i>Cliques</span></div>`;
    }

    function chartSvg(series) {
      const W = 340, H = 190, L = 26, R = 6, T = 14, B = 24;
      const n = series.length;
      const max = Math.max(4, ...series.map((r) => Math.max(r.views, r.clicks)));
      const step = max <= 10 ? 2 : Math.ceil(max / 5 / 5) * 5;
      const top = Math.ceil(max / step) * step;
      const cw = (W - L - R) / n;
      const bw = Math.max(3, Math.min(30, cw * (n > 10 ? 0.62 : 0.58)));
      const y = (v) => T + (H - T - B) * (1 - v / top);
      const peak = series.reduce((m, r, i) => (r.views > series[m].views ? i : m), 0);
      let grid = '';
      for (let v = 0; v <= top; v += step) {
        grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v === 0 ? 0.25 : 0.07})" stroke-dasharray="${v === 0 ? '' : '3 4'}"/>
          <text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9" fill="#6f7a96" font-weight="700">${v}</text>`;
      }
      const labelEvery = n > 10 ? 5 : 1;
      let bars = '', labels = '';
      series.forEach((r, i) => {
        const cx = L + cw * i + cw / 2;
        const h = Math.max(r.views ? 3 : 0, H - B - y(r.views));
        const isPeak = i === peak && r.views > 0;
        bars += `<rect class="bar" data-i="${i}" x="${cx - bw / 2}" y="${H - B - h}" width="${bw}" height="${h}" rx="${Math.min(5, bw / 3)}"
          fill="${isPeak ? 'url(#gPeak)' : 'url(#gBar)'}" ${isPeak ? 'filter="url(#glow)"' : ''}/>
          <rect class="bar" data-i="${i}" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - B - T}" fill="transparent"/>`;
        if (i % labelEvery === 0 || i === n - 1) {
          labels += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="9" font-weight="800" fill="${isPeak ? '#39ff88' : '#7d88a6'}">${fmtDay(r.day)}</text>`;
        }
      });
      const pts = series.map((r, i) => [L + cw * i + cw / 2, y(r.clicks)]);
      const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const dots = n <= 10 ? pts.map(([px, py]) => `<rect x="${px - 3.5}" y="${py - 3.5}" width="7" height="7" rx="1.5" fill="#0b1020" stroke="#38bdf8" stroke-width="2"/>`).join('') : '';
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de visitas e cliques por dia">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(57,255,136,.22)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(57,255,136,.55)" stroke-width="2.2"/></pattern>
          <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff88" stop-opacity=".95"/><stop offset="1" stop-color="#00c853" stop-opacity=".35"/></linearGradient>
          <linearGradient id="gPeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6ffd3"/><stop offset=".35" stop-color="#39ff88"/><stop offset="1" stop-color="#00e676"/></linearGradient>
          <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#16a6e0"/></linearGradient>
          <filter id="glow" x="-60%" y="-30%" width="220%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="glowLine" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        ${grid}${bars}
        <path d="${line}" fill="none" stroke="url(#gLine)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowLine)"/>
        ${dots}${labels}
      </svg>`;
    }

    async function loadStats() {
      const id = state.tenant && state.tenant.id;
      const days = state.perfDays;
      if (!id) return;
      try {
        const data = await api(`/api/me/stats?days=${days}`);
        if (!state.tenant || state.tenant.id !== id) return;
        state.stats = { store: id, days, data };
        const card = $('#perfCard');
        if (card) card.innerHTML = perfInner();
      } catch { /* o resto do painel continua */ }
    }

    function showChartTip(i) {
      const st = state.stats && state.stats.data;
      const wrap = $('#chartWrap');
      if (!st || !wrap) return;
      const r = st.series[i];
      const svg = wrap.querySelector('svg');
      const rect = svg.getBoundingClientRect();
      const n = st.series.length;
      const cx = (26 + ((340 - 32) / n) * i + ((340 - 32) / n) / 2) * (rect.width / 340);
      let tip = wrap.querySelector('.chart-tip');
      if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; wrap.appendChild(tip); }
      tip.innerHTML = `${fmtDay(r.day)} · <b>${nfmt(r.views)} visitas</b> · <u>${nfmt(r.clicks)} cliques</u>${r.orders ? ` · ${nfmt(r.orders)} pedidos` : ''}`;
      tip.style.left = `${Math.min(Math.max(cx, 90), rect.width - 90)}px`;
      wrap.querySelectorAll('rect.bar[fill^="url"]').forEach((b) => { b.style.opacity = Number(b.dataset.i) === i ? '1' : '.45'; });
      clearTimeout(showChartTip.t);
      showChartTip.t = setTimeout(() => { tip.remove(); wrap.querySelectorAll('rect.bar').forEach((b) => { b.style.opacity = ''; }); }, 2600);
    }

    function miniPerf(week) {
      const w = week || [];
      const max = Math.max(1, ...w.map((r) => r.views));
      return `<span class="mini-perf" aria-hidden="true">${w.map((r) => `<i class="${r.views ? '' : 'zero'}" style="height:${Math.max(3, Math.round((r.views / max) * 30))}px"></i>`).join('')}</span>`;
    }

    function header(withPerf = false) {
      const t = state.tenant;

          ${avatar ? `<img class="avatar" src="${esc(avatar)}" alt="">` : `<div class="avatar">${esc(initials(t.store_name))}</div>`}
          <div class="who"><small>Olá, ${esc(String((state.account && state.account.owner_name) || t.owner_name || '').split(' ')[0] || 'lojista')} 👋</small><strong>${esc(t.store_name)}</strong></div>

      return `<div class="pitem fade-in ${hidden ? 'hidden-item' : ''}">

               <button type="button" class="btn btn-primary" data-tab="new" ${isExpired() ? 'disabled' : ''}>Cadastrar produto</button></div>`}

      const canFill = !!(state.config.lookup && state.config.lookup[platform]);
      $('#autofillBtn').hidden = !canFill;
      renderQuota(canFill);
      $('#priceHint').textContent = affiliate
        ? 'Opcional: o preço muda no site parceiro.'
        : 'Deixe vazio para "Preço sob consulta".';

    function renderAccount() {
      const t = state.account || state.tenant;
      const p = plan();
      return `${header()}
        <div class="card">

            <span class="plan-tag ${p.id === 'complete' ? 'gold' : ''}">${esc(p.name)}</span></div>
          <div class="switch-row"><div><strong>O que está incluído</strong><small>${p.stores} ${p.stores === 1 ? 'loja' : 'lojas'} · ${p.templates.length === 1 ? 'modelo 🔥 Destaque do dia' : '3 modelos de mensagem editáveis'} · ${p.lookups} buscas automáticas/hora · tema claro/escuro</small></div></div>

          <label class="field"><span>Nova senha</span><input class="input" type="password" name="new_password" autocomplete="new-password" minlength="4" required placeholder="Mínimo 4 dígitos" inputmode="numeric"></label>
