<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#16a6e0">
  <title>Painel da Loja | Vitrine App</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316a6e0'/%3E%3Cpath d='M18 24h28l-3 22H21z' fill='white'/%3E%3Cpath d='M25 24a7 7 0 0 1 14 0' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <script src="/config.js"></script>
  <style>
    :root {
      --accent: #16a6e0;
      --accent-ink: #ffffff;
      --accent-soft: color-mix(in srgb, var(--accent) 13%, #ffffff);
      --accent-deep: color-mix(in srgb, var(--accent) 75%, #000000);
      --bg: #eef0f4;
      --card: #ffffff;
      --ink: #14161b;
      --ink-2: #3b4150;
      --muted: #8a90a0;
      --line: #e6e8ee;
      --field: #f5f6f8;
      --ok: #16a34a;
      --danger: #e11d48;
      --warn: #f59e0b;
      --wa: #25d366;
      --wa-deep: #128c4b;
      --radius-lg: 26px;
      --radius: 20px;
      --shadow: 0 1px 2px rgba(20, 22, 27, .04), 0 8px 24px rgba(20, 22, 27, .06);
      --shadow-lg: 0 20px 60px rgba(20, 22, 27, .18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.4; -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 12px; }
    [hidden] { display: none !important; }
    svg { flex-shrink: 0; }

    .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px calc(112px + var(--safe-bottom)); }
    @media (min-width: 720px) { .wrap { padding: 28px 24px calc(120px + var(--safe-bottom)); } }

    /* ---------- Componentes ---------- */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card + .card { margin-top: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
    .card .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .btn {
      height: 48px; padding: 0 18px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-weight: 700; font-size: 14px; white-space: nowrap;
      transition: transform .12s ease, filter .15s;
    }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
    .btn-soft { background: var(--accent-soft); color: var(--accent-deep); }
    .btn-ghost { background: var(--field); color: var(--ink-2); }
    .btn-danger { background: color-mix(in srgb, var(--danger) 10%, #fff); color: var(--danger); }
    .btn-wa { background: var(--wa-deep); color: #fff; }
    .btn-block { width: 100%; }
    .btn-sm { height: 38px; padding: 0 12px; border-radius: 11px; font-size: 13px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--field); color: var(--ink-2); }
    .icon-btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, #fff); }

    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field > span, .field-label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
    .field small, .hint { font-size: 12px; color: var(--muted); font-weight: 500; }
    .input, .textarea {
      width: 100%; border: 1.5px solid transparent; background: var(--field);
      border-radius: 14px; padding: 0 14px; height: 50px; font-size: 15px; outline: none;
      transition: border-color .15s, background .15s;
    }
    .textarea { height: auto; min-height: 96px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
    .input:focus, .textarea:focus { border-color: var(--accent); background: #fff; }
    .input-group { display: flex; align-items: center; background: var(--field); border-radius: 14px; border: 1.5px solid transparent; }
    .input-group:focus-within { border-color: var(--accent); background: #fff; }
    .input-group .prefix { padding-left: 14px; color: var(--muted); font-size: 14px; white-space: nowrap; }
    .input-group .input { background: transparent; border: 0; padding-left: 4px; }
    .row { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 560px) { .row.two { grid-template-columns: 1fr 1fr; } }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .seg.two { grid-template-columns: repeat(2, 1fr); }
    .seg label { position: relative; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg .opt {
      display: grid; justify-items: center; gap: 6px; text-align: center;
      padding: 12px 6px; border-radius: 14px; background: var(--field);
      font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer;
      border: 1.5px solid transparent; transition: all .15s;
    }
    .seg .opt .dot { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; }
    .seg input:checked + .opt { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
    .seg input:focus-visible + .opt { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
    .switch-row:first-of-type { border-top: 0; padding-top: 4px; }
    .switch-row strong { display: block; font-size: 14px; }
    .switch-row small { color: var(--muted); font-size: 12px; }
    .switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switch .track { position: absolute; inset: 0; border-radius: 99px; background: #d5d9e1; transition: background .2s; }
    .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); transition: transform .2s; }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(20px); }
    .switch input:focus-visible + .track { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; padding: 3px 7px; border-radius: 7px; }
    .badge.ml { color: #2d3277; background: #fff159; }
    .badge.shopee { color: #fff; background: #ee4d2d; }
    .badge.proprio { color: var(--accent-ink); background: var(--accent); }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; }
    .pill.trial { background: #fff4db; color: #92600a; }
    .pill.active { background: #dcfce7; color: #166534; }
    .pill.expired { background: #ffe4e6; color: #9f1239; }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    /* ---------- Login ---------- */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login-card { width: 100%; max-width: 420px; background: var(--card); border-radius: 30px; box-shadow: var(--shadow-lg); padding: 30px 24px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand-logo { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .brand p { margin: 0; color: var(--muted); font-size: 13px; }
    .error-box { background: #fff1f2; color: #9f1239; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    .login-foot { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
    .login-foot a { color: var(--accent-deep); font-weight: 700; }

    /* ---------- Cabeçalho do painel ---------- */
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .top .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); color: var(--accent-deep); display: grid; place-items: center; font-weight: 800; font-size: 18px; box-shadow: 0 0 0 3px #fff, var(--shadow); flex-shrink: 0; overflow: hidden; }
    .top .who { flex: 1; min-width: 0; }
    .top .who small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .top .who strong { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }

    .share { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 32%, transparent); }
    .share-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .share-head strong { font-size: 16px; letter-spacing: -.01em; }
    .share-head a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .2); padding: 7px 10px; border-radius: 10px; }
    .share-url { display: block; background: rgba(255, 255, 255, .16); border-radius: 12px; padding: 10px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
    .share-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .share-btns button { height: 46px; border-radius: 13px; background: #fff; color: var(--ink); font-weight: 800; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .12s; }
    .share-btns button:active { transform: scale(.97); }
    .share-btns small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); }
    .share-btns .lbl { text-align: left; line-height: 1.15; }
    .msg-area { width: 100%; min-height: 150px; border: 1.5px solid transparent; background: var(--field); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.45; resize: vertical; outline: none; }
    .msg-area:focus { border-color: var(--accent); background: #fff; }
    .dialog .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .pitem.hidden-item { opacity: .6; }
    .pitem.hidden-item .thumb { filter: grayscale(1); }
    .tag-hidden { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 3px 7px; border-radius: 7px; background: #e5e7eb; color: #4b5563; }
    .link-card {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff;
      border-radius: var(--radius); padding: 14px 14px 14px 18px; margin-bottom: 14px;
      box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 32%, transparent);
    }
    .link-card .info { flex: 1; min-width: 0; }
    .link-card small { opacity: .85; font-size: 12px; font-weight: 600; }
    .link-card a.url { display: block; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-card .icon-btn { background: rgba(255, 255, 255, .2); color: #fff; }

    .plan {
      display: flex; gap: 12px; align-items: flex-start;
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; font-size: 13px;
    }
    .plan strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .plan .plan-body { flex: 1; min-width: 0; }
    .plan .btn { margin-top: 10px; }
    .plan.trial { background: #fff8e6; color: #7a4f00; }
    .plan.active { background: #e9fbef; color: #14532d; }
    .plan.expired { background: #fff1f2; color: #881337; }
    .plan .plan-icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .7); flex-shrink: 0; }
    .progress { height: 6px; border-radius: 99px; background: rgba(0, 0, 0, .08); overflow: hidden; margin-top: 8px; }
    .progress > i { display: block; height: 100%; background: currentColor; border-radius: 99px; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; }
    .stat b { display: block; font-size: 20px; letter-spacing: -.02em; }
    .stat span { font-size: 11px; color: var(--muted); font-weight: 600; }

    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 2px 10px; }
    .section-title h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }

    .search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); color: var(--muted); margin-bottom: 12px; }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; color: var(--ink); }

    .plist { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
    .pitem { min-width: 0; display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 10px; }
    .pitem .thumb { width: 64px; height: 64px; border-radius: 14px; background: #f3f4f7; flex-shrink: 0; display: grid; place-items: center; overflow: hidden; color: var(--muted); }
    .pitem .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pitem .meta { flex: 1; min-width: 0; }
    .pitem .meta strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pitem .meta .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
    .pitem .meta .price { color: var(--ink); font-weight: 800; }
    .pitem .acts { display: flex; gap: 6px; }
    .empty { text-align: center; padding: 34px 18px; color: var(--muted); }
    .empty .icon { width: 66px; height: 66px; border-radius: 20px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep); }
    .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

    /* ---------- Formulário de produto ---------- */
    .drop {
      position: relative; display: grid; place-items: center; text-align: center;
      border: 2px dashed #d5d9e1; border-radius: 18px; background: var(--field);
      min-height: 170px; padding: 14px; cursor: pointer; overflow: hidden; transition: border-color .15s;
    }
    .drop:hover, .drop.drag { border-color: var(--accent); }
    .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop img { max-height: 200px; border-radius: 12px; object-fit: contain; }
    .drop .ph { color: var(--muted); font-size: 13px; display: grid; justify-items: center; gap: 6px; }
    .drop .ph b { color: var(--ink-2); }
    .drop .busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .8); font-weight: 700; color: var(--accent-deep); }
    .img-tools { display: flex; gap: 8px; margin-top: 8px; }
    .img-tools .input { height: 42px; font-size: 13px; }

    .colors { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .colors button { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .5); transition: transform .12s; }
    .colors button[aria-pressed="true"] { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
    .colors input[type=color] { width: 40px; height: 40px; border: 0; background: none; padding: 0; cursor: pointer; }

    .avatar-edit { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .avatar-edit .avatar-prev { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-deep); display: grid; place-items: center; font-weight: 800; font-size: 22px; overflow: hidden; flex-shrink: 0; position: relative; }
    .avatar-edit .avatar-prev img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-edit label.btn { position: relative; overflow: hidden; }
    .avatar-edit label.btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .sticky-actions { position: sticky; bottom: calc(92px + var(--safe-bottom)); display: flex; gap: 10px; margin-top: 8px; z-index: 5; }
    .sticky-actions .btn { flex: 1; }

    /* ---------- Navegação ---------- */
    .tabbar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--safe-bottom)); z-index: 40;
      width: min(92vw, 440px); height: 68px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
      background: rgba(255, 255, 255, .93); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: 999px; box-shadow: 0 10px 34px rgba(20, 22, 27, .16); padding: 0 10px;
    }
    .tabbar button { height: 52px; display: grid; place-items: center; color: #9aa0ad; font-size: 10px; font-weight: 700; border-radius: 999px; }
    .tabbar button span { margin-top: -4px; }
    .tabbar button[aria-current="page"] { color: var(--accent); }
    .tabbar button.plus { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 40%, transparent); }

    /* ---------- Modal e toast ---------- */
    .overlay { position: fixed; inset: 0; z-index: 70; background: rgba(12, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .dialog { width: 100%; max-width: 440px; background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 20px calc(20px + var(--safe-bottom)); transform: translateY(24px); transition: transform .22s; }
    .overlay.open .dialog { transform: none; }
    @media (min-width: 640px) { .overlay { align-items: center; } .dialog { border-radius: 26px; } }
    .dialog h3 { margin: 0 0 6px; font-size: 18px; }
    .dialog p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .dialog .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); z-index: 90; transform: translate(-50%, 20px); opacity: 0; background: #14161b; color: #fff; font-size: 13px; font-weight: 600; padding: 11px 16px; border-radius: 999px; box-shadow: var(--shadow-lg); transition: opacity .2s, transform .2s; pointer-events: none; max-width: 92vw; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.err { background: #9f1239; }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fade .25s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <section class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <div class="brand">
        <div class="brand-logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></div>
        <div><h1>Painel da Vitrine</h1><p>Entre para gerenciar sua loja</p></div>
      </div>
      <div class="error-box" id="loginError" hidden></div>
      <label class="field"><span>Endereço da sua loja</span>
        <div class="input-group"><span class="prefix">/s/</span>
          <input class="input" id="loginStore" name="store" placeholder="loja-do-joao" autocapitalize="none" autocomplete="username" spellcheck="false" required>
        </div>
      </label>
      <label class="field"><span>Senha</span>
        <input class="input" id="loginPass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Entrar</button>
      <p class="login-foot">Ainda não tem sua vitrine? <a href="#" id="signupLink">Comece grátis por 7 dias</a></p>
      <p class="login-foot" style="margin-top:8px">Esqueceu a senha? <a href="#" id="forgotLink">Fale com o suporte</a></p>
    </form>
  </section>

  <!-- ================= PAINEL ================= -->
  <div id="appView" hidden>
    <main class="wrap" id="main"></main>
    <nav class="tabbar" aria-label="Seções do painel">
      <button type="button" data-tab="products" aria-current="page">

  <div class="overlay" id="dialogOverlay"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" id="dialog"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const API = String(window.VITRINE_API_BASE || '').replace(/\/+$/, '');
    const TOKEN_KEY = 'vitrine:token';
    const PLATFORM = {
      mercadolivre: { label: 'Mercado Livre', cls: 'ml', color: '#f5c400', ink: '#2d3277', letter: 'ML' },
      shopee: { label: 'Shopee', cls: 'shopee', color: '#ee4d2d', ink: '#fff', letter: 'S' },
      proprio: { label: 'Produto próprio', cls: 'proprio', color: null, ink: '#fff', letter: '★' },
    };
    const PALETTE = ['#16a6e0', '#6366f1', '#8b5cf6', '#ec4899', '#e11d48', '#f97316', '#f59e0b', '#16a34a', '#0d9488', '#14161b'];

    const I = {
      eyeOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.9 0 3.5-.6 4.9-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
      eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
      copy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
      wa: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.2-.3-.3-.5-.4z"/></svg>',
      edit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
      trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
      search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
      box: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>',
      image: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
      clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
      lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
      back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
      out: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>',
    };

    const state = {
      token: null,
      config: { plan_price: '19,90', trial_days: 7, support_whatsapp: '', uploads: false },
      tenant: null,
      settings: null,
      products: [],
      storeUrl: '',
      tab: 'products',
      editing: null,   // produto em edição (null = novo)
      query: '',
    };

    const $ = (s, r = document) => r.querySelector(s);
    const main = $('#main');

    /* ---------------- Utilidades ---------------- */
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const brl = (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
    const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const safeImg = (u) => { const s = String(u || ''); return /^https?:\/\//i.test(s) || /^data:image\/(png|jpe?g|webp);base64,/i.test(s) ? s : ''; };
    const waLink = (phone, text) => `https://api.whatsapp.com/send?${phone ? `phone=${encodeURIComponent(phone)}&` : ''}text=${encodeURIComponent(text)}`;
    const fmtPhone = (d) => {
      const s = String(d || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
      if (s.length === 11) return `(${s.slice(0, 2)}) ${s.slice(2, 7)}-${s.slice(7)}`;
      if (s.length === 10) return `(${s.slice(0, 2)}) ${s.slice(2, 6)}-${s.slice(6)}`;
      return s;
    };
    const priceInput = (v) => (v === null || v === undefined || v === '' ? '' : Number(v).toFixed(2).replace('.', ','));
    const isExpired = () => state.tenant && state.tenant.status === 'expired';
    const ls = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem storage */ } },
      del(k) { try { localStorage.removeItem(k); } catch { /* sem storage */ } },
    };

    let toastTimer;
    function toast(msg, isError = false) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.toggle('err', isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), isError ? 4200 : 2600);
    }

    function applyTheme(hex) {
      const color = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#16a6e0';
      const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
      document.documentElement.style.setProperty('--accent', color);
      document.documentElement.style.setProperty('--accent-ink', (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.68 ? '#14161b' : '#ffffff');
      $('meta[name="theme-color"]').setAttribute('content', color);
    }

    function setBusy(btn, busy, label) {
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.innerHTML;
        btn.innerHTML = `<span class="spinner"></span>${label || 'Salvando...'}`;
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.label || btn.innerHTML;
        btn.disabled = false;
      }
    }

    async function api(path, { method = 'GET', body, raw, contentType } = {}) {
      const headers = { Accept: 'application/json' };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const opts = { method, headers };
      if (raw) { opts.body = raw; headers['Content-Type'] = contentType; }
      else if (body !== undefined) { opts.body = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
      let res;
      try { res = await fetch(API + path, opts); }
      catch { throw Object.assign(new Error('Sem conexão. Verifique sua internet.'), { status: 0 }); }
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 && path !== '/api/auth/login') {
        logout();
        throw Object.assign(new Error(data.error || 'Sessão expirada.'), { status: 401 });
      }
      if (!res.ok) throw Object.assign(new Error(data.error || 'Algo deu errado.'), { status: res.status, code: data.code });
      return data;
    }

    function handleError(err) {
      if (err.status === 402) {
        if (state.tenant) state.tenant.status = 'expired';
        render();
      }
      toast(err.message || 'Algo deu errado.', true);
    }

    function confirmDialog({ title, text, ok = 'Confirmar', danger = false }) {
      return new Promise((resolve) => {
        const ov = $('#dialogOverlay');
        const dlg = $('#dialog');
        dlg.innerHTML = `<h3 id="dlgTitle">${esc(title)}</h3><p>${esc(text)}</p>
          <div class="acts"><button type="button" class="btn btn-ghost" data-r="0">Cancelar</button>
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${esc(ok)}</button></div>`;
        ov.classList.add('open');
        const done = (v) => { ov.classList.remove('open'); ov.onclick = null; document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = (e) => { if (e.key === 'Escape') done(false); };
        document.addEventListener('keydown', onKey);
        ov.onclick = (e) => {
          const b = e.target.closest('[data-r]');
          if (b) done(b.dataset.r === '1');
          else if (e.target === ov) done(false);
        };
        dlg.querySelector('[data-r="1"]').focus();
      });
    }

    async function copy(text, msg = 'Link copiado!') {
      try { await navigator.clipboard.writeText(text); toast(msg); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast(msg); } catch { toast('Não foi possível copiar', true); }
        ta.remove();
      }
    }

    /* ---------------- Compartilhar ---------------- */
    const DEFAULT_SHARE = 'Oi! 😊 Separei meus melhores achadinhos pra você na vitrine *{loja}*. É só clicar e escolher:\n{link}';

    function shareText() {
      const tpl = (state.settings && state.settings.share_message) || DEFAULT_SHARE;
      const msg = tpl.split('{loja}').join(state.tenant.store_name);
      return msg.includes('{link}') ? msg.split('{link}').join(state.storeUrl) : `${msg}\n${state.storeUrl}`;
    }

    function openShareMessage() {
      const ov = $('#dialogOverlay');
      const dlg = $('#dialog');
      dlg.innerHTML = `<h3 id="dlgTitle">💬 Mensagem pronta</h3>
        <p>Para quem te chamou no direct ou no WhatsApp. Edite como quiser antes de enviar.</p>
        <textarea class="msg-area" id="shareMsg" maxlength="600">${esc(shareText())}</textarea>
        <div class="grid-2">
          <button type="button" class="btn btn-soft" data-s="copy">${I.copy}Copiar</button>
          <a class="btn btn-wa" data-s="wa" target="_blank" rel="noopener noreferrer" href="#">${I.wa}WhatsApp</a>
        </div>
        <div class="grid-2">
          <button type="button" class="btn btn-ghost" data-s="close">Fechar</button>
          <button type="button" class="btn btn-ghost" data-s="save">⭐ Salvar padrão</button>
        </div>`;
      ov.classList.add('open');
      const area = $('#shareMsg');
      const wa = dlg.querySelector('[data-s="wa"]');
      const syncWa = () => { wa.href = waLink('', area.value); };
      syncWa();
      area.addEventListener('input', syncWa);
      const close = () => { ov.classList.remove('open'); ov.onclick = null; };
      ov.onclick = async (e) => {
        if (e.target === ov) return close();
        const b = e.target.closest('[data-s]');
        if (!b) return;
        const s = b.dataset.s;
        if (s === 'close') close();
        if (s === 'copy') copy(area.value, 'Mensagem copiada! É só colar no direct 💬');
        if (s === 'save') {
          const tpl = area.value.split(state.storeUrl).join('{link}').split(state.tenant.store_name).join('{loja}');
          try {
            const { settings } = await api('/api/me/settings', { method: 'PUT', body: { share_message: tpl } });
            state.settings = settings;
            toast('Mensagem salva como padrão ⭐');
          } catch (err) { handleError(err); }
        }
      };
      setTimeout(() => area.focus(), 80);
    }

    async function toggleVisible(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      const next = Number(p.is_visible) === 0 ? 1 : 0;
      try {
        await api(`/api/me/products/${id}/visibility`, { method: 'PATCH', body: { is_visible: next } });
        p.is_visible = next;
        toast(next ? 'Produto visível na vitrine 👁' : 'Produto oculto para os clientes');
        render();
      } catch (err) { handleError(err); }
    }

    // Presença: avisa o Master que o lojista está com o painel aberto.
    let pingTimer = null;
    function startPing() {
      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        if (document.visibilityState === 'visible' && state.token) api('/api/me/ping', { method: 'POST' }).catch(() => {});
      }, 60000);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.token && state.tenant) api('/api/me/ping', { method: 'POST' }).catch(() => {});
    });

    /* ---------------- Imagens ---------------- */
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não consegui ler esta imagem.')); };
        img.src = url;
      });
    }

    async function compress(file, maxSide, quality) {
      const img = await loadImage(file);
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const webp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
      if (!webp) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); } // JPEG não tem transparência
      ctx.drawImage(img, 0, 0, w, h);
      const type = webp ? 'image/webp' : 'image/jpeg';
      const blob = await new Promise((r) => canvas.toBlob(r, type, quality));
      if (!blob) throw new Error('Falha ao processar a imagem.');
      return { blob, dataUrl: canvas.toDataURL(type, quality), type };
    }

    // Retorna a URL final da imagem: R2 quando disponível, senão data URL compacta (guardada no D1).
    async function processImage(file, { maxSide = 1200 } = {}) {
      if (!/^image\//.test(file.type)) throw new Error('Escolha um arquivo de imagem.');
      if (file.size > 15 * 1024 * 1024) throw new Error('Imagem muito grande (máx. 15 MB).');
      if (state.config.uploads) {
        const { blob, type } = await compress(file, maxSide, 0.82);
        try {
          const data = await api('/api/me/upload', { method: 'POST', raw: blob, contentType: type });
          return data.url;
        } catch (err) {
          if (err.code !== 'no_r2') throw err;
          state.config.uploads = false;
        }
      }
      const tries = [[720, 0.78], [600, 0.7], [480, 0.62], [380, 0.55]];
      for (const [side, q] of tries) {
        const { dataUrl } = await compress(file, Math.min(side, maxSide), q);
        if (dataUrl.length < 440000) return dataUrl;
      }
      throw new Error('Não consegui reduzir esta imagem. Tente outra.');
    }

    /* ---------------- Sessão ---------------- */
    function showLogin(message) {
      $('#appView').hidden = true;
      $('#loginView').hidden = false;
      const box = $('#loginError');
      box.hidden = !message;
      box.textContent = message || '';
      setTimeout(() => ($('#loginStore').value ? $('#loginPass') : $('#loginStore')).focus(), 50);
    }

    function logout() {
      clearInterval(pingTimer);
      state.token = null;
      state.tenant = null;
      ls.del(TOKEN_KEY);
      showLogin();
    }

    async function loadMe() {
      const data = await api('/api/me');
      state.tenant = data.tenant;
      state.settings = data.settings;
      state.products = data.products;
      state.storeUrl = data.store_url;
      applyTheme(state.tenant.theme_color);
      ls.set('vitrine:last-store', state.tenant.id);
    }

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const store = $('#loginStore').value.trim().toLowerCase().replace(/^.*\/s\//, '').replace(/[^a-z0-9-]/g, '');
      const password = $('#loginPass').value;
      if (!store || !password) return showLogin('Preencha o endereço da loja e a senha.');
      const btn = $('#loginBtn');
      setBusy(btn, true, 'Entrando...');
      try {
        const data = await api('/api/auth/login', { method: 'POST', body: { store_id: store, password } });
        state.token = data.token;
        ls.set(TOKEN_KEY, data.token);
        await loadMe();
        $('#loginPass').value = '';
        $('#loginView').hidden = true;
        $('#appView').hidden = false;
        state.tab = 'products';
        render();
        startPing();
      } catch (err) {
        showLogin(err.message);
      } finally {
        setBusy(btn, false);
      }
    });

    $('#forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      const store = $('#loginStore').value.trim();
      const msg = `Olá! Esqueci a senha da minha vitrine${store ? ` (${store})` : ''}. Pode me ajudar?`;
      window.open(waLink(state.config.support_whatsapp, msg), '_blank', 'noopener');
    });

    $('#signupLink').addEventListener('click', (e) => {
      e.preventDefault();
      location.href = '/?cadastro=1';
    });

    /* ---------------- Renderização ---------------- */
    function planBanner() {
      const t = state.tenant;
      const price = esc(state.config.plan_price);
      const msg = `Olá! Quero assinar o plano da Vitrine (R$ ${state.config.plan_price}/mês) para a loja "${t.store_name}" (${t.id}).`;
      const payBtn = state.config.support_whatsapp
        ? `<a class="btn btn-sm ${t.status === 'expired' ? 'btn-primary' : 'btn-wa'}" href="${esc(waLink(state.config.support_whatsapp, msg))}" target="_blank" rel="noopener noreferrer">${I.wa}Assinar por R$ ${price}/mês</a>`
        : '';
      if (t.status === 'trial') {
        const total = Number(state.config.trial_days) || 7;
        const left = t.trial_days_left;
        const pct = Math.max(4, Math.min(100, Math.round((left / total) * 100)));
        return `<div class="plan trial"><div class="plan-icon">${I.clock}</div><div class="plan-body">
          <strong>Teste grátis: ${left} ${left === 1 ? 'dia restante' : 'dias restantes'}</strong>
          Termina em ${fmtDate(t.trial_ends_at)}. Depois, continue por apenas <b>R$ ${price}/mês</b>.
          <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>${payBtn}</div></div>`;
      }
      if (t.status === 'active') {
        return `<div class="plan active"><div class="plan-icon">${I.check}</div><div class="plan-body">
          <strong>Plano ativo · R$ ${price}/mês</strong>
          ${t.paid_until ? `Válido até ${fmtDate(t.paid_until)} (${t.paid_days_left} ${t.paid_days_left === 1 ? 'dia' : 'dias'}).` : 'Sua vitrine está no ar.'}</div></div>`;
      }
      return `<div class="plan expired"><div class="plan-icon">${I.lock}</div><div class="plan-body">
        <strong>Seu teste grátis terminou</strong>
        Sua vitrine está fora do ar e a edição foi pausada. Assine por <b>R$ ${price}/mês</b> para reativar tudo na hora — seus produtos continuam salvos.

      const t = state.tenant;
      return `${header()}

          <div class="switch-row"><div><strong>Fim do teste grátis</strong><small>${fmtDate(t.trial_ends_at)}</small></div></div>

          <label class="field"><span>Senha atual</span><input class="input" type="password" name="current_password" autocomplete="current-password" required></label>
          <label class="field"><span>Nova senha</span><input class="input" type="password" name="new_password" autocomplete="new-password" minlength="6" required placeholder="Mínimo 6 caracteres"></label>

    function render() {
      if (!state.tenant) return;
      document.querySelectorAll('.tabbar [data-tab]').forEach((b) => {
        const current = b.dataset.tab === state.tab || (b.dataset.tab === 'new' && state.tab === 'form');
        b.setAttribute('aria-current', current ? 'page' : 'false');
      });
      if (state.tab === 'products') main.innerHTML = renderProductsTab();
      else if (state.tab === 'form') { main.innerHTML = renderForm(); updatePlatformHints(); }
      else if (state.tab === 'settings') main.innerHTML = renderSettings();
      else if (state.tab === 'account') main.innerHTML = renderAccount();
    }

    function go(tab) {
      if (tab === 'new') { state.editing = null; tab = 'form'; }
      state.tab = tab;
      render();
      window.scrollTo({ top: 0 });
    }

    /* ---------------- Ações ---------------- */
    async function deleteProduct(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      const ok = await confirmDialog({ title: 'Excluir produto?', text: `"${p.title}" sai da sua vitrine. Esta ação não pode ser desfeita.`, ok: 'Excluir', danger: true });
      if (!ok) return;
      try {
        await api(`/api/me/products/${id}`, { method: 'DELETE' });
        state.products = state.products.filter((x) => x.id !== id);
        toast('Produto excluído');
        go('products');
      } catch (err) { handleError(err); }
    }

    async function saveProduct(form) {
      const fd = new FormData(form);
      const body = {
        title: fd.get('title'),
        description: fd.get('description'),
        price: String(fd.get('price') || '').trim(),
        image_url: fd.get('image_url'),
        affiliate_link: String(fd.get('affiliate_link') || '').trim(),
        platform: fd.get('platform'),
        is_physical: fd.get('is_physical') ? 1 : 0,
        delivery_cities: fd.get('delivery_cities') || '',
        sort_order: fd.get('pinned') ? -1 : 0,
      };
      if (!String(body.title || '').trim()) { toast('Dê um título ao produto.', true); form.title.focus(); return; }
      if (body.platform !== 'proprio' && !body.affiliate_link) { toast('Cole o link de afiliado.', true); form.affiliate_link.focus(); return; }
      if (body.affiliate_link && !/^https?:\/\//i.test(body.affiliate_link)) body.affiliate_link = 'https://' + body.affiliate_link;
      if (body.is_physical && body.platform === 'proprio' && !String(body.delivery_cities).trim()) {
        toast('Informe as cidades onde você entrega.', true); form.delivery_cities.focus(); return;
      }
      const btn = $('#saveProduct');
      setBusy(btn, true);
      try {
        if (state.editing) {
          const { product } = await api(`/api/me/products/${state.editing.id}`, { method: 'PUT', body });
          state.products = state.products.map((x) => (x.id === product.id ? product : x));
          toast('Produto atualizado ✓');
        } else {
          const { product } = await api('/api/me/products', { method: 'POST', body });
          state.products = [product, ...state.products];
          toast('Produto publicado na vitrine ✓');
        }
        state.products.sort((a, b) => a.sort_order - b.sort_order || b.id - a.id);
        state.editing = null;
        go('products');
      } catch (err) {
        handleError(err);
        setBusy(btn, false);
      }
    }

    async function saveSettings() {
      const get = (k) => $(`[data-setting="${k}"]`);
      const body = {
        show_banner: get('show_banner').checked ? 1 : 0,
        show_prices: get('show_prices').checked ? 1 : 0,
        show_stock_warning: get('show_stock_warning').checked ? 1 : 0,
        view_mode: ($('[data-setting="view_mode"]:checked') || {}).value || 'grid',
      };
      try {
        const { settings } = await api('/api/me/settings', { method: 'PUT', body });
        state.settings = settings;
        toast('Vitrine atualizada ✓');
      } catch (err) { handleError(err); }
    }

    async function saveProfile(form) {
      const fd = new FormData(form);
      const body = Object.fromEntries(['store_name', 'owner_name', 'whatsapp', 'avatar_url', 'theme_color'].map((k) => [k, fd.get(k) || '']));
      const btn = $('#saveProfile');
      setBusy(btn, true);
      try {
        const { tenant } = await api('/api/me/profile', { method: 'PUT', body });
        state.tenant = { ...state.tenant, ...tenant };
        applyTheme(state.tenant.theme_color);
        toast('Perfil salvo ✓');
        render();
      } catch (err) { handleError(err); setBusy(btn, false); }
    }

    async function savePassword(form) {
      const fd = new FormData(form);
      const body = { current_password: fd.get('current_password'), new_password: fd.get('new_password') };
      if (String(body.new_password || '').length < 6) return toast('A nova senha precisa de 6 caracteres ou mais.', true);
      const btn = $('#savePass');
      setBusy(btn, true);
      try {
        const data = await api('/api/me/password', { method: 'PUT', body });
        state.token = data.token;
        ls.set(TOKEN_KEY, data.token);
        form.reset();
        toast('Senha atualizada ✓');
      } catch (err) { handleError(err); }
      setBusy(btn, false);
    }

    async function handleProductImage(file) {
      const drop = $('#drop');
      const busy = document.createElement('div');
      busy.className = 'busy';
      busy.innerHTML = '<span class="spinner"></span>&nbsp;Enviando foto...';
      drop.appendChild(busy);
      try {
        const url = await processImage(file);
        setProductImage(url);
      } catch (err) { toast(err.message, true); }
      busy.remove();
    }

    // Busca nome, preço e foto pelo link (API de afiliados configurada no Master).
    let lastFilled = '';
    async function autoFill(manual) {
      const form = $('#productForm');
      if (!form) return;
      const platform = form.platform.value;
      if (!(state.config.lookup && state.config.lookup[platform])) return;
      let link = String(form.affiliate_link.value || '').trim();
      if (!link) { if (manual) { toast('Cole primeiro o link do produto.', true); form.affiliate_link.focus(); } return; }
      if (!/^https?:\/\//i.test(link)) { link = 'https://' + link; form.affiliate_link.value = link; }
      if (!manual && link === lastFilled) return;
      lastFilled = link;
      const btn = $('#autofillBtn');
      setBusy(btn, true, 'Buscando dados do produto...');
      try {
        const { product } = await api('/api/me/lookup', { method: 'POST', body: { url: link } });
        if (product.title && (manual || !form.title.value.trim())) {
          form.title.value = product.title;
          $('#titleCount').textContent = `${product.title.length}/120`;
        }
        if (product.price && (manual || !form.price.value.trim())) form.price.value = priceInput(product.price);
        if (product.image_url && (manual || !$('#imageValue').value)) setProductImage(product.image_url);
        if (!form.description.value.trim() && product.shop_name) {
          const extras = [product.shop_name ? `Loja: ${product.shop_name}` : '', product.rating ? `⭐ ${Number(product.rating).toFixed(1)}` : ''].filter(Boolean).join(' · ');
          form.description.value = extras;
          $('#descCount').textContent = `${extras.length}/1500`;
        }
        toast('✨ Dados do produto preenchidos! Confira e publique.');
      } catch (err) {
        if (manual || err.status !== 501) toast(err.message, true);
      } finally {
        setBusy(btn, false);
      }
    }

    function setProductImage(url) {
      $('#imageValue').value = url || '';
      $('#imgPreview').innerHTML = url
        ? `<img src="${esc(url)}" alt="Prévia">`
        : `<div class="ph">${I.image}<b>Toque para escolher uma foto</b>ou arraste a imagem aqui</div>`;
      $('#clearImg').hidden = !url;
      const isExternal = /^https?:/i.test(url || '') && !url.includes('/api/images/');
      $('#imgUrl').value = isExternal ? url : '';
    }

    function setAvatar(url) {
      $('#avatarValue').value = url || '';
      $('#avatarPrev').innerHTML = url ? `<img src="${esc(url)}" alt="">` : esc(initials(state.tenant.store_name));
      $('#clearAvatar').hidden = !url;
    }

    function setColor(c) {
      $('#themeValue').value = c;
      $('#customColor').value = c;
      document.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === c)));
      applyTheme(c);
    }

    /* ---------------- Eventos ---------------- */
    document.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-tab], [data-act], [data-color]');
      if (!t || t.disabled) return;
      if (t.dataset.tab) return go(t.dataset.tab);
      if (t.dataset.color) return setColor(t.dataset.color);
      const act = t.dataset.act;
      if (act === 'copy-link') return copy(state.storeUrl, 'Link copiado! Cole na sua bio 😉');
      if (act === 'share-msg') return openShareMessage();
      if (act === 'toggle-visible') return toggleVisible(Number(t.dataset.id));
      if (act === 'logout') {
        if (await confirmDialog({ title: 'Sair do painel?', text: 'Você precisará da senha para entrar de novo.', ok: 'Sair' })) logout();
        return;
      }
      if (act === 'edit') {
        state.editing = state.products.find((p) => p.id === Number(t.dataset.id)) || null;
        state.tab = 'form';
        render();
        return window.scrollTo({ top: 0 });
      }
      if (act === 'delete') return deleteProduct(Number(t.dataset.id));
      if (act === 'clear-img') return setProductImage('');
      if (act === 'autofill') return autoFill(true);
      if (act === 'clear-avatar') return setAvatar('');
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'productForm') { e.preventDefault(); saveProduct(e.target); }
      if (e.target.id === 'profileForm') { e.preventDefault(); saveProfile(e.target); }
      if (e.target.id === 'passForm') { e.preventDefault(); savePassword(e.target); }
    });

    document.addEventListener('change', async (e) => {
      const el = e.target;
      if (el.name === 'platform') updatePlatformHints();
      if (el.name === 'affiliate_link' && !state.editing) autoFill(false);
      if (el.id === 'isPhysical') $('#citiesField').hidden = !el.checked;
      if (el.dataset && el.dataset.setting) saveSettings();
      if (el.id === 'imgFile' && el.files[0]) { await handleProductImage(el.files[0]); el.value = ''; }
      if (el.id === 'imgUrl') {
        const v = el.value.trim();
        if (!v) return;
        if (!/^https?:\/\//i.test(v)) return toast('O link da imagem deve começar com https://', true);
        setProductImage(v);
      }
      if (el.id === 'avatarFile' && el.files[0]) {
        try { setAvatar(await processImage(el.files[0], { maxSide: 512 })); toast('Foto pronta. Toque em "Salvar perfil".'); }
        catch (err) { toast(err.message, true); }
        el.value = '';
      }
      if (el.id === 'customColor') setColor(el.value.toLowerCase());
    });

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.id === 'pSearch') {
        state.query = el.value;
        const pos = el.selectionStart;
        render();
        const s = $('#pSearch');
        if (s) { s.focus(); s.setSelectionRange(pos, pos); }
      }
      if (el.name === 'title' && $('#titleCount')) $('#titleCount').textContent = `${el.value.length}/120`;
      if (el.name === 'description' && $('#descCount')) $('#descCount').textContent = `${el.value.length}/1500`;
    });

    ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (drop) { e.preventDefault(); drop.classList.add('drag'); }
    }));
    ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (!drop) return;
      drop.classList.remove('drag');
      if (ev === 'drop') {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files[0];
        if (file && !isExpired()) handleProductImage(file);
      }
    }));

    /* ---------------- Início ---------------- */
    async function init() {
      try {
        const cfg = await fetch(API + '/api/config').then((r) => (r.ok ? r.json() : null));
        if (cfg) state.config = { ...state.config, ...cfg };
      } catch { /* usa padrões */ }

      const last = ls.get('vitrine:last-store');
      if (last) $('#loginStore').value = last;
      const urlStore = new URLSearchParams(location.search).get('loja');
      if (urlStore) $('#loginStore').value = urlStore;

      state.token = ls.get(TOKEN_KEY);
      if (!state.token) return showLogin();
      try {
        await loadMe();
        $('#appView').hidden = false;
        render();
        startPing();
        if (new URLSearchParams(location.search).get('bemvindo')) {
          history.replaceState(null, '', location.pathname);
          toast(`🎉 Vitrine criada! Você tem ${state.tenant.trial_days_left} dias grátis. Cadastre seu 1º produto.`);
        }
      } catch (err) {
        if (err.status !== 401) showLogin(err.message);
      }
    }

    init();
  })();
  </script>
</body>
</html>
