    function render() {
      document.querySelector('.tabbar').hidden = state.view === 'stores';
      if (state.view === 'stores') { main.innerHTML = renderStores(); return; }
      if (!state.tenant) return;
      document.querySelectorAll('.tabbar [data-tab]').forEach((b) => {
        const current = b.dataset.tab === state.tab || (b.dataset.tab === 'new' && state.tab === 'form');
        b.setAttribute('aria-current', current ? 'page' : 'false');
      });
      if (state.tab === 'products') {
        main.innerHTML = renderProductsTab();
        const fresh = state.stats && state.stats.store === state.tenant.id && state.stats.days === state.perfDays && Date.now() - (state.stats.at || 0) < 60_000;
        if (!fresh) loadStats().then(() => { if (state.stats) state.stats.at = Date.now(); });
      }
      else if (state.tab === 'form') { main.innerHTML = renderForm(); updatePlatformHints(); }
      else if (state.tab === 'settings') main.innerHTML = renderSettings();
      else if (state.tab === 'account') main.innerHTML = renderAccount();
    }

    function go(tab) {
      if (tab === 'new') { state.editing = null; tab = 'form'; }
      state.tab = tab;
      render();
      window.scrollTo({ top: 0 });
    }

    /* ---------------- Ações ---------------- */
    async function deleteProduct(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      const ok = await confirmDialog({ title: 'Excluir produto?', text: `"${p.title}" sai da sua vitrine. Esta ação não pode ser desfeita.`, ok: 'Excluir', danger: true });
      if (!ok) return;
      try {
        await api(`/api/me/products/${id}`, { method: 'DELETE' });
        state.products = state.products.filter((x) => x.id !== id);
        toast('Produto excluído');
        go('products');
      } catch (err) { handleError(err); }
    }

    async function saveProduct(form) {
      const fd = new FormData(form);
      const body = {
        title: fd.get('title'),
        description: fd.get('description'),
        price: String(fd.get('price') || '').trim(),
        image_url: fd.get('image_url'),
        affiliate_link: String(fd.get('affiliate_link') || '').trim(),
        platform: fd.get('platform'),
        is_physical: fd.get('is_physical') ? 1 : 0,
        delivery_cities: fd.get('delivery_cities') || '',
        sort_order: fd.get('pinned') ? -1 : 0,
        show_price: fd.get('show_price') ? 1 : 0,
        original_price: String(fd.get('original_price') || '').trim(),
        category: String(fd.get('category') || '').trim(),
      };
      if (!String(body.title || '').trim()) { toast('Dê um título ao produto.', true); form.title.focus(); return; }
      if (body.platform !== 'proprio' && !body.affiliate_link) { toast('Cole o link de afiliado.', true); form.affiliate_link.focus(); return; }
      if (body.affiliate_link && !/^https?:\/\//i.test(body.affiliate_link)) body.affiliate_link = 'https://' + body.affiliate_link;
      if (body.is_physical && body.platform === 'proprio' && !String(body.delivery_cities).trim()) {
        toast('Informe as cidades onde você entrega.', true); form.delivery_cities.focus(); return;
      }
      const btn = $('#saveProduct');
      setBusy(btn, true);
      try {
        if (state.editing) {
          const { product } = await api(`/api/me/products/${state.editing.id}`, { method: 'PUT', body });
          state.products = state.products.map((x) => (x.id === product.id ? product : x));
          toast('Produto atualizado ✓');
        } else {
          const { product } = await api('/api/me/products', { method: 'POST', body });
          state.products = [product, ...state.products];
          toast('Produto publicado na vitrine ✓');
        }
        state.products.sort((a, b) => a.sort_order - b.sort_order || b.id - a.id);
        state.editing = null;
        go('products');
      } catch (err) {
        handleError(err);
        setBusy(btn, false);
      }
    }

    async function saveSettings() {
      const get = (k) => $(`[data-setting="${k}"]`);
      const body = {
        show_banner: get('show_banner').checked ? 1 : 0,
        show_prices: get('show_prices').checked ? 1 : 0,
        show_stock_warning: get('show_stock_warning').checked ? 1 : 0,
        view_mode: ($('[data-setting="view_mode"]:checked') || {}).value || 'grid',
        theme_mode: ($('[data-setting="theme_mode"]:checked') || {}).value || 'light',
        store_mode: ($('[data-setting="store_mode"]:checked') || {}).value || 'mixed',
        show_whatsapp: get('show_whatsapp').checked ? 1 : 0,
        card_tone: ($('[data-setting="card_tone"]:checked') || {}).value || 'white',
      };
      try {
        const before = state.settings && state.settings.store_mode;
        const { settings } = await api('/api/me/settings', { method: 'PUT', body });
        state.settings = settings;
        toast('Vitrine atualizada ✓');
        if (before !== settings.store_mode) { const y = window.scrollY; render(); window.scrollTo(0, y); }
      } catch (err) { handleError(err); }
    }

    async function saveProfile(form) {
      const fd = new FormData(form);
      const body = Object.fromEntries(['store_name', 'owner_name', 'whatsapp', 'avatar_url', 'cover_url', 'theme_color'].map((k) => [k, fd.get(k) || '']));
      const btn = $('#saveProfile');
      setBusy(btn, true);
      try {
        const { tenant } = await api('/api/me/profile', { method: 'PUT', body });
        state.tenant = { ...state.tenant, ...tenant };
        if (state.account) state.account.owner_name = tenant.owner_name;
        toast('Perfil salvo ✓');
        render();
      } catch (err) { handleError(err); setBusy(btn, false); }
    }

    async function savePassword(form) {
      const fd = new FormData(form);
      const body = { current_password: fd.get('current_password'), new_password: fd.get('new_password') };
      if (String(body.new_password || '').length < 4) return toast('A nova senha precisa de 4 dígitos ou mais.', true);
      const btn = $('#savePass');
      setBusy(btn, true);
      try {
        const data = await api('/api/me/password', { method: 'PUT', body });
        state.token = data.token;
        ls.set(TOKEN_KEY, data.token);
        form.reset();
        toast('Senha atualizada ✓');
      } catch (err) { handleError(err); }
      setBusy(btn, false);
    }

    async function handleProductImage(file) {
      const drop = $('#drop');
      const busy = document.createElement('div');
      busy.className = 'busy';
      busy.innerHTML = '<span class="spinner"></span>&nbsp;Enviando foto...';
      drop.appendChild(busy);
      try {
        const url = await processImage(file);
        setProductImage(url);
      } catch (err) { toast(err.message, true); }
      busy.remove();
    }

    function renderQuota(show) {
      const el = $('#quotaHint');
      if (!el) return;
      const q = state.quota;
      el.hidden = !show || !q;
      if (!q) return;
      el.textContent = q.remaining > 0
        ? `✨ ${q.remaining} de ${q.limit} buscas automáticas disponíveis nesta hora`
        : `Buscas automáticas esgotadas nesta hora · libera em ${q.reset_minutes} min`;
    }

    // Preço visível: afiliado começa desligado; produto próprio, ligado (até o lojista mexer na chave).
    let priceTouched = false;
    function syncPriceDefault() {
      const form = $('#productForm');
      if (!form || priceTouched || state.editing) return;
      $('#showPrice').checked = form.platform.value === 'proprio';
    }

    async function onShowPriceChange(el) {
      const form = $('#productForm');
      priceTouched = true;
      if (!el.checked || !form || form.platform.value === 'proprio') return;
      el.checked = false;
      const ok = await confirmDialog({
        title: 'Mostrar o preço deste produto?',
        text: 'O sistema não atualiza os preços sozinho. Se o preço mudar no Mercado Livre ou na Shopee, você precisa editar aqui para corrigir. Tem certeza que quer mostrar o preço?',
        ok: 'Sim, mostrar',
      });
      el.checked = ok;
    }

    // Busca nome, preço e foto pelo link (API de afiliados configurada no Master).
    let lastFilled = '';
    async function autoFill(manual) {
      const form = $('#productForm');
      if (!form) return;
      const platform = form.platform.value;
      if (!(state.config.lookup && state.config.lookup[platform])) return;
      let link = String(form.affiliate_link.value || '').trim();
      if (!link) { if (manual) { toast('Cole primeiro o link do produto.', true); form.affiliate_link.focus(); } return; }
      if (!/^https?:\/\//i.test(link)) { link = 'https://' + link; form.affiliate_link.value = link; }
      if (!manual && link === lastFilled) return;
      lastFilled = link;
      const btn = $('#autofillBtn');
      setBusy(btn, true, 'Buscando dados do produto...');
      try {
        const { product, quota } = await api('/api/me/lookup', { method: 'POST', body: { url: link } });
        if (quota) { state.quota = quota; renderQuota(true); }
        if (product.title && (manual || !form.title.value.trim())) {
          form.title.value = product.title;
          $('#titleCount').textContent = `${product.title.length}/120`;
        }
        if (product.price && (manual || !form.price.value.trim())) form.price.value = priceInput(product.price);
        if (product.original_price && (manual || !form.original_price.value.trim())) form.original_price.value = priceInput(product.original_price);
        if (product.image_url && (manual || !$('#imageValue').value)) setProductImage(product.image_url);
        if (!form.description.value.trim() && product.shop_name) {
          const extras = [product.shop_name ? `Loja: ${product.shop_name}` : '', product.rating ? `⭐ ${Number(product.rating).toFixed(1)}` : ''].filter(Boolean).join(' · ');
          form.description.value = extras;
          $('#descCount').textContent = `${extras.length}/1500`;
        }
        if (product.source === 'title_match') toast('✨ Encontrei pelo nome. Confira se a foto e o preço batem com o seu anúncio.');
        else if (product.source === 'preview') toast('✨ Nome e foto preenchidos. Confira e, se quiser, coloque o preço.');
        else toast('✨ Dados do produto preenchidos! Confira e publique.');
      } catch (err) {
        if (err.code === 'quota') { lastFilled = ''; if (state.quota) { state.quota.remaining = 0; renderQuota(true); } }
        if (manual || err.status !== 501) toast(err.message, true);
      } finally {
        setBusy(btn, false);
      }
    }

    function setProductImage(url) {
      $('#imageValue').value = url || '';
      $('#imgPreview').innerHTML = url
        ? `<img src="${esc(url)}" alt="Prévia">`
        : `<div class="ph">${I.image}<b>Toque para escolher uma foto</b>ou arraste a imagem aqui</div>`;
      $('#clearImg').hidden = !url;
      const isExternal = /^https?:/i.test(url || '') && !url.includes('/api/images/');
      $('#imgUrl').value = isExternal ? url : '';
    }


    /* ---------------- Editor da capa: arrastar e zoom ---------------- */
    const COVER_W = 1400, COVER_H = 788; // 16:9, o formato do topo da vitrine
    async function openCoverCrop(file) {
      if (!/^image\//.test(file.type)) return toast('Escolha um arquivo de imagem.', true);
      const img = await loadImage(file);
      const ov = $('#dialogOverlay');
      const dlg = $('#dialog');
      dlg.innerHTML = `<h3 id="dlgTitle">🖼️ Ajustar capa</h3>
        <div class="crop-frame" id="cropFrame"><img id="cropImg" alt=""></div>
        <p class="crop-hint">Arraste a foto para posicionar. Use o controle para dar zoom.</p>
        <div class="crop-zoom"><span>➖</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom"><span>➕</span></div>
        <div class="grid-2">
          <button type="button" class="btn btn-ghost" data-c="cancel">Cancelar</button>
          <button type="button" class="btn btn-primary" data-c="ok">Usar esta capa</button>
        </div>`;
      ov.classList.add('open');
      const frame = $('#cropFrame');
      const el = $('#cropImg');
      const previewUrl = URL.createObjectURL(file);
      el.src = previewUrl;
      const W = () => frame.clientWidth, H = () => frame.clientHeight;
      // base = escala mínima para cobrir o quadro; zoom multiplica
      let zoom = 1, x = 0, y = 0;
      const base = () => Math.max(W() / img.naturalWidth, H() / img.naturalHeight);
      const clamp = () => {
        const sc = base() * zoom;
        const iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
        x = Math.min(0, Math.max(W() - iw, x));
        y = Math.min(0, Math.max(H() - ih, y));
      };
      const draw = () => { clamp(); el.style.transform = `translate(${x}px, ${y}px) scale(${base() * zoom})`; };
      // começa centralizada
      requestAnimationFrame(() => {
        const sc = base();
        x = (W() - img.naturalWidth * sc) / 2;
        y = (H() - img.naturalHeight * sc) / 2;
        draw();
      });
      const pointers = new Map();
      let last = null, pinch = null;
      frame.onpointerdown = (e) => { frame.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = { x: e.clientX, y: e.clientY }; };
      frame.onpointermove = (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2) {
          // pinça com dois dedos = zoom
          const [a, b] = [...pointers.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (pinch) setZoom(zoom * (d / pinch));
          pinch = d;
          return;
        }
        x += e.clientX - last.x; y += e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
        draw();
      };
      const up = (e) => { pointers.delete(e.pointerId); pinch = null; const rest = [...pointers.values()][0]; last = rest || null; };
      frame.onpointerup = up; frame.onpointercancel = up;
      frame.onwheel = (e) => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 0.93)); };
      function setZoom(z) {
        const nz = Math.min(3, Math.max(1, z));
        // mantém o centro do quadro no mesmo ponto da foto
        const cx = W() / 2, cy = H() / 2;
        const k = nz / zoom;
        x = cx - (cx - x) * k; y = cy - (cy - y) * k;
        zoom = nz; $('#cropZoom').value = String(nz);
        draw();
      }
      $('#cropZoom').oninput = (e) => setZoom(Number(e.target.value));
      const close = () => { ov.classList.remove('open'); ov.onclick = null; URL.revokeObjectURL(previewUrl); };
      ov.onclick = async (e) => {
        if (e.target === ov) return close();
        const b = e.target.closest('[data-c]');
        if (!b) return;
        if (b.dataset.c === 'cancel') return close();
        setBusy(b, true, 'Preparando...');
        try {
          // recorta exatamente o que está no quadro, em 1400x788
          const sc = base() * zoom;
          const sx = -x / sc, sy = -y / sc, sw = W() / sc, sh = H() / sc;
          const canvas = document.createElement('canvas');
          canvas.width = COVER_W; canvas.height = COVER_H;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, COVER_W, COVER_H);
          const webp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
          const type = webp ? 'image/webp' : 'image/jpeg';
          let url = '';
          if (state.config.uploads) {
            const blob = await new Promise((r) => canvas.toBlob(r, type, 0.8));
            try { url = (await api('/api/me/upload', { method: 'POST', raw: blob, contentType: type })).url; } catch { url = ''; }
          }
          if (!url) {
            for (const [w, q] of [[1400, 0.74], [1200, 0.68], [1000, 0.62], [800, 0.56]]) {
              let c = canvas;
              if (w < COVER_W) { c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * 9 / 16); c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); }
              const d = c.toDataURL(type, q);
              if (d.length < 440000) { url = d; break; }
            }
          }
          if (!url) throw new Error('Não consegui reduzir esta imagem. Tente outra.');
          close();
          setCover(url);
          toast('Capa pronta. Toque em "Salvar perfil".');
        } catch (err) { toast(err.message, true); setBusy(b, false); }
      };
    }

    function setCover(url) {
      $('#coverValue').value = url || '';
      const box = $('#coverPrev');
      box.querySelectorAll(':scope > img, :scope > .cover-empty').forEach((n) => n.remove());
      box.insertAdjacentHTML('afterbegin', url ? `<img src="${esc(url)}" alt="">` : '<span class="cover-empty">Sem capa: o topo usa a cor da loja.</span>');
      $('#clearCover').hidden = !url;
    }

    function setAvatar(url) {
      $('#avatarValue').value = url || '';
      $('#avatarPrev').innerHTML = url ? `<img src="${esc(url)}" alt="">` : esc(initials(state.tenant.store_name));
      $('#clearAvatar').hidden = !url;
    }

    function setColor(c) {
      $('#themeValue').value = c;
      $('#customColor').value = c;
      document.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === c)));
      const prev = $('#colorPreview');
      if (prev) prev.style.background = `linear-gradient(135deg, ${c}, color-mix(in srgb, ${c} 70%, #000))`;
    }

    /* ---------------- Eventos ---------------- */
    document.addEventListener('click', async (e) => {
      const perf = e.target.closest('[data-perf]');
      if (perf) {
        state.perfDays = Number(perf.dataset.perf) === 30 ? 30 : 7;
        ls.set('vitrine:perf-days', String(state.perfDays));
        $('#perfCard').innerHTML = perfInner();
        return loadStats();
      }
      const bar = e.target.closest('#chartWrap rect.bar');
      if (bar) return showChartTip(Number(bar.dataset.i));
      const cat = e.target.closest('[data-cat]');
      if (cat) {
        const input = $('[name="category"]');
        const same = input.value === cat.dataset.cat;
        input.value = same ? '' : cat.dataset.cat;
        document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', String(!same && b === cat)));
        return;
      }
      const t = e.target.closest('[data-tab], [data-act], [data-color], [data-model]');
      if (!t || t.disabled) return;
      if (t.dataset.tab) return go(t.dataset.tab);
      if (t.dataset.color) return setColor(t.dataset.color);
      const act = t.dataset.act || (t.dataset.model ? 'model' : '');
      if (act === 'copy-link') return copy(state.storeUrl, 'Link copiado! Cole na sua bio 😉');
      if (act === 'share-msg') return openShareMessage();
      if (act === 'toggle-visible') return toggleVisible(Number(t.dataset.id));
      if (act === 'logout') {
        if (await confirmDialog({ title: 'Sair do painel?', text: 'Você precisará da senha para entrar de novo.', ok: 'Sair' })) logout();
        return;
      }
      if (act === 'edit') {
        state.editing = state.products.find((p) => p.id === Number(t.dataset.id)) || null;
        state.tab = 'form';
        render();
        return window.scrollTo({ top: 0 });
      }
      if (act === 'delete') return deleteProduct(Number(t.dataset.id));
      if (act === 'clear-img') return setProductImage('');
      if (act === 'autofill') return autoFill(true);
      if (act === 'offer-generate') return generateOffer();
      if (act === 'offer-copy') return copy($('#offerText').value, 'Oferta copiada! É só colar 🔥');
      if (act === 'offer-wa') return window.open(waLink('', $('#offerText').value), '_blank', 'noopener');
      if (act === 'offer-save') return saveOfferAsProduct();
      if (act === 'offer-clear') { state.offer = null; return render(); }
      if (act === 'offer') return openProductOffer(Number(t.dataset.id));
      if (act === 'model') return setOfferModel(Number(t.dataset.model));
      if (act === 'clear-avatar') return setAvatar('');
      if (act === 'clear-cover') { setCover(''); return toast('Capa removida. Toque em "Salvar perfil".'); }
      if (act === 'stores') return showStores();
      if (act === 'open-store') return openStore(t.dataset.id);
      if (act === 'new-store') return openNewStore();
      if (act === 'upgrade') return openPay('complete');
      if (act === 'pay') return openPay(t.dataset.plan);
      if (act === 'plans') return openPay();
      if (act === 'trial-hide') { ls.set(`vitrine:trial-hide:${(state.account || {}).id || ''}`, String(Date.now())); return render(); }
      if (act === 'tpl-edit') return openTemplateEditor();
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'productForm') { e.preventDefault(); saveProduct(e.target); }
      if (e.target.id === 'profileForm') { e.preventDefault(); saveProfile(e.target); }
      if (e.target.id === 'passForm') { e.preventDefault(); savePassword(e.target); }
    });

    document.addEventListener('change', async (e) => {
      const el = e.target;
      if (el.name === 'platform') { updatePlatformHints(); syncPriceDefault(); }
      if (el.id === 'showPrice') onShowPriceChange(el);
      if (el.name === 'affiliate_link' && !state.editing) autoFill(false);
      if (el.id === 'isPhysical') $('#citiesField').hidden = !el.checked;
      if (el.dataset && el.dataset.setting) saveSettings();
      if (el.id === 'imgFile' && el.files[0]) { await handleProductImage(el.files[0]); el.value = ''; }
      if (el.id === 'imgUrl') {
        const v = el.value.trim();
        if (!v) return;
        if (!/^https?:\/\//i.test(v)) return toast('O link da imagem deve começar com https://', true);
        setProductImage(v);
      }
      if (el.id === 'coverFile' && el.files[0]) {
        try { await openCoverCrop(el.files[0]); } catch (err) { toast(err.message || 'Não consegui abrir esta imagem.', true); }
        el.value = '';
      }
      if (el.id === 'avatarFile' && el.files[0]) {
        try { setAvatar(await processImage(el.files[0], { maxSide: 512 })); toast('Foto pronta. Toque em "Salvar perfil".'); }
        catch (err) { toast(err.message, true); }
        el.value = '';
      }
      if (el.id === 'customColor') setColor(el.value.toLowerCase());
    });

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.id === 'pSearch') {
        state.query = el.value;
        const pos = el.selectionStart;
        render();
        const s = $('#pSearch');
        if (s) { s.focus(); s.setSelectionRange(pos, pos); }
      }
      if (el.dataset && el.dataset.offer) { state.offer[el.dataset.offer] = el.value; updateOfferPreview(); return; }
      if (el.name === 'category') document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === el.value)));
      if (el.name === 'title' && $('#titleCount')) $('#titleCount').textContent = `${el.value.length}/120`;
      if (el.name === 'description' && $('#descCount')) $('#descCount').textContent = `${el.value.length}/1500`;
    });

    ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (drop) { e.preventDefault(); drop.classList.add('drag'); }
    }));
    ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (!drop) return;
      drop.classList.remove('drag');
      if (ev === 'drop') {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files[0];
        if (file && !isExpired()) handleProductImage(file);
      }
    }));

    /* ---------------- Início ---------------- */
    async function init() {
      try {
        const cfg = await fetch(API + '/api/config').then((r) => (r.ok ? r.json() : null));
        if (cfg) state.config = { ...state.config, ...cfg };
      } catch { /* usa padrões */ }

      const last = ls.get('vitrine:last-login');
      if (last) $('#loginStore').value = last;
      const urlStore = new URLSearchParams(location.search).get('loja');
      if (urlStore) $('#loginStore').value = urlStore;

      state.token = ls.get(TOKEN_KEY);
      if (!state.token) return showLogin();
      try {
        const welcome = new URLSearchParams(location.search).get('bemvindo');
        const paidId = new URLSearchParams(location.search).get('pago');
        if (paidId) {
          history.replaceState(null, '', location.pathname);
          setTimeout(() => { toast('Confirmando seu pagamento...'); watchPayment(Number(paidId)); }, 600);
        }
        state.storeId = ls.get(STORE_KEY);
        if (welcome) {
          await loadMe();
          state.view = 'app';
          $('#appView').hidden = false;
          render();
          startPing();
          history.replaceState(null, '', location.pathname);
          toast(`🎉 Vitrine criada! Teste grátis do plano Completo por ${state.account ? state.account.trial_days_left : 7} dias. Cadastre seu 1º produto.`);
        } else {
          await loadStores();
          if (state.storeId && !state.stores.some((x) => x.id === state.storeId)) state.storeId = null;
          // Recarregar a página volta para a loja que estava aberta.
          if (state.storeId || !wantsPicker()) {
            await loadMe();
            state.view = 'app';
            $('#appView').hidden = false;
            render();
            startPing();
          } else {
            await afterLogin();
          }
        }
      } catch (err) {
        if (err.status !== 401) showLogin(err.message);
      }
    }

    init();
  })();
  </script>
</body>
</html>
